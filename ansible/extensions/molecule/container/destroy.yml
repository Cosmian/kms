---
- name: Remove the KMS container and its configuration
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Remove the KMS container
      community.docker.docker_container:
        name: cosmian-kms
        state: absent

    - name: Remove the KMS configuration
      ansible.builtin.file:
        path: /etc/cosmian
        state: absent
