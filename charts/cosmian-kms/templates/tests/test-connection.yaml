apiVersion: v1
kind: Pod
metadata:
  name: {{ include "cosmian-kms.fullname" . }}-test-connection
  labels:
    {{- include "cosmian-kms.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - wget
      args:
        - --spider
        - -q
        - http://{{ include "cosmian-kms.fullname" . }}:{{ .Values.service.port }}/health
  restartPolicy: Never
