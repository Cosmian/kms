{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cosmian-kms.fullname" . }}
  labels:
    {{- include "cosmian-kms.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cosmian-kms.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        # Default: allow ingress only from within the same namespace.
        # Override with networkPolicy.ingressFrom for cross-namespace access.
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.kms.port }}
  {{- if .Values.networkPolicy.egress }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
  {{- end }}
{{- end }}
