{{- /* Fail early: sqlite + multiple replicas = ReadWriteOnce PVC conflict. */ -}}
{{- if and (eq .Values.kms.database.type "sqlite") (gt (int .Values.replicaCount) 1) (not .Values.autoscaling.enabled) }}
  {{- fail "replicaCount > 1 requires a non-sqlite database backend (postgresql/mysql); sqlite uses a ReadWriteOnce PVC that cannot be shared across pods" }}
{{- end }}
{{- if and (eq .Values.kms.database.type "sqlite") .Values.autoscaling.enabled (gt (int .Values.autoscaling.minReplicas) 1) }}
  {{- fail "autoscaling.minReplicas > 1 requires a non-sqlite database backend (postgresql/mysql); sqlite uses a ReadWriteOnce PVC that cannot be shared across pods" }}
{{- end }}
{{- /* Validate TLS: enabled requires existingSecret. */ -}}
{{- if and .Values.kms.tls.enabled (not .Values.kms.tls.existingSecret) }}
  {{- fail "kms.tls.existingSecret is required when kms.tls.enabled is true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cosmian-kms.fullname" . }}
  labels:
    {{- include "cosmian-kms.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cosmian-kms.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "cosmian-kms.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cosmian-kms.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kms
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ include "cosmian-kms.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --database-type
            - {{ .Values.kms.database.type | quote }}
            {{- if eq .Values.kms.database.type "sqlite" }}
            - --sqlite-path
            - {{ .Values.kms.database.sqlitePath | quote }}
            {{- end }}
            - --hostname
            - {{ .Values.kms.hostname | quote }}
            - --port
            - {{ .Values.kms.port | quote }}
            {{- if .Values.kms.database.clearDatabase }}
            - --clear-database
            {{- end }}
            {{- if .Values.kms.tls.enabled }}
            - --tls-cert-file
            - /etc/cosmian-kms/tls/tls.crt
            - --tls-key-file
            - /etc/cosmian-kms/tls/tls.key
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: KMS_ROOT_DATA_PATH
              value: /var/lib/cosmian-kms/workspace
            - name: KMS_DEFAULT_USERNAME
              value: {{ .Values.kms.defaultUsername | quote }}
            {{- if .Values.kms.corsAllowedOrigins }}
            - name: KMS_CORS_ALLOWED_ORIGINS
              value: {{ .Values.kms.corsAllowedOrigins | quote }}
            {{- end }}
            {{- if .Values.kms.serverWorkers }}
            - name: KMS_SERVER_WORKERS
              value: {{ .Values.kms.serverWorkers | quote }}
            {{- end }}
            {{- if .Values.kms.rateLimitPerSecond }}
            - name: KMS_RATE_LIMIT_PER_SECOND
              value: {{ .Values.kms.rateLimitPerSecond | quote }}
            {{- end }}
            {{- if .Values.kms.jwksEnabled }}
            - name: KMS_JWKS_ENABLED
              value: "true"
            {{- end }}
            {{- if not .Values.kms.uiEnabled }}
            - name: KMS_UI_ENABLE
              value: "false"
            {{- end }}
            {{- if or .Values.kms.database.url .Values.kms.database.existingSecret }}
            - name: KMS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kms.database.existingSecret | default (printf "%s-db" (include "cosmian-kms.fullname" .)) }}
                  key: database-url
            {{- end }}
            {{- if eq .Values.kms.database.type "redis-findex" }}
            - name: KMS_REDIS_MASTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kms.database.existingSecret | default (printf "%s-db" (include "cosmian-kms.fullname" .)) }}
                  key: redis-master-password
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.kms.port }}
              protocol: TCP
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /var/lib/cosmian-kms/workspace
            {{- if and (eq .Values.kms.database.type "sqlite") .Values.persistence.enabled }}
            - name: sqlite-data
              mountPath: {{ .Values.kms.database.sqlitePath }}
            {{- end }}
            {{- if .Values.kms.tls.enabled }}
            - name: tls
              mountPath: /etc/cosmian-kms/tls
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: workspace
          emptyDir: {}
        {{- if and (eq .Values.kms.database.type "sqlite") .Values.persistence.enabled }}
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: {{ include "cosmian-kms.pvcName" . }}
        {{- end }}
        {{- if .Values.kms.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.kms.tls.existingSecret }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
