pre_install_script = '''
#!/bin/bash -ex

has_systemd() {
  command -v systemctl >/dev/null 2>&1 && [ -d /run/systemd/system ]
}

# Backup existing configuration
KMS_CONFIG="/etc/cosmian/kms.toml"
if [ -f $KMS_CONFIG ]; then
  mkdir -p /etc/cosmian
  timestamp=$(date '+%Y%m%d_%H%M%S')
  # Double backup just in case
  cp $KMS_CONFIG /etc/cosmian/"$timestamp"_kms.toml
  cp $KMS_CONFIG /etc/cosmian/kms.toml.bak
fi

# Backup existing UI branding overrides (if any)
UI_DIST="/usr/local/cosmian/ui/dist"
UI_BACKUP_DIR="/var/lib/cosmian/ui"
if [ -d "$UI_DIST" ]; then
  mkdir -p "$UI_BACKUP_DIR"
  if [ -f "$UI_DIST/branding.json" ]; then
    cp "$UI_DIST/branding.json" "$UI_BACKUP_DIR/branding.json.bak"
  fi
  if [ -d "$UI_DIST/themes" ]; then
    rm -rf "$UI_BACKUP_DIR/themes.bak"
    cp -R "$UI_DIST/themes" "$UI_BACKUP_DIR/themes.bak"
  fi
fi

# Record the service state across an upgrade ($1 >= 2). The %postun of <= 5.29.0 stops AND
# disables the unit during an upgrade (rpm runs it after the new %post); %posttrans restores
# the state from these markers.
STATE_DIR="/var/lib/cosmian"
rm -f "$STATE_DIR/upgrade-service-enabled" "$STATE_DIR/upgrade-service-active"
if [ "${1:-1}" -ge 2 ] && has_systemd; then
  mkdir -p "$STATE_DIR"
  if systemctl is-enabled --quiet cosmian_kms.service; then
    touch "$STATE_DIR/upgrade-service-enabled"
  fi
  if systemctl is-active --quiet cosmian_kms.service; then
    touch "$STATE_DIR/upgrade-service-active"
  fi
fi

'''

post_install_script = '''
#!/bin/bash -ex

has_systemd() {
  command -v systemctl >/dev/null 2>&1 && [ -d /run/systemd/system ]
}

# Restore existing configuration
KMS_CONFIG="/etc/cosmian/kms.toml.bak"
if [ -f $KMS_CONFIG ]; then
  mkdir -p /etc/cosmian
  cp $KMS_CONFIG /etc/cosmian/kms.toml
fi

# Do not hard-fail or auto-enable/start services at install time.
# Some environments have systemctl but no running systemd (containers/chroots).
if has_systemd; then
  systemctl daemon-reload >/dev/null 2>&1 || true
fi

# Restore UI branding overrides (if any)
UI_DIST="/usr/local/cosmian/ui/dist"
UI_BACKUP_DIR="/var/lib/cosmian/ui"
if [ -d "$UI_DIST" ]; then
  if [ -f "$UI_BACKUP_DIR/branding.json.bak" ]; then
    if [ ! -f "$UI_DIST/branding.json" ]; then
      cp "$UI_BACKUP_DIR/branding.json.bak" "$UI_DIST/branding.json"
    else
      if ! cmp -s "$UI_BACKUP_DIR/branding.json.bak" "$UI_DIST/branding.json"; then
        cp "$UI_BACKUP_DIR/branding.json.bak" "$UI_DIST/branding.json.rpmold"
      fi
    fi
  fi

  if [ -d "$UI_BACKUP_DIR/themes.bak" ]; then
    if [ ! -d "$UI_DIST/themes" ]; then
      cp -R "$UI_BACKUP_DIR/themes.bak" "$UI_DIST/themes"
    else
      cp -R "$UI_BACKUP_DIR/themes.bak" "$UI_DIST/themes.rpmold"
    fi
  fi
fi

'''

pre_uninstall_script = '''
#!/bin/bash
set -e

has_systemd() {
  command -v systemctl >/dev/null 2>&1 && [ -d /run/systemd/system ]
}

case "$1" in
0)
  # erase: stop and disable before rpm removes the files
  if has_systemd; then
    systemctl stop    cosmian_kms.service >/dev/null 2>&1 || true
    systemctl disable cosmian_kms.service >/dev/null 2>&1 || true
    systemctl daemon-reload >/dev/null 2>&1 || true
  fi
  ;;
esac

'''

post_uninstall_script = '''
#!/bin/bash

set -x

# Erase only: the service is stopped and disabled by pre_uninstall_script. On upgrade ($1 >= 1)
# the service state is kept.
case "$1" in
0)
  # erase: remove binary and bundled libraries
  rm -f  /usr/sbin/cosmian_kms
  rm -rf /usr/local/cosmian
  ;;
esac

'''

# %posttrans runs after the old package's %postun, which (<= 5.29.0) disables the unit on
# upgrade. Never branch on $1 here: markers only.
post_trans_script = '''
#!/bin/bash

has_systemd() {
  command -v systemctl >/dev/null 2>&1 && [ -d /run/systemd/system ]
}

if has_systemd; then
  systemctl daemon-reload >/dev/null 2>&1 || true
  if [ -f /var/lib/cosmian/upgrade-service-enabled ]; then
    systemctl enable cosmian_kms.service >/dev/null 2>&1 || true
  fi
  if [ -f /var/lib/cosmian/upgrade-service-active ]; then
    systemctl restart cosmian_kms.service >/dev/null 2>&1 || true
  fi
fi
rm -f /var/lib/cosmian/upgrade-service-enabled /var/lib/cosmian/upgrade-service-active

'''
