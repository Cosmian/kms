[default.extend-identifiers]
HashiCorp = "HashiCorp"

[default.extend-words]
Veeam = "Veeam"
GOST = "GOST"
vas = "vas"
passin = "passin"
typ = "typ"
Hashi = "Hashi"
# SAP ASE installer feature id (CHOSEN_FEATURE_LIST=fase_srv,...), not a typo of "phase".
fase = "fase"
# Unicode hex code points inside SVG font unicode-range (e.g. U+1F6BA)
BA = "BA"
# Common standards acronym in cryptographic references.
SHS = "SHS"
# Tokens frequently present in certificate/base64 payload snippets.
UE = "UE"
OT = "OT"
Fo = "Fo"
# OAuth client IDs can contain this sequence.
ot = "ot"
# ISO/IEC 27034 term: Application Normative Framework
ANF = "ANF"
# Intel CPU flag: Total Memory Encryption
tme = "tme"
# Plural of PNG (image format)
PNGs = "PNGs"
# Base64url fragment inside an example JWK "y" coordinate in openapi.yaml.
Stik = "Stik"
# Matches the "hsm_delegation_benchs" branch name, required verbatim as the
# CHANGELOG/<branch-name>.md filename convention.
benchs = "benchs"
# Security Information and Event Management
SIEM = "SIEM"
SIEMs = "SIEMs"
SIE = "SIE"
sie = "sie"
# Real pkcs11-sys constant names (PKCS#11 spec), not typos: EDE (Encrypt-Decrypt-
# Encrypt) triple-DES naming, and PROBABLISTIC is a legacy spec misspelling kept
# verbatim in pkcs11-sys as a distinct compat-alias constant.
EDE = "EDE"
PROBABLISTIC = "PROBABLISTIC"
