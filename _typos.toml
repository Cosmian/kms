[default.extend-words]
Veeam = "Veeam"
GOST = "GOST"
vas = "vas"
passin = "passin"
typ = "typ"
# Unicode hex code points inside SVG font unicode-range (e.g. U+1F6BA)
BA = "BA"
# Common standards acronym in cryptographic references.
SHS = "SHS"
# Tokens frequently present in certificate/base64 payload snippets.
UE = "UE"
OT = "OT"
Fo = "Fo"
# OAuth client IDs can contain this sequence.
ot = "ot"
# ISO/IEC 27034 term: Application Normative Framework
ANF = "ANF"
# Mermaid SVG CSS class name for composite states
composit = "composit"

[files]
extend-exclude = ["documentation/presentation/slides_desc.md", "documentation/presentation/diagrams/*.svg"]
