# mise.toml — Cosmian KMS development environment & task runner
# See https://mise.jdx.dev/configuration.html

[env]
RUST_BACKTRACE = "1"

[tools]
node = "22"
"npm:pnpm" = "10.17.1"
usage = "6.3.0"
# SBOM / CBOM generation tools — pinned to specific versions for reproducibility
"cargo:cargo-cyclonedx" = "0.5.9"
"cargo:cargo-sbom" = "0.10.0"
"npm:@cyclonedx/cdxgen" = "12.8.4"
# Rust is managed by rust-toolchain.toml (mise auto-detects)

[task_config]
dir = "{{config_root}}"
includes = [".mise/tasks"]
