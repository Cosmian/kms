default_username = "admin"

# Specifies which KMIP object types should be automatically unwrapped when retrieved.
# Repeat this option to specify multiple object types.
# Allowed values: All, Certificate, CertificateRequest, OpaqueObject, PGPKey, PrivateKey, PublicKey, SecretData, SplitKey, SymmetricKey
# Example:
## default_unwrap_type = ["SecretData", "SymmetricKey"]

# ── HSM configuration ─────────────────────────────────────────────────────────
#
# Two UID formats are supported:
#
# Legacy flat format (backward-compatible):
#   UIDs: hsm::<slot_id>::<key_id>  (e.g. hsm::0::my_aes_key)
#   Configure with top-level fields:
#     hsm_model = "softhsm2"
#     hsm_admin = ["admin"]
#     hsm_slot = [0]
#     hsm_password = ["changeme"]
#
# Multi-instance format:
#   UIDs: hsm::<model>::<slot_id>::<key_id>  (e.g. hsm::softhsm2::0::my_aes_key)
#   Configure with [[hsm_instances]] sections (one per device):
#
## [[hsm_instances]]
## hsm_model    = "softhsm2"           # softhsm2 | utimaco | proteccio | crypt2pay | smartcardhsm | aws_cloudhsm | other
## hsm_admin    = ["tech@example.com"] # KMS users with admin rights on this HSM
## hsm_slot     = [0]                  # PKCS#11 slot indices
## hsm_password = ["changeme"]         # Login passwords (same order as hsm_slot)
#
# UIDs for the above: hsm::softhsm2::0::<key_id>
#
## [[hsm_instances]]
## hsm_model    = "utimaco"
## hsm_admin    = ["tech@example.com"]
## hsm_slot     = [0, 1]
## hsm_password = ["slot0pass", "slot1pass"]
#
# UIDs for the above: hsm::utimaco::0::<key_id>, hsm::utimaco::1::<key_id>

# ── Key Rotation & Keyset Management ────────────────────────────────────────
# Background auto-rotation check interval (seconds).
# Set to 0 (default) to disable the auto-rotation background task.
# When enabled, must be at least 60 seconds to avoid excessive database churn.
# auto_rotation_check_interval_secs = 0

# Depth at which a keyset chain decryption triggers a server-side warning.
# Keyset chain traversal is unbounded (stopped only by cycle detection);
# this threshold emits a warning log so operators can flag stale ciphertexts.
# Default: 5.
# keyset_warn_depth = 5

# Interval (seconds) between refreshes of the kms.objects.total and
# kms.keys.active.count metrics; each refresh runs a full COUNT on the objects table.
# Set to 0 to disable these counts on very large databases. Default: 30.
# metrics_count_interval_secs = 30

[http]
port = 9998
hostname = "0.0.0.0"
# http_workers = 8  # leave unset to use all logical CPUs

# ── JWKS Endpoint ────────────────────────────────────────────────────────────
# Expose a public JSON Web Key Set at GET /.well-known/jwks.json (RFC 7517).
# WARNING: this endpoint is intentionally unauthenticated — any client can read
# the listed public keys.  Enable only when you want third parties to verify
# JWT signatures or discover your public keys.

#[jwks_endpoint]
# jwks_endpoint_enabled = false

# Responses exceeding this limit include X-JWKS-Truncated: true.
# jwks_endpoint_max_keys = 50

# Automatically tag key pairs created via POST /v1/crypto/keys with "jwks"
# jwks_endpoint_auto_tag = true

# ── Audit logging ────────────────────────────────────────────────────────────
# [audit]
# enabled = true
#
# [audit.file]
# path = "/var/lib/cosmian/kms/audit.jsonl"
# channel_capacity = 4096
#
# Stops all further writes once the file reaches this many bytes. Omitted means
# unlimited. Write-stop cap only — never rotates or deletes the file.
# max_size_bytes = 1073741824
#
# Only uncomment trusted_proxy_cidrs if the KMS sits behind a reverse proxy or
# load balancer. Leave it unset otherwise (client_ip then always reflects the
# real TCP peer address).
# trusted_proxy_cidrs = ["10.0.0.0/8"]
#
# Alternative to [audit.file]: a PostgreSQL-backed audit trail. Mutually
# exclusive at runtime with the file backend — setting url here selects
# PostgreSQL instead. Must be a different database than [db] database_url.
# [audit.postgres]
# url = "postgresql://kms_audit:password@localhost:5432/kms_audit"
#
# Stable across restarts, unique per KMS instance sharing the audit database —
# no hostname-based default; an incorrect guess risks two instances silently
# sharing a chain.
# instance_id = "kms-primary"

# ── EST / SCEP device enrollment ─────────────────────────────────────────────
# Certificates are issued by the CA `*_ca_uid` as the reserved `[enrollment-service]`
# identity: first run `ckms access-rights grant "[enrollment-service]" -i <ca uid> certify`
# (and the same for the CA private key; plus `ckms access-rights grant "[enrollment-service]"
# create` when Crypto Officers are configured).
#
# A template must set `subject_cn_regex` (or `allow_any_identity = true`). SANs are default-deny:
# a CSR SAN type without a `san_*_regex` is refused (iPAddress / URI SANs need
# `allow_any_identity = true` and no `san_*_regex`). Certificates issued
# through EST/SCEP carry the enrolled-certificate policy (1.3.6.1.4.1.16376.9.2.1) and are never
# accepted as a KMS user, whatever their CN. EST HTTP Basic bootstrap and
# `est_require_client_cert = true` require TLS (the latter also `clients_ca_cert_file`).
#
# [est]
# est_enabled = true
# est_ca_uid = "device-ca"
# est_require_client_cert = true
# est_template = "iot_device"
#
# [scep]
# scep_enabled = true
# scep_ca_uid = "device-ca"          # must be an RSA CA
# scep_challenge_password = "change-me"
# scep_template = "iot_device"
#
# [templates.iot_device]
# min_rsa_key_bits = 2048
# allowed_ec_curves = ["prime256v1"]   # default: prime256v1, secp384r1, secp521r1
# allowed_ekus = ["clientAuth"]        # default: clientAuth
# max_validity_days = 365
# default_validity_days = 90
# subject_cn_regex = "[a-z0-9-]+\\.iot\\.example"
# san_dns_regex = "[a-z0-9-]+\\.iot\\.example"

[db]
database_type = "redis-findex"
database_url = "redis://0.0.0.0:6379"
redis_master_password = "master-password"

# ── Role-based access control ─────────────────────────────────────────────────
[roles]
# Uncomment to assign users to the Crypto Officer role:
## crypto_officer_users = ["key-mgr@example.com"]

# Enable split-key ceremony requirement (XOR n-of-n):
## crypto_officer_require_ceremony = true

# Hex-encoded 32-byte secret for ceremony record encryption (AES-256-GCM).
# Required when any role has require_ceremony = true.
# All ceremony activation records are encrypted with keys derived from this secret,
# preventing forgery via direct database writes and protecting participant identities.
# Generate with: openssl rand -hex 32
## ceremony_secret = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
