default_username = "admin"

# Specifies which KMIP object types should be automatically unwrapped when retrieved.
# Repeat this option to specify multiple object types.
# Allowed values: All, Certificate, CertificateRequest, OpaqueObject, PGPKey, PrivateKey, PublicKey, SecretData, SplitKey, SymmetricKey
# Example:
## default_unwrap_type = ["SecretData", "SymmetricKey"]

# ── HSM configuration ─────────────────────────────────────────────────────────
#
# Two UID formats are supported:
#
# Legacy flat format (backward-compatible):
#   UIDs: hsm::<slot_id>::<key_id>  (e.g. hsm::0::my_aes_key)
#   Configure with top-level fields:
#     hsm_model = "softhsm2"
#     hsm_admin = ["admin"]
#     hsm_slot = [0]
#     hsm_password = ["changeme"]
#
# Multi-instance format:
#   UIDs: hsm::<model>::<slot_id>::<key_id>  (e.g. hsm::softhsm2::0::my_aes_key)
#   Configure with [[hsm_instances]] sections (one per device):
#
## [[hsm_instances]]
## hsm_model    = "softhsm2"           # softhsm2 | utimaco | proteccio | crypt2pay | smartcardhsm | other
## hsm_admin    = ["tech@example.com"] # KMS users with admin rights on this HSM
## hsm_slot     = [0]                  # PKCS#11 slot indices
## hsm_password = ["changeme"]         # Login passwords (same order as hsm_slot)
#
# UIDs for the above: hsm::softhsm2::0::<key_id>
#
## [[hsm_instances]]
## hsm_model    = "utimaco"
## hsm_admin    = ["tech@example.com"]
## hsm_slot     = [0, 1]
## hsm_password = ["slot0pass", "slot1pass"]
#
# UIDs for the above: hsm::utimaco::0::<key_id>, hsm::utimaco::1::<key_id>

# ── Key Rotation & Keyset Management ────────────────────────────────────────
# Background auto-rotation check interval (seconds).
# Set to 0 (default) to disable the auto-rotation background task.
# When enabled, must be at least 60 seconds to avoid excessive database churn.
# auto_rotation_check_interval_secs = 0

# Depth at which a keyset chain decryption triggers a server-side warning.
# Keyset chain traversal is unbounded (stopped only by cycle detection);
# this threshold emits a warning log so operators can flag stale ciphertexts.
# Default: 5.
# keyset_warn_depth = 5

[http]
port = 9998
hostname = "0.0.0.0"
# http_workers = 8  # leave unset to use all logical CPUs

# ── JWKS Endpoint ────────────────────────────────────────────────────────────
# Expose a public JSON Web Key Set at GET /.well-known/jwks.json (RFC 7517).
# WARNING: this endpoint is intentionally unauthenticated — any client can read
# the listed public keys.  Enable only when you want third parties to verify
# JWT signatures or discover your public keys.

#[jwks_endpoint]
# jwks_endpoint_enabled = false

# Responses exceeding this limit include X-JWKS-Truncated: true.
# jwks_endpoint_max_keys = 50

# Automatically tag key pairs created via POST /v1/crypto/keys with "jwks"
# jwks_endpoint_auto_tag = true

# ── Audit logging ────────────────────────────────────────────────────────────
# [audit]
# enabled = true
#
# [audit.file]
# path = "/var/lib/cosmian/kms/audit.jsonl"
# channel_capacity = 4096
#
# Only uncomment trusted_proxy_cidrs if the KMS sits behind a reverse proxy or
# load balancer. Leave it unset otherwise (client_ip then always reflects the
# real TCP peer address).
# trusted_proxy_cidrs = ["10.0.0.0/8"]
#
# Alternative backend: PostgreSQL instead of a local JSONL file. Only one of
# [audit.file] / [audit.postgres] is active — a PostgreSQL url, when set, takes
# precedence over the file path above. This database MUST be different from
# the main object-storage database configured under [db] below.
# [audit.postgres]
# url = "postgresql://kms_audit:secret@db:5432/kms_audit?sslmode=verify-full"
# # Identifies this KMS instance's hash chain. Must be STABLE across restarts
# # and UNIQUE per instance sharing this database. Defaults to the machine
# # hostname; set this explicitly in Kubernetes deployments.
# instance_id = "kms-eu-west-1a"

[db]
database_type = "redis-findex"
database_url = "redis://0.0.0.0:6379"
redis_master_password = "master-password"
