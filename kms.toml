# =============================================================================
# Eviden KMS — configuration for the SPIRE / Vault PoC (poc-mcds.cosmian.dev)
# =============================================================================
#
# This is the OPERATOR-side KMS configuration. It exposes the Vault-compatible
# API (`/v1/auth/*`, `/v1/transit/*`, `/v1/pki/*`) that SPIRE servers consume,
# and forwards authentication to the auth-verifier.
#
# Auth-verifier is a separate process running on the same host at :8443.
# It manages AppRole identities; the KMS proxies its login endpoints.
# Customers connect to the KMS for data-plane operations (transit, PKI) and
# to the auth-verifier at :8443 to manage their AppRoles.
#
# Start the KMS with:
#   cosmian_kms --config /path/to/kms.toml
# =============================================================================

default_username      = "admin"
force_default_username = false

kms_public_url = "https://poc-mcds.cosmian.dev"

# ── Database ─────────────────────────────────────────────────────────────────
[db]
database_type  = "sqlite"
sqlite_path    = "/var/lib/cosmian/kms-data"
clear_database = false

# ── HTTP binding ─────────────────────────────────────────────────────────────
[http]
hostname = "0.0.0.0"
port     = 443

cors_allowed_origins = ["https://poc-mcds.cosmian.dev"]

# ── TLS (Let's Encrypt certificate) ──────────────────────────────────────────
[tls]
tls_cert_file = "/etc/letsencrypt/live/poc-mcds.cosmian.dev/fullchain.pem"
tls_key_file  = "/etc/letsencrypt/live/poc-mcds.cosmian.dev/privkey.pem"

# ── Vault-compatible API (required for SPIRE) ────────────────────────────────
# The KMS proxies /v1/auth/approle/login and /v1/auth/token/* to the
# auth-verifier on loopback. Customers access the auth-verifier admin API
# directly at :8443 to create/manage AppRoles with `ckms vault approle`.
[vault]
vault_api_enabled       = true

# Internal auth-verifier URL (loopback — not exposed directly to clients)
vault_auth_verifier_url = "https://127.0.0.1:8443"

# CA that signed the auth-verifier TLS certificate
vault_auth_verifier_ca_cert = "/etc/cosmian/auth-verifier/certs/auth.ca.pem"

vault_auth_verifier_accept_invalid_certs = false

# Mount points (must match SPIRE plugin_data settings)
vault_transit_mount    = "transit"
vault_pki_mount        = "pki"

# Label of the PKI root CA signing key
vault_pki_ca_key_label = "vault_pki_ca"

# Cache successful auth-verifier token validations for 30 s
vault_token_cache_ttl_secs = 30

# ── Logging ──────────────────────────────────────────────────────────────────
[logging]
rust_log    = "info,cosmian_kms_server=info"
ansi_colors = false
