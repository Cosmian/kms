# rsyslog configuration for KMS SIEM TCP syslog integration test.
#
# Listens on TCP port 514 (RFC 6587 octet-counting framing) and writes
# every received message to /var/log/kms-cef.log.  The test script reads
# this file to verify that CEF events are correctly transported over TCP.
#
# Security: this config is for local CI only — no TLS, no auth, binds all
# interfaces inside the container.  Production syslog receivers should use
# TLS + mTLS (see official rsyslog docs for imtcp StreamDriver options).

module(load="imtcp")
input(type="imtcp" port="514" Ruleset="kms_cef")

ruleset(name="kms_cef") {
  action(
    type="omfile"
    file="/var/log/kms-cef.log"
    template="RSYSLOG_FileFormat"
  )
}

# Also keep the default ruleset for internal messages.
