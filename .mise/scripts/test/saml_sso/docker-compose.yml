---
# Local SAML single sign-on stack for manual testing — started by stack.sh (do not run directly).
#   keycloak       SAML identity provider           https://localhost:9443 (admin / admin)
#   proxy          nginx: /saml/* -> Auth Verifier, everything else -> KMS, both running on the host
#                  public origin https://localhost:8443
# The Auth Verifier (SAML service provider, https://127.0.0.1:8444) is not a container: stack.sh runs it
# on the host with `cargo run -p auth_verifier --features saml`.
services:
  keycloak:
    image: ${KEYCLOAK_IMAGE}
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTPS_PORT: '9443'
      KC_HOSTNAME: https://localhost:9443
      KC_HTTPS_CERTIFICATE_FILE: /conf/tls.cert.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /conf/tls.key.pem
    ports:
      - 127.0.0.1:9443:9443
    volumes:
      - ${SAML_SSO_DIR}:/conf:ro
      - ${SAML_SSO_DIR}/keycloak-realm.json:/opt/keycloak/data/import/demo-realm.json:ro

  proxy:
    image: ${NGINX_IMAGE}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:8443:8443
    volumes:
      - ${SAML_SSO_DIR}:/conf:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
