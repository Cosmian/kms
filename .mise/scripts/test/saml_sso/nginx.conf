# Single public origin for the browser: the Auth Verifier SAML routes and the KMS share
# https://localhost:8443, so the `_ea_` session cookie set by the Auth Verifier reaches the KMS.
server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate     /conf/tls.cert.pem;
    ssl_certificate_key /conf/tls.key.pem;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # The prefix must stay `/saml/`: the Auth Verifier binds its SAML login cookie to that path.
    location /saml/ {
        proxy_pass https://auth-verifier:8444;
        proxy_ssl_verify off;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        # The Auth Verifier rejects resumed TLS sessions from the proxy (handshake alert 80).
        proxy_ssl_session_reuse off;
    }

    # KMS running on the host (cargo run).
    location / {
        proxy_pass http://host.docker.internal:9998;
        client_max_body_size 64m;
    }
}
