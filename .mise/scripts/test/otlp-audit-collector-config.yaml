---
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  file:
    path: /tmp/otel-audit-logs.jsonl
    rotation:
      max_megabytes: 10
  debug:
    verbosity: normal

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [file, debug]
