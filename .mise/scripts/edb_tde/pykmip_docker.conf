# PyKMIP configuration file for edb_tde_kmip_client.py running inside the EDB container.
#
# Connects to the Cosmian KMS KMIP socket server on the Docker host.
# "host.docker.internal" resolves to the Docker host (Linux: via extra_hosts in compose).
#
# Cert paths are absolute and match the volume mounts in docker-compose.edb.yml.

[client]
host=host.docker.internal
port=15696
certfile=/kmip-certs/client.crt
keyfile=/kmip-certs/client.key
ca_certs=/kmip-certs/ca.crt
cert_reqs=CERT_NONE
ssl_version=PROTOCOL_SSLv23
do_handshake_on_connect=True
