[book]
title = "Key Management System"
authors = ["Cosmian"]
language = "en"
src = "docs"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
site-url = "https://docs.cosmian.com/"
additional-css = ["theme/css/eviden.css", "theme/css/mdbook-admonish.css", "theme/css/tabs.css"]
additional-js = ["theme/mermaid.min.js", "theme/js/mermaid-init.js", "theme/js/tabs.js", "theme/js/theme-invert.js"]

[output.html.search]
enable = true

[output.html.fold]
enable = true
level = 1

[output.linkcheck]
follow-web-links = true
warning-policy = "error"
# Cross-book references: these sections are separate books not built here
exclude = [
  'localhost',
  '@',
  'eviden_vm',
  'cbom',
  'sbom',
  'search/findex',
  # URL scheme not supported by linkcheck
  'chrome://',
  # NIST/IETF publication servers — rate-limit / occasionally return 5xx to bots
  'csrc\.nist\.gov',
  'nvlpubs\.nist\.gov',
  # rfc-editor.org — IETF RFC publication server, returns 502 to automated requests
  'rfc-editor\.org',
  # Sites that block automated crawlers (valid in browser but return 4xx/5xx to bots)
  'cosmian\.com',
  'www\.mysql\.com',
  'crates\.io',
  'support\.google\.com',
  'github\.com/sfackler',
  # Placeholder Azure Key Vault URL used in documentation examples
  'vault\.azure\.net',
  # main_commands.md is autogenerated and not rendered as a book page
  'kms_clients/cli/main_commands',
  'knowledge\.workspace\.google\.com',
  'dev.mysql.com',
  'techdocs\.broadcom\.com',
  'swagger\.io',
]

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0"

[preprocessor.mermaid]
command = "mdbook-mermaid"
