[package]
name = "cosmian_kms_interfaces"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Crate exposing APIs for plugins to the Cosmian KMS"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait = { workspace = true }
cosmian_kmip = { path = "../kmip", version = "5.26.0" }
cosmian_logger = { workspace = true }
num-bigint-dig = { workspace = true, features = ["std", "rand", "serde", "zeroize"] }
openssl = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
zeroize = { workspace = true, default-features = true }

[dev-dependencies]
mockall = "0.13"
tokio = { workspace = true, features = ["rt", "macros"] }

[features]
# Enables HSM-delegated EdDSA (Ed25519/Ed448) signing and X25519 ECDH key agreement types,
# mirroring the software crypto path gating in `crate/crypto/src/crypto/elliptic_curves/sign.rs`.
# See issue #1157 ("HSM delegation Track B").
non-fips = []
