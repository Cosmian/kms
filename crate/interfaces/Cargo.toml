[package]
name = "cosmian_kms_interfaces"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Crate exposing APIs for plugins to the Cosmian KMS"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait = { workspace = true }
cosmian_kmip = { workspace = true }
cosmian_kms_access = { workspace = true }
cosmian_logger = { workspace = true }
num-bigint-dig = { workspace = true, features = ["std", "rand", "serde", "zeroize"] }
openssl = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
zeroize = { workspace = true, default-features = true }

[dev-dependencies]
mockall = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }

[features]
# Enables the non-FIPS HSM-delegated types (X25519 ECDH key agreement, secp256k1, secp192k1);
# EdDSA (Ed25519/Ed448) is available in every build. Mirrors the software crypto path gating in
# `crate/crypto/src/crypto/elliptic_curves/sign.rs`.
# See issue #1157 ("HSM delegation Track B").
non-fips = []
