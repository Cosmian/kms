[package]
name = "cosmian_kms_server_database"
version = "5.29.0"
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Crate containing the database for the Cosmian KMS server and the supported stores"

[lints]
workspace = true

[lib]
doctest = false

[features]
non-fips = [
  "cosmian_kms_crypto/non-fips",
  "cosmian_kmip/non-fips",
  "cosmian_findex",
  "cosmian_sse_memories",
  "cosmian_sse_memories/redis-mem",
  "redis",
]
# Enable interop test operations (should only be used for testing)
interop = ["cosmian_kmip/interop"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
cosmian_findex = { workspace = true, optional = true }
cosmian_kmip = { workspace = true }
cosmian_kms_access = { workspace = true }
cosmian_kms_crypto = { workspace = true }
cosmian_kms_interfaces = { workspace = true }
cosmian_logger = { workspace = true }
cosmian_sse_memories = { workspace = true, optional = true }
deadpool-postgres = { workspace = true }
hex = { workspace = true }
moka = { workspace = true }
mysql_async = { workspace = true, features = [
  "native-tls-tls",
  "minimal",
] }

openssl = { workspace = true }
postgres-openssl = { workspace = true }
rawsql = { workspace = true }
redis = { workspace = true, features = [
  "aio",
  "ahash",
  "script",
  "connection-manager",
  "tokio-comp",
  "tls-native-tls",
  "tokio-native-tls-comp",
], optional = true }
rusqlite = { workspace = true, features = ["bundled", "serde_json"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
strum = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-postgres = { workspace = true, features = [
  "with-uuid-1",
  "with-serde_json-1",
  "with-time-0_3",
] }
tokio-rusqlite = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
tempfile = { workspace = true }
