[package]
name = "proteccio_pkcs11_loader"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Proteccio HSM PKCS#11 loader"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
cosmian_kms_base_hsm = { workspace = true }

[dev-dependencies]

[features]
# Enable this feature to run Proteccio tests (they require a Proteccio HSM)
proteccio = []
# Enable non-FIPS HSM-delegated algorithms (X25519, secp256k1, secp192k1; see cosmian_kms_base_hsm's `non-fips` feature).
non-fips = ["cosmian_kms_base_hsm/non-fips"]
