[package]
name = "cosmian_kms_base_hsm"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Base PKCS#11 HSM integration implementation"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
async-trait = { workspace = true }
cosmian_kms_interfaces = { path = "../../interfaces", version = "5.26.0" }
cosmian_logger = { workspace = true }
futures = { workspace = true }
libloading = { workspace = true }
lru = { workspace = true }
pkcs11-sys = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
zeroize = { workspace = true }
# Used exclusively by the shared HSM test suite (`tests_shared.rs`, always compiled into this
# crate's public lib so vendor crates can reuse it) to independently verify HSM-signed ECDSA
# signatures against the exported public key. Production signing/keygen code (`session/`,
# `kms_hsm.rs`) does not depend on openssl — DER encoding there is done manually.
openssl = { workspace = true }
