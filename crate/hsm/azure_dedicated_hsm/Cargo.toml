[package]
name = "azure_dedicated_hsm_pkcs11_loader"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Azure Dedicated HSM (Thales Luna 7) PKCS#11 loader"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
cosmian_kms_base_hsm = { path = "../base_hsm", version = "5.27.1" }

[features]
# Enable Azure Dedicated HSM tests (they require a live Thales Luna 7 HSM).
azure_dedicated_hsm = []
# Enable HSM-delegated EdDSA/X25519 support (see cosmian_kms_base_hsm's `non-fips` feature).
non-fips = ["cosmian_kms_base_hsm/non-fips"]
