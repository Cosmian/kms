[package]
name = "cosmian_kms_client_wasm"
version.workspace = true
build = "build.rs"
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Cosmian KMS Client Utilities for WASM"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
# doc test linking as a separate binary is extremely slow
# and is not needed for internal lib
doctest = false

[features]
non-fips = ["cosmian_kms_client_utils/non-fips", "cosmian_kms_client_utils/openpgp-export"]
default = ["getrandom/js"]

[dependencies]
base64 = { workspace = true }
console_error_panic_hook = { workspace = true }
cosmian_kms_client_utils = { workspace = true }
getrandom = { workspace = true, features = ["js"], optional = true }
js-sys = { workspace = true }
pem = { workspace = true }
serde = { workspace = true }
serde-wasm-bindgen = { workspace = true }
serde_json = { workspace = true }
# uuid >= 1.12 needs an explicit RNG source on wasm32-unknown-unknown (v4 is enabled by cosmian_kmip).
uuid = { workspace = true, features = ["js"] }
# Pinned to exact version: nix/ui.nix builds wasm-bindgen-cli at the same version.
# If you upgrade this, also update `wasmBindgenCli.version` in nix/ui.nix
# (along with its src sha256 and cargoHash).
wasm-bindgen = { workspace = true }
x509-cert = { workspace = true, features = ["pem"] }
zeroize = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["getrandom", "uuid"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
