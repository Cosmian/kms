[package]
name = "cosmian_kms_client"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Cosmian KMS REST Client"

[lints]
workspace = true

[lib]
# doc test linking as a separate binary is extremely slow
# and is not needed for internal lib
doctest = false

[features]
non-fips = ["cosmian_kms_client_utils/non-fips"]

[dependencies]
actix-web = { workspace = true, features = ["macros"] }
base64 = { workspace = true }
bytes = "1"
cosmian_crypto_core = { workspace = true }
cosmian_kms_client_utils = { path = "../client_utils", version = "5.25.0" }
cosmian_logger = { workspace = true }
der = { workspace = true, features = ["std"] }
http = { workspace = true }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-openssl = { version = "0.10", features = ["client-legacy"] }
hyper-util = { version = "0.1", features = [
  "client-legacy",
  "tokio",
  "http1",
  "http2",
] }
oauth2 = { version = "5.0", default-features = false }
openssl = { workspace = true }
pem = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = "0.7"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "net"] }
tower-service = "0.3"
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "time",
] }
toml = { workspace = true }
