[package]
name = "cosmian_kms_client"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Cosmian KMS REST Client"

[lints]
workspace = true

[lib]
# doc test linking as a separate binary is extremely slow
# and is not needed for internal lib
doctest = false

[features]
non-fips = [
    "cosmian_kms_client_utils/non-fips",
    "cosmian_kms_client_utils/openpgp-export",
]

[dependencies]
actix-web = { workspace = true, features = ["macros"] }
base64 = { workspace = true }
bytes = { workspace = true }
cosmian_crypto_core = { workspace = true }
cosmian_kms_client_utils = { workspace = true }
cosmian_logger = { workspace = true }
der = { workspace = true, features = ["std"] }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-openssl = { workspace = true, features = ["client-legacy"] }
hyper-util = { workspace = true, features = [
  "client-legacy",
  "tokio",
  "http1",
  "http2",
] }
oauth2 = { workspace = true }
openssl = { workspace = true }
pem = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "time"] }
tower-service = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "time",
] }
toml = { workspace = true }
