[package]
name = "cosmian_kms_k8s_operator"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords = ["kms", "kubernetes", "k8s", "cosmian", "operator"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Kubernetes Operator for Cosmian KMS: KMSSecret CRD controller and admission webhook"
readme = "../../../../README.md"

[[bin]]
name = "cosmian-kms-operator"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Kubernetes
kube = { version = "0.98", features = ["runtime", "derive", "ws"] }
k8s-openapi = { version = "0.24", features = ["v1_30"] }
schemars = "0.8"

# Async
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
futures = "0.3"

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = "0.9"

# Errors / logging
thiserror = { workspace = true }
tracing = { workspace = true }
cosmian_logger = { workspace = true }

# CLI
clap = { workspace = true, features = ["help", "env", "std", "usage", "error-context", "derive", "cargo"] }

# HTTP webhook server
axum = { version = "0.8", features = ["json"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
# rustls is a direct dep to force the ring backend (features = ["ring"]); used transitively via axum-server/tls-rustls
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }

# Hashing (detect secret changes)
sha2 = "0.10"
chrono = { workspace = true }
hex = { workspace = true }

# Duration parsing
humantime = "2"

# KMS client + KMIP types
cosmian_kms_client = { path = "../../client", version = "5.24.0" }
cosmian_kmip = { path = "../../../kmip", version = "5.24.0" }

# Encoding
base64 = { workspace = true }

# rustls is kept as a direct dep to force the ring backend; machete treats it as unused
[package.metadata.cargo-machete]
ignored = ["rustls"]
