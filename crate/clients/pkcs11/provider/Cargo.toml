[package]
name = "cosmian_pkcs11"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords = ["pkcs11", "cryptoki", "hsm", "kms"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "HSM PKCS#11 provider for Cosmian KMS"

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["winresource"]

[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }

[lib]
name = "cosmian_pkcs11"
crate-type = ["rlib", "cdylib"]
# doc test linking as a separate binary is extremely slow
# and is not needed for internal lib
doctest = false

[features]
default = []
non-fips = ["ckms/non-fips", "test_kms_server/non-fips"]

[dependencies]
ckms = { workspace = true }
cosmian_logger = { workspace = true }
cosmian_pkcs11_module = { workspace = true }
etcetera = { workspace = true }
hex = { workspace = true, features = ["std"] }
p256 = { workspace = true, features = [
  "arithmetic",
  "pkcs8",
  "std",
] }
pkcs1 = { workspace = true }
pkcs11-sys = { workspace = true }
serde_json = { workspace = true }
sha3 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-error = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
x509-cert = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
cosmian_config_utils = { workspace = true }
openssl = { workspace = true }
serial_test = { workspace = true }
test_kms_server = { workspace = true }
