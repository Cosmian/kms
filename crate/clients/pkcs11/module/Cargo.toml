[package]
name = "cosmian_pkcs11_module"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords = ["pkcs11", "cryptoki", "kms", "cosmian"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Cross-platform PKCS#11 module written in rust, originally forked from Google/native_pkcs11"

[lints]
workspace = true

[lib]
doctest = false

[features]
default = []
non-fips = []

[dependencies]
const-oid = { workspace = true }
cosmian_kms_crypto = { workspace = true }
cosmian_logger = { workspace = true }
hex = { workspace = true, features = ["std"] }
log = { workspace = true, default-features = false }
openssl = { workspace = true }
p256 = { workspace = true, features = [
  "arithmetic",
  "pkcs8",
  "std",
] }
pkcs1 = { workspace = true }
pkcs11-sys = { workspace = true }
rand = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
cosmian_logger = { workspace = true }
serial_test = { workspace = true }
