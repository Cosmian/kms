[package]
name = "cosmian_pkcs11_module"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords = ["pkcs11", "cryptoki", "kms", "cosmian"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Cross-platform PKCS#11 module written in rust, originally forked from Google/native_pkcs11"

[lints]
workspace = true

[lib]
doctest = false

[features]
default = []
non-fips = []

[dependencies]
cosmian_kms_crypto = { workspace = true }
cosmian_logger = { workspace = true }
der = { workspace = true, features = ["alloc", "oid", "std"] }
hex = { workspace = true, features = ["std"] }
openssl = { workspace = true }
pkcs11-sys = { workspace = true }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
cosmian_logger = { workspace = true }
serial_test = { workspace = true }
