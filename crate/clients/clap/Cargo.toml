[package]
name = "cosmian_kms_cli_actions"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = """
Command Line Interface used to manage the KMS server

If any assistance is needed, please either visit the Cosmian technical documentation at https://docs.cosmian.com
or contact the Cosmian support team on Discord https://discord.com/invite/7kPMNtHpnz
"""

[lints]
workspace = true

[lib]
# doc test linking as a separate binary is extremely slow
# and is not needed for internal lib
doctest = false

[features]
non-fips = [
  "cosmian_kms_client/non-fips",
  "cosmian_kms_crypto/non-fips",
  "cosmian_kmip/non-fips",
  "cosmian_kms_server_database/non-fips",
  "cosmian_kms_base_hsm/non-fips",
  "test_kms_server/non-fips",
]

[dependencies]
base64 = { workspace = true }
clap = { workspace = true, features = ["help", "env", "std", "usage", "error-context", "derive", "cargo"] }
cosmian_config_utils = { workspace = true }
cosmian_crypto_core = { workspace = true, default-features = false }
cosmian_kmip = { workspace = true } # only to be reexported, not used directly
cosmian_kms_base_hsm = { workspace = true }
cosmian_kms_client = { workspace = true }
cosmian_kms_crypto = { workspace = true }
cosmian_kms_server_database = { workspace = true }
cosmian_logger = { workspace = true }
criterion = { workspace = true }
der = { workspace = true, features = ["pem"] }
dialoguer = { workspace = true }
hex = { workspace = true }
jsonwebtoken = { workspace = true }
leb128 = { workspace = true }
libc = { workspace = true }
libloading = { workspace = true }
openssl = { workspace = true }
pem = { workspace = true }
pkcs11-sys = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls", "cookies"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
spiffe = { workspace = true, features = ["workload-api", "jwt"] }
strum = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["full"] }
url = { workspace = true }
uuid = { workspace = true }
x509-cert = { workspace = true, features = ["pem"] }
zeroize = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
openssl = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
test_kms_server = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_LibraryLoader", "Win32_System_Registry"] }
