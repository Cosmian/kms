[package]
name = "cosmian_cng"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords = ["cng", "ksp", "windows", "kms", "ncrypt"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Windows CNG Key Storage Provider (KSP) for Cosmian KMS"

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["winresource"]

[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }

# Build a DLL that Windows CNG can load as a Key Storage Provider
[lib]
name = "cosmian_cng"
crate-type = ["cdylib", "rlib"]
# doc test linking as a separate binary is extremely slow
doctest = false

[features]
non-fips = ["ckms/non-fips", "test_kms_server/non-fips"]

[dependencies]
base64 = { workspace = true }
bitflags = { workspace = true }
ckms = { workspace = true }
cosmian_logger = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
uuid = { workspace = true, features = ["v4"] }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
] }

[dev-dependencies]
serial_test = { workspace = true }
test_kms_server = { workspace = true }
