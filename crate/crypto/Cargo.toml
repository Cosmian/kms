[package]
name = "cosmian_kms_crypto"
version.workspace = true
authors.workspace = true
categories.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Cosmian KMS Crypto - cryptographic operations and algorithms"

[lints]
workspace = true

[lib]
# doc test linking as a separate binary is extremely slow
# and is not needed for internal lib
doctest = false

[features]
# Enable FIPS module feature build. KMS builds in FIPS mode when this is enabled.
non-fips = [
  "cosmian_kmip/non-fips",
  "cosmian_crypto_core/ecies",
  "cosmian_crypto_core/blake",
  "cosmian_crypto_core/chacha",
  "cosmian_cover_crypt",
  "aes-gcm-siv",
  "argon2",
  "dep:chrono",
  "dep:regex",
  "dep:rand",
  "dep:rand_chacha",
  "dep:rand_distr",
  "dep:sha2",
  "dep:k256",
  "dep:itertools",
  "dep:num-bigint",
  "dep:num-traits",
  "dep:pgp",
  "dep:cosmian_kms_client_utils",
  "cosmian_kms_client_utils/openpgp-export",
]

[dependencies]
aes-gcm-siv = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
base64 = { workspace = true }
chrono = { workspace = true, optional = true }
cosmian_cover_crypt = { git = "https://github.com/Cosmian/cover_crypt.git", branch = "develop", features = ["generic-kem"], optional = true }
cosmian_crypto_core = { workspace = true, features = ["aes", "sha3"] }
cosmian_kmip = { workspace = true }
cosmian_kms_client_utils = { workspace = true, optional = true }
cosmian_logger = { workspace = true }
foreign-types = { workspace = true }
hex = { workspace = true }
itertools = { workspace = true, optional = true }
k256 = { workspace = true, features = ["ecdsa"], optional = true }
num-bigint = { workspace = true, optional = true }
num-bigint-dig = { workspace = true, features = [
  "std",
  "rand",
  "serde",
  "zeroize",
] }
num-traits = { workspace = true, optional = true }
openssl = { workspace = true }
openssl-sys = { workspace = true }
pgp = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rand_chacha = { workspace = true, optional = true }
rand_distr = { workspace = true, optional = true }
regex = { workspace = true, optional = true, features = ["unicode-perl"] }
rust-ini = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }
zeroize = { workspace = true, features = ["zeroize_derive", "serde"] }

[dev-dependencies]
aes-kw = { workspace = true }
cosmian_logger = { workspace = true }
ctor = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[package.metadata.cargo-machete]
ignored = ["rust-ini"]

[build-dependencies]
sha2 = { workspace = true }
