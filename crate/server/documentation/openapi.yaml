  # ── AWS XKS ──────────────────────────────────────────────────────────────────

  /aws/kms/xks/v1/health:
    post:
      tags: [AWS XKS]
      summary: XKS proxy health check
      description: |
        Returns the health status of the XKS proxy and its underlying EKM fleet.

        **Authentication**: AWS Signature Version 4 (HMAC-SHA256 over request body and headers).
        The `Authorization` header must contain a valid SigV4 signature computed with the
        access key ID and secret key configured on the KMS server.
      operationId: xksGetHealthStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XksGetHealthStatusRequest'
      responses:
        '200':
          description: XKS proxy health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XksGetHealthStatusResponse'
        '401':
          description: Authentication failed (invalid SigV4 signature)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XksErrorReply'

  /aws/kms/xks/v1/keys/{key_id}/metadata:
    post:
      tags: [AWS XKS]
      summary: Get XKS key metadata
      description: Returns the specification, usage, and status of a key stored in the KMS.
      operationId: xksGetKeyMetadata
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: string
          description: KMS object UID of the key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XksGetKeyMetadataRequest'
      responses:
        '200':
          description: Key metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XksGetKeyMetadataResponse'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XksErrorReply'
        '404':
          description: Key not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XksErrorReply'

  /aws/kms/xks/v1/keys/{key_id}/encrypt:
    post:
      tags: [AWS XKS]
      summary: XKS encrypt
      description: Encrypts plaintext using AES-GCM with the specified key.
      operationId: xksEncrypt
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XksEncryptRequest'
      responses:
        '200':
          description: Ciphertext and authentication tag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XksEncryptResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XksErrorReply'
        '401':
