  # ── Download CLI ──────────────────────────────────────────────────────────────

  /download-cli:
    get:
      tags: [Server]
      summary: Download CLI archive
      description: |
        Downloads the `ckms` CLI binary archive (ZIP) for the current platform.
        Returns 404 if no CLI archive has been placed in the server's resources folder.
      operationId: downloadCli
      security:
        - bearerAuth: []
        - mtls: []
      responses:
        '200':
          description: CLI ZIP archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '404':
          description: CLI archive not available
    head:
      tags: [Server]
      summary: Check CLI archive availability
      description: Returns 200 if a CLI archive is available for download, 404 otherwise.
      operationId: checkCliArchive
      security:
        - bearerAuth: []
        - mtls: []
      responses:
        '200':
          description: CLI archive is available
        '404':
          description: CLI archive not available

  # ── UI Auth ───────────────────────────────────────────────────────────────────

  /ui/login_flow:
    get:
      tags: [UI Auth]
      summary: Initiate OIDC login
      description: |
        Redirects the browser to the configured OIDC provider's authorization endpoint.
        Only available when the web UI is enabled and an OIDC provider is configured.
      operationId: uiLoginFlow
      responses:
        '302':
          description: Redirect to OIDC authorization endpoint
        '200':
          description: Login page HTML (when no OIDC provider configured)

  /ui/login_as:
    post:
      tags: [UI Auth]
      summary: Login against the Cosmian authentication server
      description: |
        Authenticates the browser against the configured Cosmian authentication server
        ('AS') using username/password (and optionally a TOTP code), mirroring `ckms
        login cosmian`. On success, only the validated username is stored in the
        session cookie — the AS's JWT never reaches the browser. Only available when
        `cosmian_auth_server_url` and `cosmian_auth_realm` are both configured.
      operationId: uiLoginAs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                totp_code:
                  type: string
                  description: 'Required when a prior call returned `next_step: "TotpRequired"`'
      responses:
        '200':
          description: Authenticated, or a TOTP code is required to proceed
          content:
            application/json:
              schema:
                type: object
                required: [next_step]
                properties:
                  next_step:
                    type: string
                    enum: [Authenticated, TotpRequired]
        '401':
          description: Invalid credentials or TOTP code
        '403':
          description: Account requires a password change on the Cosmian authentication server
        '500':
          description: Cosmian authentication server not configured for Web UI login
        '502':
          description: Cosmian authentication server unreachable or returned an unexpected response

  /ui/callback:
    get:
      tags: [UI Auth]
      summary: OIDC authorization callback
      description: Handles the OIDC provider redirect after successful authentication. Exchanges the authorization code for tokens and sets the session
        cookie.
      operationId: uiCallback
      parameters:
        - name: code
          in: query
          schema:
            type: string
          description: Authorization code from the OIDC provider
        - name: state
          in: query
          schema:
            type: string
          description: State parameter (CSRF protection)
      responses:
        '302':
          description: Redirect to the web UI after successful login
        '400':
          description: Invalid callback parameters

  /ui/whoami:
    get:
      tags: [UI Auth]
      summary: Current session user
      description: Returns the user ID of the currently authenticated UI session. Returns 401 if no valid session exists.
      operationId: uiWhoAmI
      responses:
        '200':
          description: Authenticated user identity
          content:
            application/json:
              schema:
                type: object
                required: [user_id]
                properties:
                  user_id:
                    type: string
                    description: The authenticated user's identifier (email or subject claim)
                    example: alice@example.com
        '401':
          description: No active session

  /ui/logout:
    get:
      tags: [UI Auth]
      summary: Logout
      description: Clears the session cookie and optionally redirects to the OIDC provider's logout endpoint.
      operationId: uiLogout
      responses:
        '302':
          description: Redirect after logout

  /ui/auth_method:
    get:
      tags: [UI Auth]
      summary: Auth method configuration
      description: >-
        Returns the authentication methods configured for the web UI as an ordered
        `auth_methods` array (priority first: OIDC/JWT, then auth-verifier
        username/password, then client certificate). The singular `auth_method`
        field is the primary method (auth_methods[0]) or `None`, retained for
        backward compatibility.
      operationId: uiAuthMethod
      responses:
        '200':
          description: Auth method info
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth_method:
                    type: string
                    enum: [JWT, AUTH_VERIFIER, CERT, None]
                    description: Highest-priority configured method (auth_methods[0]), or None. Kept for backward compatibility.
                  auth_methods:
                    type: array
                    items:
                      type: string
                      enum: [JWT, AUTH_VERIFIER, CERT]
                    description: Configured UI login methods, ordered by priority (primary first).
                  oidc_issuer:
                    type: string
                    description: OIDC issuer URL (only when auth_method is JWT)

  # ── Tokenize (non-FIPS only) ─────────────────────────────────────────────

  /tokenize/hash:
    post:
      tags: [Tokenize]
      summary: Hash a string
      description: Hash a string using SHA2, SHA3, or Argon2. Optionally accepts a base64-encoded salt.
      operationId: tokenizeHash
      security:
        - bearerAuth: []
        - mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, method]
              properties:
                data:
                  type: string
                  description: Input string to hash
                method:
                  type: string
                  enum: [SHA2, SHA3, Argon2]
                  description: Hash algorithm
                salt:
                  type: string
                  description: Optional base64-encoded salt bytes
      responses:
        '200':
          description: Hashed result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeResponse'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeError'

  /tokenize/noise:
    post:
      tags: [Tokenize]
      summary: Add statistical noise
      description: Add Gaussian, Laplace, or Uniform noise to a float, integer, or RFC3339 date.
      operationId: tokenizeNoise
      security:
        - bearerAuth: []
        - mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, data_type, method]
              properties:
                data:
                  description: Value to add noise to (number or RFC3339 string)
                data_type:
                  type: string
                  enum: [float, integer, date]
                method:
                  type: string
                  enum: [Gaussian, Laplace, Uniform]
                  description: Noise distribution
                mean:
                  type: number
                  description: Mean parameter (Gaussian/Laplace with parameters)
                std_dev:
                  type: number
                  description: Standard deviation (Gaussian/Laplace with parameters)
                min_bound:
                  type: number
                  description: Minimum bound (Gaussian/Laplace/Uniform with bounds)
                max_bound:
                  type: number
                  description: Maximum bound (Gaussian/Laplace/Uniform with bounds)
      responses:
        '200':
          description: Noised result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeResponse'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeError'

  /tokenize/word-mask:
    post:
      tags: [Tokenize]
      summary: Mask sensitive words
      description: Replace sensitive words with "XXXX".
      operationId: tokenizeWordMask
      security:
        - bearerAuth: []
        - mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, words]
              properties:
                data:
                  type: string
                  description: Input text
                words:
                  type: array
                  items:
                    type: string
                  description: Words to mask
      responses:
        '200':
          description: Masked text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeResponse'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeError'

  /tokenize/word-tokenize:
    post:
      tags: [Tokenize]
      summary: Tokenize sensitive words
      description: Replace sensitive words with random hex tokens (consistent within one request).
      operationId: tokenizeWordTokenize
      security:
        - bearerAuth: []
        - mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, words]
              properties:
                data:
                  type: string
                  description: Input text
                words:
                  type: array
                  items:
                    type: string
                  description: Words to tokenize
      responses:
        '200':
          description: Tokenized text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeResponse'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeError'

  /tokenize/word-pattern-mask:
    post:
      tags: [Tokenize]
      summary: Regex pattern masking
      description: Replace all regex-matched substrings with a replacement string. Pattern limited to 1024 characters (ReDoS mitigation).
      operationId: tokenizeWordPatternMask
      security:
        - bearerAuth: []
        - mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, pattern, replace]
              properties:
                data:
                  type: string
                  description: Input text
                pattern:
                  type: string
                  maxLength: 1024
                  description: Regex pattern to match
                replace:
                  type: string
                  description: Replacement string
      responses:
        '200':
          description: Masked text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeResponse'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeError'

  /tokenize/aggregate-number:
    post:
      tags: [Tokenize]
      summary: Round a number
      description: Round a number to the nearest power of ten.
      operationId: tokenizeAggregateNumber
      security:
        - bearerAuth: []
        - mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, data_type, power_of_ten]
              properties:
                data:
                  description: Number to round (float or integer)
                data_type:
                  type: string
                  enum: [float, integer]
                power_of_ten:
                  type: integer
                  description: Power of ten to round to (e.g. 2 → round to nearest 100)
      responses:
        '200':
          description: Rounded result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeResponse'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeError'

  /tokenize/aggregate-date:
    post:
      tags: [Tokenize]
      summary: Truncate a date
      description: Truncate an RFC3339 date to the specified time unit precision.
      operationId: tokenizeAggregateDate
      security:
        - bearerAuth: []
        - mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, time_unit]
              properties:
                data:
                  type: string
                  description: RFC3339 date string to truncate
                time_unit:
                  type: string
                  enum: [Second, Minute, Hour, Day, Month, Year]
                  description: Truncation precision
      responses:
        '200':
          description: Truncated date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeResponse'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeError'

  /tokenize/scale-number:
    post:
      tags: [Tokenize]
      summary: Normalize and scale a number
      description: Normalize and scale a number using z-score transformation.
      operationId: tokenizeScaleNumber
      security:
        - bearerAuth: []
        - mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, data_type, mean, std_deviation, scale, translate]
              properties:
                data:
                  description: Number to scale (float or integer)
                data_type:
                  type: string
                  enum: [float, integer]
                mean:
                  type: number
                  description: Mean of the original data distribution
                std_deviation:
                  type: number
                  description: Standard deviation (non-zero)
                scale:
                  type: number
                  description: Scaling factor
                translate:
                  type: number
                  description: Translation factor
      responses:
        '200':
          description: Scaled result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeResponse'
        '422':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenizeError'

  /.well-known/jwks.json:
    get:
      tags: [JWKS]
      summary: JSON Web Key Set
      description: |
        Returns the public key set (RFC 7517) for all KMS keys that carry the
        `"jwks"` tag and are in Active or Deactivated state.

        This endpoint is **intentionally unauthenticated** — no credentials are
        required. Enable it only when you want third parties (e.g. JWT verifiers)
        to discover the server's public keys.

        When the response would exceed `jwks_endpoint_max_keys` entries, the set
        is truncated and the header `X-JWKS-Truncated: true` is added.
      operationId: getJwks
      security: []
      responses:
        '200':
          description: JWK Set
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    description: Array of public JWK objects
                    items:
                      type: object
                      required: [kty, kid]
                      properties:
                        kty:
                          type: string
                          description: Key type (EC, RSA, OKP)
                          example: EC
                        kid:
                          type: string
                          description: KMS unique identifier
                        alg:
                          type: string
                          description: JOSE algorithm
                        use:
                          type: string
                          description: Public key use (sig or enc)
                        key_ops:
                          type: array
                          items:
                            type: string
                          description: Permitted key operations
                        crv:
                          type: string
                          description: Elliptic curve / OKP curve name
                        x:
                          type: string
                          description: EC/OKP x-coordinate (base64url)
                        y:
                          type: string
                          description: EC y-coordinate (base64url)
                        n:
                          type: string
                          description: RSA modulus (base64url)
                        e:
                          type: string
                          description: RSA public exponent (base64url)
              example:
                keys:
                  - kty: EC
                    kid: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                    alg: ES256
                    use: sig
                    crv: P-256
                    x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                    y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
        '500':
          description: Internal server error

  # ── Vault Transit ──────────────────────────────────────────────────────────
  # Enabled only when vault_api_enabled = true in server config.
  # The {transit_mount} defaults to "transit" but is configurable.
  # All endpoints require X-Vault-Token validated against auth-verifier.

  /v1/transit/keys/{name}:
    post:
      tags: [Vault Transit]
      summary: Create a transit key
      description: |
        Create a new asymmetric transit key pair stored in the KMS under the tag
        `vault_transit:{name}`. Supported types: `ecdsa-p256`, `ecdsa-p384`,
        `rsa-2048`, `rsa-4096`. Non-FIPS only: `ed25519`, `ml-dsa-65`.
      operationId: vaultTransitCreateKey
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: spire-server-key-1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransitKeyRequest'
            example:
              type: ecdsa-p256
      security:
        - vaultToken: []
      responses:
        '200':
          description: Key created. Returns the key metadata (keys map will be empty on create).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitKeyInfoWrapper'
        '400':
          description: Unsupported key type.
        '500':
          description: Internal error.

    get:
      tags: [Vault Transit]
      summary: Get transit key info
      description: |
        Return full metadata for a transit key, including `latest_version` and
        the `keys` map with the SPKI PEM public key for each version.
        SPIRE's `KeyManager` plugin calls this at startup to warm its key cache.
      operationId: vaultTransitGetKey
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: spire-server-key-1
      security:
        - vaultToken: []
      responses:
        '200':
          description: Transit key metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitKeyInfoWrapper'
              example:
                data:
                  name: spire-server-key-1
                  type: ecdsa-p256
                  exportable: false
                  allow_deletion: true
                  latest_version: 1
                  keys:
                    '1':
                      public_key: "-----BEGIN PUBLIC KEY-----\nMFkwE...\n-----END PUBLIC KEY-----\n"
                      creation_time: '2026-07-27T10:00:00Z'
        '404':
          description: Key not found.
        '500':
          description: Internal error.

    delete:
      tags: [Vault Transit]
      summary: Delete a transit key
      description: |
        Revoke and destroy a transit key pair. SPIRE's delete worker first calls
        `POST /v1/transit/keys/{name}/config` with `deletion_allowed: true` and
        then calls this endpoint.
      operationId: vaultTransitDeleteKey
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: spire-server-key-1
      security:
        - vaultToken: []
      responses:
        '204':
          description: Key deleted.
        '404':
          description: Key not found.
        '500':
          description: Internal error.

  /v1/transit/keys/{name}/config:
    post:
      tags: [Vault Transit]
      summary: Configure a transit key (no-op)
      description: |
        Vault clients call this endpoint with `{"deletion_allowed": true}` before
        deleting a key. This server always permits deletion; the request is accepted
        and `204 No Content` is returned without modifying any state.
      operationId: vaultTransitConfigureKey
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: spire-server-key-1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                deletion_allowed:
                  type: boolean
                  description: Accepted but ignored — deletion is always permitted server-side.
            example:
              deletion_allowed: true
      security:
        - vaultToken: []
      responses:
        '204':
          description: Accepted (no-op).

  /v1/transit/keys:
    get:
      tags: [Vault Transit]
      summary: List transit keys
      description: Return the names of all transit keys visible to the authenticated user.
      operationId: vaultTransitListKeys
      security:
        - vaultToken: []
      responses:
        '200':
          description: List of transit key names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitKeyListWrapper'
              example:
                data:
                  keys: [spire-server-key-1, spire-server-key-2]
        '500':
          description: Internal error.

  /v1/transit/sign/{name}/{hash_alg}:
    post:
      tags: [Vault Transit]
      summary: Sign with a transit key
      description: |
        Sign prehashed (or raw) data with the named transit key.
        The response signature is prefixed with `vault:v1:` for Vault API compatibility.
        Called by SPIRE's `KeyManager` plugin to sign CA certificates and SVIDs.
      operationId: vaultTransitSign
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Transit key name.
          example: spire-server-key-1
        - name: hash_alg
          in: path
          required: true
          schema:
            type: string
            enum: [sha2-256, sha2-384, sha2-512]
          description: Hash algorithm identifier.
          example: sha2-256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignTransitRequest'
            example:
              input: dGVzdA==
              prehashed: true
      security:
        - vaultToken: []
      responses:
        '200':
          description: Signature (Vault-prefixed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignTransitResponse'
              example:
                data:
                  signature: vault:v1:MEUCIQDtv...
        '400':
          description: Invalid request (e.g. malformed base64 `input` or unsupported hash algorithm).
        '404':
          description: Key not found.
        '500':
          description: Signing failed.

  # ── Vault PKI ──────────────────────────────────────────────────────────────

  /v1/pki/root/sign-intermediate:
    post:
      tags: [Vault PKI]
      summary: Sign an intermediate CA CSR
      description: |
        Sign a Certificate Signing Request (CSR) with the configured CA private key
        (identified by `vault_pki_ca_key_label` in server config) and return the
        signed certificate chain in Vault-compatible JSON.

        The `ttl` field is parsed and forwarded to the KMS `Certify` operation as
        `requested_validity_days`. Supported formats: `"8760h"`, `"365d"`,
        `"31536000s"`, or a bare integer (treated as seconds).

        Called by SPIRE's `UpstreamAuthority` plugin when the server's intermediate CA
        needs signing.
      operationId: vaultPkiSignIntermediate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignIntermediateRequest'
            example:
              csr: "-----BEGIN CERTIFICATE REQUEST-----\n...\n-----END CERTIFICATE REQUEST-----\n"
              uri_sans:
                - spiffe://example.org/spire/server
              ttl: 8760h
      security:
        - vaultToken: []
      responses:
        '200':
          description: Signed certificate chain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignIntermediateResponse'
              example:
                data:
                  certificate: "-----BEGIN CERTIFICATE-----\n...\n-----END CERTIFICATE-----\n"
                  issuing_ca: "-----BEGIN CERTIFICATE-----\n...\n-----END CERTIFICATE-----\n"
                  ca_chain:
                    - "-----BEGIN CERTIFICATE-----\n...\n-----END CERTIFICATE-----\n"
        '400':
          description: Missing or empty `uri_sans`, or `vault_pki_ca_key_label` not configured.
        '500':
          description: Internal error (CSR parsing, CA key not found, Certify failure).
  # ── Vault Auth (transparent proxy) ─────────────────────────────────────────

  /v1/auth/{path}:
    parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: |
          Arbitrary sub-path under `/v1/auth/` (e.g. `approle/login`,
          `token/lookup-self`, `token/renew-self`, `token/revoke-self`).
        example: approle/login
    get: &vaultAuthProxy
      tags: [Vault Auth]
      summary: Transparent auth proxy
      description: |
        Catch-all reverse proxy for the Vault auth API. When the
        Vault-compatible API is enabled, the KMS becomes the single `vault_addr`
        endpoint for SPIRE, so every `/v1/auth/*` request (AppRole login, token
        `lookup-self`, `renew-self`, `revoke-self`) is forwarded **unchanged** to
        the auth-verifier configured via `vault_auth_verifier_url`, with the
        `/v1` prefix stripped.

        This route is intentionally **unauthenticated** (it carries the login
        credentials themselves) and accepts **any HTTP method**; the client's
        verb, query string, `X-Vault-Token`/`Authorization`/`Content-Type`
        headers, and raw body are preserved. Paths containing `.`/`..` segments
        are rejected with `400` to prevent traversal outside the `/auth/*` scope.
        The auth-verifier response status and body are returned byte-for-byte.
      operationId: vaultAuthProxy
      responses:
        '200':
          description: Response forwarded verbatim from the auth-verifier.
        '400':
          description: Invalid path (`.`/`..` segments are not allowed).
        '502':
          description: The auth-verifier is unreachable.
    post: *vaultAuthProxy
    put: *vaultAuthProxy
    delete: *vaultAuthProxy
