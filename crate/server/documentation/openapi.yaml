          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XksDecryptRequest'
      responses:
        '200':
          description: Decrypted plaintext
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XksDecryptResponse'
        '400':
          description: Invalid ciphertext or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XksErrorReply'
        '401':
