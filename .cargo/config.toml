[alias]
# Check for formatting
format = "fmt --all -- --check"

# Build all features, all targets and all binaries
build-all = "build --workspace --all-targets --all-features --bins"
build-all-release = "build --release --workspace --all-targets --all-features --bins"

# Test FIPS and non-FIPS builds
test-fips = "test --lib --workspace"
test-non-fips = "test --lib --workspace --features non-fips"

# Run Clippy on all code paths
clippy-all = "clippy --workspace --all-targets --all-features -- -D warnings"

# Run coverage
coverage = "tarpaulin --release -v -f -t 1800 --out Xml --ignore-tests --exclude-files crate/crypto/build.rs"

# Find unused dependencies
deps = "udeps --workspace --all-targets --all-features --backend depinfo"

# Publish dry-run helpers (allow dirty tree during local checks)
publish-dry = "publish --dry-run --workspace --allow-dirty"
publish-dry-crate = "publish --dry-run --allow-dirty"

# Run throughput bench with native-CPU tuning for maximum representative throughput.
# cargo bench-native -- http_throughput
bench-native = "bench --bench http_throughput"

[target.x86_64-unknown-linux-gnu]
# target-cpu=native: enables AES-NI, AVX2, SHA-NI for non-crypto Rust glue code.
#   OpenSSL already probes these via CPUID at runtime; this flag makes rustc emit
#   them for serialisation/hashing paths too.
#   NOTE: produces non-portable binaries — override with RUSTFLAGS="" for CI.
#
# force-frame-pointers=yes: makes perf/cargo-flamegraph use --call-graph fp
#   instead of --call-graph dwarf.  DWARF unwinding requires capturing up to 65 KB
#   of raw stack per sample, producing hundreds-of-MB perf.data files that take
#   minutes to parse with `perf script`.  Frame-pointer unwinding stores only a
#   chain of 8-byte addresses per sample → 50–100× smaller perf.data, instant
#   `perf script`.  cargo-flamegraph auto-detects the presence of frame pointers
#   and picks the faster call-graph mode automatically.
#   Overhead: ~1% throughput from keeping rbp as frame pointer (not used for
#   general-purpose register allocation); no correctness impact.
rustflags = ["-C", "force-frame-pointers=yes"]
