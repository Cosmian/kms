# Configuration for cargo-audit
# This file defines security advisories to ignore, mirroring the exceptions in deny.toml

[advisories]
# List of advisory IDs to ignore (extracted from deny.toml)
# Every advisory exception here must have a matching statement in sbom/openvex.json.
ignore = [
  # rsa 0.9 (Marvin) via jsonwebtoken and optional pgp; public-key operations only, see deny.toml
  "RUSTSEC-2023-0071",
  # crypto-bigint 0.5.5 via elliptic-curve 0.13 (jsonwebtoken, optional pgp); no 0.5.x patch, see deny.toml
  "RUSTSEC-2026-0387",
]
