[units.windows-est]
strict = true
sets = ["windows", "ci_setup"]
files = '^crate/server/src/routes/est/ | ^\.mise/scripts/windows/test_est_windows\.ps1$ | ^\.mise/scripts/kmip-go/go\.mod$'
setup = "windows"
runners = ["windows-2022"]
