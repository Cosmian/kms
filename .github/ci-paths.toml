[units.windows-ui]
strict = true
sets = ["windows"]
files = '^ui/ | ^crate/clients/wasm/ | ^crate/server/src/routes/ui_auth\.rs$ | ^\.mise/scripts/windows/test_ui\.ps1$'
setup = "windows"
runners = ["windows-2022"]
no-fork-pr = true

[units.windows-cng-ksp]
strict = true
sets = ["windows"]
files = '^crate/clients/(cng|pkcs11)/ | ^crate/clients/clap/src/actions/(cng|cng_verify)\.rs$ | ^\.mise/scripts/windows/test_cng_ksp\.ps1$'
setup = "windows"
runners = ["windows-2022"]
no-fork-pr = true

[units.windows-hsm-idemia]
strict = true
sets = ["windows"]
files = '''
  ^crate/hsm/
| ^crate/server/src/tests/
| ^\.mise/tasks/test/hsm/(idemia-sphere-simulator|other)$
| ^\.mise/scripts/windows/(test_hsm_idemia|test_hsm_other|hsm_common|prepare_windows_fips_provider)\.ps1$
