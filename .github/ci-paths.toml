# Pre-commit-style path filters for pull-request CI: main.yml job `changes` runs `mise run dev:ci-changes`
# (.mise/scripts/dev/ci_changes.py), whose JSON list of skipped units gates the jobs.
# - Every pattern is a Python regex compiled with re.VERBOSE (whitespace and `# comments` ignored) and
#   applied with re.search to each repo-relative path the PR changes (renames list old and new path).
# - `full`: one matching file runs every unit.
# - A unit runs when a changed file matches one of its `sets` or its `files`.
# - `strict = true`: the unit runs only when its own `sets`/`files` match; `full` and unmatched files never force it.
# - A changed file matching no unit must match `ignore`, otherwise every unit runs (fail-safe for new paths).
# - CI wiring (.github/workflows/, .github/actions/) triggers no unit except the shared setup (`ci_setup`), which runs one leg per setup path.
# - Unit keys: test-group.yml suite ids. A unit with setup = "nix" (xks-remote excepted) runs the mise task test:<unit>;
#   every other unit runs .github/actions/legs/<unit>/ from test-group.yml. Each unit is a set of legs (runners x variants) of the one
#   `test-suites` matrix job of test_all.yml; ci_changes.py builds the matrix. Optional keys, defaults in brackets:
# - `variants`: non-empty list among `fips`, `non-fips` [one leg without variant]. `bench` (variant -> HSM models) is optional.
# - `runners`: non-empty list of runner labels [ubuntu-24.04]; legs = runners x variants.
# - `setup`: `nix` (Nix shell + mise), `plain` (mise only) or `windows` [nix]; picks the setup steps of test-group.yml.
# - `timeout`: job timeout-minutes, 1-360 [360].
# - `lock`: concurrency group shared by all runs (real HSMs, XKS server) [none].
# - `environment`: GitHub deployment environment, i.e. an approval gate [none].
# - `events`: subset of pull_request, schedule, tag, workflow_dispatch on which the legs exist [all four].
# - `upstream = true`: needs the Cosmian/kms secrets; no legs outside that repository or on fork PRs.
# - `no-fork-pr = true`: no legs on fork pull requests (still run on a fork's own schedule, tag or dispatch).
# - `dependabot = true`: also runs on Dependabot PRs, which keep only these units.
# Tags, schedule and workflow_dispatch ignore the diff and run every unit whose events list them.

full = '''
  ^\.mise/lib/(common|nix_helpers|kms_build|kms_server|test_slots)\.sh$
| ^\.mise/scripts/common\.sh$
| ^(mise\.toml|shell\.nix|default\.nix|rust-toolchain\.toml|Cargo\.toml|Cargo\.lock|docker-compose\.yml)$
| ^nix/(openssl\.nix|openssl-fips-bootstrap\.|softhsm2\.nix|utimaco\.nix)
| ^\.cargo/config\.toml$
| ^\.config/
| ^crate/crypto/build\.rs$
| ^(test_data|\.github/reusable_scripts)$
'''

# Changed files that legitimately trigger nothing (docs, packaging, release, ungated jobs' inputs).
ignore = '''
  \.md$
| ^CHANGELOG/
| ^\.github/(dependabot\.yml|\.markdownlint\.yaml|scripts/patch-kube-apiserver\.py)$
| ^\.github/(workflows|actions)/  # CI wiring triggers no leg; the ci_setup set catches the shared setup first
| ^(supply-chain|sbom|cbom|charts|pkg|ansible|nix)/
| ^(deny\.toml|_typos\.toml|lychee\.toml|\.pre-commit-config\.yaml|\.gitignore|\.gitattributes|LICENSE|\.cargo/audit\.toml)$
| ^\.mise/tasks/(audit|bench|cse|demo|dev|git|package|release|sbom)/
| ^\.mise/tasks/build/(docker|k8s-bins|k8s-csi-provider-image|k8s-operator-image|nix)$
| ^\.mise/tasks/test/(k8s|pkg)/
| ^\.mise/lib/(k8s|package_build|package_smoke|bench_helpers)\.sh$
| ^\.mise/scripts/(audit|bench|demo|dev|git|package|pre-commit|release|sbom)/
| ^\.github/ci-paths\.toml$  # validated by the `--self-test` run of the `changes` job
| ^\.mise/scripts/windows/cargo_test\.ps1$  # script of the Rust-only windows-cargo-test job
'''

[sets]
# Whole workspace: compile-wide jobs and whole-workspace unit-test runners.
# kmip/ (KMIP XML vectors) and the Google CSE key fixture are read by crate tests.
rust = '^crate/ | ^kmip$ | ^documentation/docs/google_cse/test_wrapped_private_key$'

# Code linked into cosmian_kms or the ckms / test_kms_server harness: triggers the units that still run on any
# server change (forward-proxy, spire). The negative lookaheads carve out feature-owned paths.
# sql/query.sql stays core: SQLite loads it under its query_sqlite.sql overrides (server_database/src/stores/mod.rs).
server_core = '''
  ^crate/(kmip|kmip-derive|access|interfaces|crypto|test_kms_server)/
| ^crate/hsm/(base_hsm|softhsm2)/
| ^crate/clients/(client|client_utils|ckms)/
| ^crate/clients/clap/(?!src/actions/(google/|aws/|azure/|pkcs11/|bench/|cng\.rs$|cng_verify\.rs$|audit\.rs$))
| ^crate/server_database/(?!src/stores/(sql/(pgsql\.rs|mysql\.rs|query_mysql\.sql)$|redis/))
| ^crate/server/(?!src/(routes/(aws_xks|azure_ekm|google_cse|ms_dke|est|scep|ocsp|jose)/
                      |routes/(crl|jwks|ui_auth)\.rs$
                      |core/otel_metrics\.rs$
                      |middlewares/otel_http_middleware\.rs$
                      |config/wizard/
                      |tests/))
'''

pg_store = '^crate/server_database/src/stores/sql/pgsql\.rs$'
mysql_store = '^crate/server_database/src/stores/sql/(mysql\.rs|query_mysql\.sql)$'

# Database code shared by every backend (all of server_database except the other backends' stores).
db_core = '^crate/server_database/(?!src/stores/(sql/(pgsql\.rs|mysql\.rs|query_mysql\.sql)$|redis/))'

# KMIP wire format (TTLV types and the /kmip endpoint) that every KMIP interop client exercises.
kmip_wire = '^crate/(kmip|kmip-derive)/ | ^crate/server/src/routes/kmip/'

# Shared plumbing of every non-sqlite db leg (task, SoftHSM2 KEK helper).
db_shared = '''
  ^\.mise/tasks/test/db/_default$
| ^\.mise/lib/softhsm2\.sh$
'''

interop_shared = '^\.mise/tasks/test/interop/_default$'

# What compiles or tests the workspace: every crate file but its READMEs (nothing includes a .md), the toolchain
# pins and installer, the nextest config and the test_data submodule the tests read.
rust_build = '''
  ^crate/(?!.*\.md$)
| ^kmip$
| ^documentation/docs/google_cse/test_wrapped_private_key$
| ^test_data$
| ^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml)$
| ^\.cargo/config\.toml$
| ^\.config/nextest\.toml$
'''

windows = '''
  ^vcpkg(_fips)?\.json$
| ^\.mise/scripts/windows/(common|install_ninja)\.ps1$
'''

# Shared setup of every leg: the test_all.yml matrix, the test-group.yml setup steps and the toolchain actions. A change
# runs one leg per setup path (plain Linux, nix, macOS, Windows); every other CI file is ignored.
ci_setup = '''
  ^\.github/workflows/(test-group|test_all)\.yml$
| ^\.github/actions/(install-rust|install-mise|setup-nix|setup-nix-mise|cache-openssl-buildrs|cleanup-runner
                     |build-static-openssl|windows-vs-ninja)/
'''

# PKI group: the `pki` legs and the macOS leg `pki-macos`.
pki = '''
  ^crate/server/src/routes/(est|scep|ocsp)/
| ^crate/server/src/routes/crl\.rs$
| ^\.mise/tasks/test/pki/
| ^\.mise/scripts/test/(test_est_interop|test_scep_interop)\.sh$
| ^\.mise/scripts/kmip-go/go\.mod$
| ^crate/server/src/routes/(csr|enrollment|enrollment_guard)\.rs$
| ^crate/server/src/core/certificate/
| ^crate/server/src/core/operations/(certify/|generate_crl\.rs$|generate_csr\.rs$|recertify\.rs$)
| ^crate/clients/clap/src/actions/certificates/
'''

# ── legs with their own action (.github/actions/legs/<unit>/) ───────────────────────────────
[units.cargo-clippy]
strict = true
setup = "plain"
dependabot = true
files = '''
  \.rs$
| (^|/)Cargo\.toml$
| ^Cargo\.lock$
| ^(rust-toolchain|clippy)\.toml$
| ^\.cargo/config\.toml$
'''

[units.cargo-machete]
strict = true
setup = "plain"
dependabot = true
files = '\.rs$ | (^|/)Cargo\.toml$'

[units.no-nix]
strict = true
sets = ["rust_build"]
setup = "plain"
runners = ["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15"]
variants = ["fips", "non-fips"]
dependabot = true

[units.forward-proxy]
sets = ["server_core", "ci_setup"]
files = '^\.github/scripts/squid/'
setup = "plain"
variants = ["non-fips"]
dependabot = true

# `build-documentation` runs `docs:check-ai` (AI instruction files) and `docs:mdbook-build` (the mdBook site).
[units.build-documentation]
files = '''
  ^documentation/
| ^(AGENTS|CONTRIBUTING)\.md$
| ^\.github/(copilot-instructions\.md|instructions/|skills/)
| ^\.mise/(tasks|scripts)/docs/
'''
setup = "plain"
dependabot = true

# ── legs with their own action (.github/actions/legs/<unit>/) ───────────────────────────────
[units.cargo-publish-dry-run]
strict = true
sets = ["rust_build"]
setup = "plain"
no-fork-pr = true
events = ["pull_request", "schedule", "workflow_dispatch"]

[units.xks-remote]
files = '^crate/server/src/routes/aws_xks/ | ^\.mise/scripts/test/(deploy_xks_remote|test_xks_remote|test_xks_aws_e2e)\.sh$'
variants = ["non-fips"]
upstream = true
events = ["pull_request", "tag", "workflow_dispatch"]
timeout = 30
lock = "xks-remote"
environment = "xks-remote-approval"

# ── test-group.yml suites (key = `suite` input of the `test-suites` job of test_all.yml) ──
[units."db:sqlite"]
sets = ["rust", "db_shared"]
files = '^\.mise/tasks/test/db/sqlite$'
variants = ["fips", "non-fips"]

[units."db:psql"]
sets = ["db_core", "db_shared", "pg_store"]
files = '^\.mise/tasks/test/db/psql$'
variants = ["fips", "non-fips"]

[units."db:mysql"]
sets = ["db_core", "db_shared", "mysql_store"]
files = '^\.mise/tasks/test/db/mysql$'
variants = ["fips", "non-fips"]

[units."db:mariadb"]
sets = ["db_core", "db_shared", "mysql_store"]
files = '^\.mise/tasks/test/db/mariadb$'
variants = ["fips", "non-fips"]

[units."db:percona"]
sets = ["db_core", "db_shared", "mysql_store"]
files = '^\.mise/tasks/test/db/percona$'
variants = ["fips", "non-fips"]

[units."db:redis"]
sets = ["db_core", "db_shared"]
files = '^crate/server_database/src/stores/redis/ | ^\.mise/tasks/test/db/redis$'
# redis (Findex) is non-FIPS only
variants = ["non-fips"]

[units."db:openbao"]
sets = ["db_core", "pg_store", "mysql_store"]
files = '''
  ^\.mise/tasks/test/db/(_default|openbao)$
| ^\.mise/tasks/test/interop/openbao$
| ^\.mise/scripts/test/openbao/
| ^crate/server/src/routes/kv/
'''
# the OpenBao KV scenario replayed on PostgreSQL and MySQL
variants = ["fips", "non-fips"]

[units.cloud]
files = '''
  ^crate/server/src/(routes/(aws_xks|azure_ekm|google_cse)/|tests/)
| ^crate/clients/clap/src/actions/(google|aws|azure)/
| ^documentation/docs/google_cse/test_wrapped_private_key$
| ^\.mise/tasks/test/cloud/
| ^\.mise/scripts/test/(azure_ekm_test|azure_ekm_mtls_test|test_secret_aws|test_secret_azure|test_secret_vault
                       |test_secret_cosmian_kms|test_xks)\.sh$
'''
variants = ["fips", "non-fips"]
upstream = true

[units.hsm]
files = '''
  ^crate/hsm/
| ^crate/clients/pkcs11/
| ^crate/server/src/tests/
| ^\.mise/tasks/test/hsm/
| ^\.mise/lib/(softhsm2|kryoptic|pkcs11_helpers)\.sh$
| ^\.mise/scripts/test/(c2p_no_inotify\.c|pkcs11_fips_iv_shim\.c|pkcs11_gcm_iv_probe\.(c|py)|test_nix_helpers\.sh)$
'''
variants = ["fips", "non-fips"]
bench = {fips = "softhsm2 utimaco crypt2pay-simulator", non-fips = "softhsm2 utimaco crypt2pay-simulator kryoptic"}

# The real hardware HSMs, reached over the network or OpenVPN. Never on pull requests: nightly, tag and
# dispatch runs only; pull requests cover the HSM code with the software simulators of the `hsm` legs. Upstream
# repository only, where the secrets exist. The HSMs refuse concurrent connections from several CI runs:
# each unit's `lock` is one concurrency group shared by all runs, queued (test-k8s-hsm in packaging-docker.yml
# uses the same groups). A task fails, never skips, when an `env:` need is unset: a green leg proves its
# suite ran.
# Not in CI: aws-cloudhsm, azure-cloud-hsm and gcp-cloud-hsm (clusters torn down to limit cloud costs) and
# Luna (no reachable partition). To bring one back, add its unit here with its `lock`, make its task fail loudly
# on a missing secret when `CI=true` (upstream `env:` gate), and pass its secrets through test_all.yml and
# test-group.yml (names in crate/hsm/<name>/README.md).
[units."hsm:crypt2pay"]
files = '^crate/hsm/crypt2pay/'
variants = ["non-fips"]
upstream = true
events = ["schedule", "tag", "workflow_dispatch"]
lock = "hsm-crypt2pay"

[units."hsm:proteccio"]
files = '^crate/hsm/proteccio/'
variants = ["non-fips"]
upstream = true
events = ["schedule", "tag", "workflow_dispatch"]
lock = "hsm-proteccio"

[units.pkcs11]
files = '''
  ^crate/clients/pkcs11/
| ^crate/clients/clap/src/actions/pkcs11/
| ^\.mise/tasks/test/pkcs11/
| ^\.mise/lib/(softhsm2|pkcs11_helpers)\.sh$
| ^\.mise/scripts/test/(test_pkcs11_conformance\.sh|pkcs11_raw_abi_check\.py|test_gnupg\.sh|test_gnupg_smartcard\.sh
                       |gnupg_pkcs11_scd_driver\.py|test_luks\.sh|test_openssh\.sh|test_hsm_kek_pkcs11_comprehensive\.sh
                       |test_pkcs11_check\.sh|requirements-pkcs11-check\.(in|txt)|test_veracrypt\.sh)$
| ^crate/server/src/core/operations/pkcs11\.rs$
'''
# Every pkcs11 leaf is non-FIPS only.
variants = ["non-fips"]

[units.obs]
files = '''
  ^crate/server/src/(core/otel_metrics\.rs$|middlewares/otel_http_middleware\.rs$|tests/)
| ^crate/clients/clap/src/actions/audit\.rs$
| ^\.mise/tasks/test/obs/
| ^\.mise/lib/audit_(e2e|compat)\.sh$
| ^\.mise/scripts/test/(test_audit_log\.sh|test_audit_postgres_log\.sh|generate_live_audit_fixture\.sh
                       |validate_audit_compat\.py|fixtures/|test_cef_format\.sh|test_siem_[a-z_]+\.sh
                       |siem_verify_fields\.py|cef_helper\.py|rsyslog\.conf|test_monitoring\.sh
                       |requirements-(cef|audit-compat)\.(in|txt))
| ^monitoring/
| ^documentation/arcsight/
| ^crate/server/src/(core/audit/|middlewares/audit/|routes/kmip/audit\.rs$)
| ^crate/server_database/src/stores/audit/
'''
variants = ["fips", "non-fips"]

[units.pki]
sets = ["pki"]
variants = ["fips", "non-fips"]

[units.pki-macos]
sets = ["pki", "ci_setup"]
setup = "plain"
runners = ["macos-15"]
variants = ["fips"]
timeout = 60

[units.spire]
sets = ["server_core"]
files = '''
  ^crate/server/src/tests/
| ^authentication$
| ^\.mise/tasks/test/spire/
| ^\.mise/lib/spire_test\.sh$
| ^\.mise/scripts/test/grant_spire_pki_certify\.sh$
'''
variants = ["non-fips"]

[units.ui]
files = '''
  ^ui/
| ^crate/clients/wasm/
| ^crate/server/src/routes/ui_auth\.rs$
| ^authentication$
| ^\.mise/tasks/test/ui/
| ^\.mise/tasks/build/(ui|wasm)$
| ^\.mise/scripts/test/(test_ui|test_ui_auth|test_ui_oidc|test_ui_saml)\.sh$
| ^\.mise/scripts/test/saml_sso/
'''
variants = ["fips", "non-fips"]

[units."interop:ase"]
sets = ["kmip_wire", "interop_shared"]
files = '^crate/clients/pkcs11/ | ^\.mise/tasks/test/interop/ase$ | ^\.mise/scripts/test/test_ase_tde\.sh$ | ^\.mise/scripts/docker/ase/'
variants = ["non-fips"]

[units."interop:db2"]
sets = ["kmip_wire", "interop_shared"]
files = '^\.mise/tasks/test/interop/db2$ | ^\.mise/scripts/test/test_db2_tde\.sh$'
variants = ["non-fips"]

[units."interop:edb-tde"]
sets = ["kmip_wire", "interop_shared"]
files = '^\.mise/tasks/test/interop/edb-tde$ | ^\.mise/scripts/test/test_edb_tde\.sh$ | ^\.mise/scripts/(edb_tde|pykmip)/'
variants = ["non-fips"]

[units."interop:iris"]
sets = ["kmip_wire", "interop_shared"]
files = '^\.mise/tasks/test/interop/iris$ | ^\.mise/scripts/test/test_iris\.sh$'
variants = ["non-fips"]

[units."interop:jose"]
sets = ["interop_shared"]
files = '''
  ^crate/server/src/(routes/(jose/|jwks\.rs$)|tests/)
| ^crate/hsm/kryoptic/
| ^\.mise/tasks/test/(interop|hsm)/jose$
| ^\.mise/lib/kryoptic\.sh$
| ^\.mise/scripts/test/(test_jose\.sh|jose_interop_helper\.py|requirements-jose\.(in|txt))$
'''
variants = ["non-fips"]

[units."interop:kmip-go"]
sets = ["kmip_wire", "interop_shared"]
files = '''
  ^kmip$
| ^\.mise/tasks/test/interop/kmip-go$
| ^\.mise/scripts/test/test_kmip_go\.sh$
| ^\.mise/scripts/kmip-go/
| ^\.mise/scripts/pykmip/kms\.toml$
'''
variants = ["fips", "non-fips"]

[units."interop:kmipkit"]
sets = ["kmip_wire", "interop_shared"]
files = '^\.mise/tasks/test/interop/kmipkit$ | ^\.mise/scripts/kmipkit-fixes\.patch$'
variants = ["non-fips"]

[units."interop:openbao"]
sets = ["interop_shared"]
files = '^\.mise/tasks/test/interop/openbao$ | ^\.mise/scripts/test/openbao/ | ^crate/server/src/routes/kv/'
variants = ["fips", "non-fips"]

[units."interop:openbao-auth-verifier"]
sets = ["interop_shared"]
files = '^authentication$ | ^\.mise/tasks/test/interop/openbao-auth-verifier$ | ^\.mise/lib/spire_test\.sh$ | ^\.mise/scripts/test/openbao/ | ^crate/server/src/middlewares/auth_verifier/'
variants = ["fips", "non-fips"]

[units."interop:openbao-kmip"]
sets = ["kmip_wire", "interop_shared"]
files = '^\.mise/tasks/test/interop/openbao-kmip$ | ^\.mise/scripts/test/openbao/'
variants = ["fips", "non-fips"]

[units."interop:pykmip"]
sets = ["kmip_wire", "interop_shared", "ci_setup"]
files = '^\.mise/tasks/test/interop/pykmip$ | ^\.mise/scripts/test/test_pykmip\.sh$ | ^\.mise/scripts/pykmip/'
variants = ["non-fips"]

[units."interop:ssh-secrets"]
sets = ["interop_shared", "pg_store", "mysql_store"]
files = '''
  ^\.mise/tasks/test/interop/ssh-secrets$
| ^\.mise/scripts/test/(test_ssh_certificates|test_secret_rotation)\.sh$
| ^\.mise/scripts/test/openbao/bao_verifier\.sh$
| ^crate/server/src/routes/(ssh|kv)/
'''
variants = ["fips", "non-fips"]

# ── legs with their own action (.github/actions/legs/<unit>/) ───────────────────────────────
[units.windows-cargo-test]
strict = true
sets = ["rust_build"]
setup = "windows"
runners = ["windows-2022"]
