---
name: Test MISE group

# The one runner of every CI leg (see .github/ci-paths.toml): units with setup = nix run `mise run test:<suite>`;
# every other unit runs its own composite action .github/actions/legs/<unit>/ (the db:* units also run legs/db).

on:
  workflow_call:
    inputs:
      suite:
        description: unit of .github/ci-paths.toml (test:<suite> task to run, or a leg with its own steps below)
        required: true
        type: string
      variant:
        description: fips or non-fips ('' for a unit without variants)
        required: false
        type: string
        default: ''
      runner:
        description: runner label (runs-on)
        required: false
        type: string
        default: ubuntu-24.04
      setup:
        description: nix (Nix shell + mise), plain (mise only) or windows
        required: false
        type: string
        default: nix
      timeout:
        description: job timeout-minutes
        required: false
        type: number
        default: 360
      environment:
        description: GitHub deployment environment (approval gate), '' for none
        required: false
        type: string
        default: ''
      skip:
        description: Space-separated <group>:<leaf> ids exported as TEST_SKIP_LEAVES
        required: false
        type: string
        default: ''
      bench:
        description: Space-separated HSM models benchmarked after the tests (never on pull requests)
        required: false
        type: string
        default: ''
    secrets:
      DOCKERHUB_USERNAME: {required: false}
      DOCKERHUB_TOKEN: {required: false}
      EDB_SUBSCRIPTION_TOKEN: {required: false}
      IRIS_LICENSE_KEY: {required: false}
      AUDIT_COMPAT_SPLUNK_PASSWORD: {required: false}
      TEST_GOOGLE_OAUTH_CLIENT_ID: {required: false}
      TEST_GOOGLE_OAUTH_CLIENT_SECRET: {required: false}
      TEST_GOOGLE_OAUTH_REFRESH_TOKEN: {required: false}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: {required: false}
      KMS_CI_AWS_ACCESS_KEY_ID: {required: false}
      KMS_CI_AWS_SECRET_ACCESS_KEY: {required: false}
      KMS_CI_AWS_REGION: {required: false}
      KMS_CI_AZURE_TENANT_ID: {required: false}
      KMS_CI_AZURE_CLIENT_ID: {required: false}
      KMS_CI_AZURE_CLIENT_SECRET: {required: false}
      KMS_CI_AZURE_KV_NAME: {required: false}
      PROTECCIO_IP: {required: false}
      PROTECCIO_PASSWORD: {required: false}
      PROTECCIO_SLOT: {required: false}
      CRYPT2PAY_PASSWORD: {required: false}
      OVPN_CONF: {required: false}
      KMS_XKS_SSH_PRIVATE_KEY: {required: false}
      KMS_XKS_SSH_KNOWN_HOSTS: {required: false}
      KMS_XKS_SSH_USER: {required: false}
      KMS_XKS_SIGV4_ACCESS_KEY_ID: {required: false}
      KMS_XKS_SIGV4_SECRET_ACCESS_KEY: {required: false}
      AWS_XKS_ACCESS_KEY_ID: {required: false}
      AWS_XKS_SECRET_ACCESS_KEY: {required: false}
      AWS_XKS_KEY_ARN: {required: false}
      PAT_TOKEN: {required: false}

jobs:
  test:
    # Titles of the jobs these legs replaced; any other unit is `Test <suite> (<variant>)` (the caller row already shows
    # the suite, variant and non-default runner).
    name: >-
      ${{ fromJSON(format('{{"no-nix":"No Nix - {0} - sqlite - {1}","cloud":"Test cloud ({1})","xks-remote":"AWS XKS — remote server","pki-macos":"Test
      pki (macOS)","windows-cargo-test":"windows - cargo test","windows-ui":"windows - UI E2E tests","windows-cng-ksp":"windows - CNG KSP integration tests","windows-hsm-idemia":"windows
      - HSM tests (Idemia SPHERE simulator, {1})","windows-est":"windows - EST interoperability tests","build-documentation":"Build documentation","forward-proxy":"forward
      proxy","cargo-clippy":"Cargo clippy","cargo-machete":"Cargo machete","cargo-publish-dry-run":"Cargo publish - dry run"}}', inputs.runner, inputs.variant))[inputs.suite]
      || format('Test {0}{1}', inputs.suite, inputs.variant != '' && format(' ({0})', inputs.variant) || '') }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    env:
      # `secrets` is unavailable in step-level `if:`; empty when the caller does not pass it.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: ./.github/actions/install-rust
        if: inputs.setup != 'nix' || inputs.suite == 'xks-remote'

      - uses: ./.github/actions/cache-openssl-buildrs
        if: inputs.setup != 'windows' && inputs.suite != 'cargo-machete' && inputs.suite != 'build-documentation'
        with:
          variant: ${{ inputs.variant || 'non-fips' }}

      - uses: ./.github/actions/setup-nix-mise
        if: inputs.setup == 'nix'
        with:
          cleanup-runner: 'true'
          dev-shell-cache: 'true'

      - uses: ./.github/actions/install-mise
        if: inputs.setup == 'plain'

      - uses: ./.github/actions/windows-vs-ninja
        if: inputs.setup == 'windows'

      - name: Build static OpenSSL
        if: inputs.setup == 'windows'
        uses: ./.github/actions/build-static-openssl

      - if: startsWith(inputs.suite, 'db:')
        uses: ./.github/actions/legs/db

      - name: Docker login (Docker Hub)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # An upstream leaf fails, never skips, when a secret it needs is empty: a green upstream job proves it ran.
      - name: Test
        if: inputs.setup == 'nix' && inputs.suite != 'xks-remote'
        env:
          EDB_SUBSCRIPTION_TOKEN: ${{ secrets.EDB_SUBSCRIPTION_TOKEN }}
          IRIS_LICENSE_KEY: ${{ secrets.IRIS_LICENSE_KEY }}
          SPLUNK_PASSWORD: ${{ secrets.AUDIT_COMPAT_SPLUNK_PASSWORD }}
          TEST_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_ID }}
          TEST_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_SECRET }}
          TEST_GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.TEST_GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.KMS_CI_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.KMS_CI_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.KMS_CI_AWS_REGION }}
          AZURE_TENANT_ID: ${{ secrets.KMS_CI_AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.KMS_CI_AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.KMS_CI_AZURE_CLIENT_SECRET }}
          AZURE_KV_NAME: ${{ secrets.KMS_CI_AZURE_KV_NAME }}
          PROTECCIO_IP: ${{ secrets.PROTECCIO_IP }}
          PROTECCIO_PASSWORD: ${{ secrets.PROTECCIO_PASSWORD }}
          PROTECCIO_SLOT: ${{ secrets.PROTECCIO_SLOT }}
          CRYPT2PAY_PASSWORD: ${{ secrets.CRYPT2PAY_PASSWORD }}
          OVPN_CONF: ${{ secrets.OVPN_CONF }}
          # Lets mise install tools from GitHub releases without the unauthenticated rate limit.
          GITHUB_TOKEN: ${{ github.token }}
          TEST_SKIP_LEAVES: ${{ inputs.skip }}
          SUITE: ${{ inputs.suite }}
          VARIANT: ${{ inputs.variant }}
        run: |
          st=0
          mise run "test:${SUITE}" --variant "$VARIANT" || st=$?
          if [ "$st" -eq 77 ]; then echo "::warning::test:${SUITE} skipped (see its SKIP line)"; st=0; fi
          exit "$st"

      - name: Bench (PKCS#11 load, HSM-delegated)
        if: inputs.bench != '' && github.event_name != 'pull_request'
        env:
          BENCH: ${{ inputs.bench }}
          VARIANT: ${{ inputs.variant }}
        run: |
          # shellcheck disable=SC2086 # BENCH is a space-separated model list
          for m in $BENCH; do mise run bench:pkcs11 --delegated --hsm-model "$m" --variant "$VARIANT" -s; done

      - name: Bench (HSM-delegated)
        if: inputs.bench != '' && github.event_name != 'pull_request'
        env:
          BENCH: ${{ inputs.bench }}
          VARIANT: ${{ inputs.variant }}
        run: |
          # shellcheck disable=SC2086 # BENCH is a space-separated model list
          for m in $BENCH; do mise run bench:hsm --delegated --hsm-model "$m" --variant "$VARIANT" -s; done

      - if: inputs.suite == 'cargo-clippy'
        uses: ./.github/actions/legs/cargo-clippy

      - if: inputs.suite == 'cargo-machete'
        uses: ./.github/actions/legs/cargo-machete

      - if: inputs.suite == 'no-nix'
        uses: ./.github/actions/legs/no-nix
        with:
          variant: ${{ inputs.variant }}

      - if: inputs.suite == 'forward-proxy'
        uses: ./.github/actions/legs/forward-proxy

      - if: inputs.suite == 'build-documentation'
        uses: ./.github/actions/legs/build-documentation
        with:
          public-docs-token: ${{ secrets.PAT_TOKEN }}

      - if: inputs.suite == 'cargo-publish-dry-run'
        uses: ./.github/actions/legs/cargo-publish-dry-run

      - if: inputs.suite == 'xks-remote'
        uses: ./.github/actions/legs/xks-remote
        with:
          ssh-private-key: ${{ secrets.KMS_XKS_SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.KMS_XKS_SSH_KNOWN_HOSTS }}
          ssh-user: ${{ secrets.KMS_XKS_SSH_USER }}
          sigv4-access-key-id: ${{ secrets.KMS_XKS_SIGV4_ACCESS_KEY_ID }}
          sigv4-secret-access-key: ${{ secrets.KMS_XKS_SIGV4_SECRET_ACCESS_KEY }}
          aws-access-key-id: ${{ secrets.AWS_XKS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_XKS_SECRET_ACCESS_KEY }}
          aws-key-arn: ${{ secrets.AWS_XKS_KEY_ARN }}

      - if: inputs.suite == 'pki-macos'
        uses: ./.github/actions/legs/pki-macos

      - if: inputs.suite == 'windows-cargo-test'
        uses: ./.github/actions/legs/windows-cargo-test

      - if: inputs.suite == 'windows-ui'
        uses: ./.github/actions/legs/windows-ui

      - if: inputs.suite == 'windows-cng-ksp'
        uses: ./.github/actions/legs/windows-cng-ksp

      - if: inputs.suite == 'windows-hsm-idemia'
        uses: ./.github/actions/legs/windows-hsm-idemia
        with:
          variant: ${{ inputs.variant }}

      - if: inputs.suite == 'windows-est'
        uses: ./.github/actions/legs/windows-est
