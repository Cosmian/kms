---
name: CPU Scaling Flamegraph

on:
  # Run on demand (useful to generate fresh flamegraphs and throughput charts)
  workflow_dispatch:
    inputs:
      profile_time:
        description: Seconds to record per bench (flamegraph depth vs. speed trade-off)
        required: false
        default: '15'
      worker_counts:
        description: Comma-separated worker counts to include (e.g. 1,2,4,8)
        required: false
        default: '1,2,4,8'

  # Run weekly on Monday at 03:00 UTC to track scaling over time
  schedule:
    - cron: '0 3 * * 1'

  # Run on PRs that touch the server workers path or the bench itself
  pull_request:
    paths:
      - 'crate/server/src/config/command_line/http_config.rs'
      - 'crate/server/src/start_kms_server.rs'
      - 'crate/test_kms_server/benches/http_throughput.rs'

jobs:
  cpu-scaling:
    name: HTTP Throughput – CPU Scaling
    # Use a large GitHub-hosted runner (8 vCPUs) for reproducible results
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            linux-perf \
            libssl-dev \
            pkg-config \
            curl

      - name: Install cargo-flamegraph
        run: cargo install flamegraph --locked

      - name: Enable perf_event_open for unprivileged processes
        # Required for cargo-flamegraph / perf to record events
        run: |
          echo -1 | sudo tee /proc/sys/kernel/perf_event_paranoid
          echo 0   | sudo tee /proc/sys/kernel/kptr_restrict

      # ── Throughput benchmark (Criterion HTML report) ────────────────────
      - name: Run HTTP throughput benchmark
        env:
          CARGO_PROFILE_BENCH_DEBUG: "true"
        run: |
          cargo bench \
            --bench http_throughput \
            -p test_kms_server \
            -- \
            --output-format bencher \
            2>&1 | tee target/http_throughput_bench.txt

      # ── Flamegraph per worker count ──────────────────────────────────────
      # cargo-flamegraph wraps the bench binary under `perf record`
      # and produces an SVG via inferno-flamegraph.
      - name: Generate flamegraphs
        env:
          CARGO_PROFILE_BENCH_DEBUG: "true"
        run: |
          mkdir -p target/flamegraphs
          for workers in $(echo "${{ inputs.worker_counts || '1,4,8' }}" | tr ',' ' '); do
            echo "=== Generating flamegraph for ${workers} workers ==="
            # Run only the ECDSA bench (most CPU-intensive) for the flamegraph;
            # pass --bench to Criterion so it runs in bench mode (not test mode).
            FLAMEGRAPH_SVG="target/flamegraphs/ecdsa_sign_w${workers}.svg"
            cargo flamegraph \
              --bench http_throughput \
              -p test_kms_server \
              --output "${FLAMEGRAPH_SVG}" \
              -- \
              --bench \
              "ECDSA P-256 sign/${workers} workers" \
              --profile-time "${{ inputs.profile_time || '15' }}" \
              || echo "Flamegraph for ${workers} workers failed (non-fatal)"
          done

      # ── Upload artifacts ─────────────────────────────────────────────────
      - name: Upload Criterion HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: criterion-http-throughput-${{ github.run_id }}
          path: target/criterion/
          retention-days: 90

      - name: Upload flamegraph SVGs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flamegraph-svgs-${{ github.run_id }}
          path: target/flamegraphs/
          retention-days: 90

      - name: Upload bench output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: http-throughput-output-${{ github.run_id }}
          path: target/http_throughput_bench.txt
          retention-days: 30
