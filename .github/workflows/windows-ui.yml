---
name: Windows UI E2E tests

on:
  workflow_call:
    inputs:
      archive-name:
        required: false
        type: string
        default: windows
  pull_request:
    paths:
      - vcpkg.json
      - vcpkg_fips.json
      - .github/actions/build-static-openssl/**
      - .github/actions/windows-vs-ninja/**
      - .mise/scripts/windows/common.ps1
      - .mise/scripts/windows/install_ninja.ps1
      - ui/**
      - crate/clients/wasm/**
      - crate/server/src/routes/ui_auth.rs
      - .mise/scripts/windows/test_ui.ps1

concurrency:
  group: windows-ui-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-ui:
    name: ${{ inputs.archive-name || 'windows' }} - UI E2E tests
    # Not on dependabot PRs and not on fork PRs (as before).
    if: ${{ !(github.event_name == 'pull_request' && (startsWith(github.head_ref, 'dependabot/') || github.actor == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name
      != github.repository)) }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-rust

      # Run in the checkout so the target lands on the rust-toolchain.toml toolchain, not on stable.
      - run: rustup target add wasm32-unknown-unknown

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      # Corepack runs the pnpm pinned with its sha512 in ui/package.json.
      - name: Enable Corepack pnpm
        run: corepack enable pnpm

      - uses: ./.github/actions/windows-vs-ninja

      - name: Build static OpenSSL
        uses: ./.github/actions/build-static-openssl

      - name: Install wasm-pack
        shell: pwsh
        run: cargo install wasm-pack --locked

      - name: Run UI E2E tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\.mise\scripts\windows\test_ui.ps1

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-test-logs-windows
          path: |
            ${{ runner.temp }}\kms-stdout.log
            ${{ runner.temp }}\kms-stderr.log
            ui\test-results\
            ui\playwright-report\
