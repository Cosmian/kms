---
# Local reusable workflow — Update generated docs.
#
# Runs `mise run docs:sync-all` (server/ckms docs, KMIP tables, CBOM, log
# index), regenerates the test vector README and `sbom/licenses.txt`, then
# publishes the result to `ref`: a credential-free builder job uploads a patch and
# commit-generated.yml (Git only) applies and pushes it.
#
# Callers / triggers
# ──────────────────
# nightly.yml — non-tag refs only (branches/schedule/workflow_dispatch); tag
#               refs are already in sync via release.yml.
# release.yml — Job: runs on the release branch after `prepare` (and after
#               `update-nix-hashes`, to avoid two independent workflows
#               pushing to the same release branch at once).

name: Update generated docs

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >
          Branch to update (leave empty to use the dispatched branch).
        required: false
        type: string
        default: ''
      new_version:
        description: >
          Optional version string appended to the commit message (e.g. "5.20.0").
        required: false
        type: string
        default: ''

  workflow_call:
    inputs:
      ref:
        description: >
          Git ref (branch name) to check out and push the regenerated
          files to.
        required: true
        type: string
      new_version:
        description: >
          Optional version string appended to the commit message (e.g. "5.20.0").
        required: false
        type: string
        default: ''
    secrets:
      PAT_TOKEN:
        description: >
          Personal Access Token with `repo` + `workflow` scopes.
          Required so that the push re-triggers other workflows
          (GITHUB_TOKEN cannot do this).
        required: true

jobs:
  # Builder: executes the generators (cargo run, cdxgen, ...) and holds NO credential. It uploads a data
  # patch limited to the generated files; commit-generated.yml is the only job that can push.
  generate-docs:
    name: Regenerate docs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Capture base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/install-rust

      - uses: ./.github/actions/install-mise

      - name: Probe that dependency code receives no release credential
        run: python3 .mise/scripts/dev/test_release_security.py --probe "$GITHUB_WORKSPACE"

      - name: Regenerate all documentation
        run: |
          # generate_docs.sh is the single entry point for all auto-generated docs:
          #   1. server_cli.md + server_configuration_file.md (--help / --print-default-config)
          #   2. documentation/docs/kms_clients/cli/main_commands.md + usage.md (ckms markdown)
          #   3. KMIP support tables (README.md + kmip_support/support.md)
          #   4. cbom/cbom.cdx.json (CycloneDX 1.6, requires cdxgen)
          pip install cyclonedx-bom --quiet
          mise run docs:sync-all

      - name: Regenerate test vector README
        run: |
          # gen_vector_readme.py exits 1 both when it rewrote the README and on
          # real errors (missing vectors dir, count mismatch). Only the success
          # path prints the "✓" summary line, so require it on a non-zero exit.
          rc=0
          out=$(python3 .mise/scripts/docs/gen_vector_readme.py 2>&1) || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! grep -q '^✓' <<<"$out"; then
            echo "ERROR: gen_vector_readme.py failed (exit $rc)" >&2
            exit "$rc"
          fi

      - name: Install cargo-deny
        run: cargo install --version 0.19.0 cargo-deny --locked

      - name: Generate SBOM licenses list
        run: cargo deny list -l crate | sed 's/\x1b\[[0-9;]*m//g' > sbom/licenses.txt

      - name: Capture the generated files as a patch
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          OUT_DIR: ${{ runner.temp }}/generated-docs
          # Explicit paths: never capture stray changes (e.g. a Cargo.lock touched by a non-`--locked` build).
          PATHS: |
            README.md
            cbom/cbom.cdx.json
            crate/server/kms_template.toml
            pkg/kms.toml
            sbom/licenses.txt
            documentation/docs/configuration/server_cli.md
            documentation/docs/configuration/server_configuration_file.md
            documentation/docs/configuration/log-reference.md
            documentation/docs/kms_clients/cli/main_commands.md
            documentation/docs/kms_clients/usage.md
            documentation/docs/kmip_support/support.md
            crate/test_kms_server/README.md
        run: bash .mise/scripts/release/make_generated_patch.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated-docs
          path: ${{ runner.temp }}/generated-docs
          retention-days: 1
          if-no-files-found: error

  # Publisher: Git only. [skip ci] prevents push-triggered workflows (e.g. nightly.yml) from re-running
  # on this automated commit and creating a loop.
  update-generated-docs:
    name: Commit generated docs
    needs: generate-docs
    permissions:
      contents: read
    uses: ./.github/workflows/commit-generated.yml
    with:
      ref: ${{ inputs.ref || github.ref_name }}
      base-sha: ${{ needs.generate-docs.outputs.base_sha }}
      artifact: generated-docs
      message: >-
        docs: regenerate generated files${{ inputs.new_version != '' && format(' for {0}', inputs.new_version) || '' }} [skip ci]
      paths: |
        README.md
        cbom/cbom.cdx.json
        crate/server/kms_template.toml
        pkg/kms.toml
        sbom/licenses.txt
        documentation/docs/configuration/server_cli.md
        documentation/docs/configuration/server_configuration_file.md
        documentation/docs/configuration/log-reference.md
        documentation/docs/kms_clients/cli/main_commands.md
        documentation/docs/kms_clients/usage.md
        documentation/docs/kmip_support/support.md
        crate/test_kms_server/README.md
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
