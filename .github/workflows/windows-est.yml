---
name: Windows EST interop tests

on:
  workflow_call:
    inputs:
      archive-name:
        required: false
        type: string
        default: windows
  pull_request:
    paths:
      - vcpkg.json
      - vcpkg_fips.json
      - .github/actions/build-static-openssl/**
      - .github/actions/windows-vs-ninja/**
      - .mise/scripts/windows/common.ps1
      - .mise/scripts/windows/install_ninja.ps1
      - crate/server/src/routes/est/**
      - .mise/scripts/windows/test_est_windows.ps1
      - .mise/scripts/kmip-go/go.mod

concurrency:
  group: windows-est-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-est-interop:
    name: ${{ inputs.archive-name || 'windows' }} - EST interoperability tests
    # Not on dependabot PRs and not on fork PRs (as before).
    if: ${{ !(github.event_name == 'pull_request' && (startsWith(github.head_ref, 'dependabot/') || github.actor == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name
      != github.repository)) }}
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-rust

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .mise/scripts/kmip-go/go.mod

      - uses: ./.github/actions/windows-vs-ninja

      - name: Build static OpenSSL
        uses: ./.github/actions/build-static-openssl

      - name: Run EST interoperability tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .mise\scripts\windows\test_est_windows.ps1

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: est-interop-test-logs-windows
          path: |
            ${{ runner.temp }}\kms-est-win-*\kms-bootstrap.log
            ${{ runner.temp }}\kms-est-win-*\kms-bootstrap.log.err
            ${{ runner.temp }}\kms-est-win-*\kms.log
            ${{ runner.temp }}\kms-est-win-*\kms.log.err
