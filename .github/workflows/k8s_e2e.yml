---
name: K8s E2E

# End-to-end tests for the Kubernetes integrations:
#   - KMS Provider Plugin        (issue #861) — etcd Secret encryption
#   - Secrets Store CSI Provider (issue #862) — secret file mounts
#   - KMS operator (inject mode)
#   - Operator Docker image       (Nix image loaded into Minikube)
#   - CSI provider Docker image   (Nix image loaded into Minikube)
#
# Design notes:
#   * Compilation and unit tests are NOT re-run here — the workspace build,
#     `cargo test --workspace --lib` and `cargo clippy-all` already run in the
#     nix `test-nix` jobs (test_all.yml). This workflow only produces runnable
#     binaries once (build-k8s-bins) and exercises the live-cluster behaviour.
#   * Helm chart lint/template is covered by `mise run test:helm`; it is not
#     duplicated here.
#   * All cluster orchestration lives in the reusable MISE tasks
#     (.mise/tasks/test/k8s/) so the workflow stays thin and the same tests
#     can be run locally with `mise run test:k8s`.

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string

jobs:
  # ── Build the k8s binaries + ckms ONCE, share them with every binary E2E job ─
  build-k8s-bins:
    name: Build k8s binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-k8s-bins-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-k8s-bins-

      - name: Build k8s binaries and ckms
        run: |
          cargo build --release \
            -p cosmian_kms_k8s_plugin \
            -p cosmian_kms_k8s_operator \
            -p cosmian_kms_csi_provider \
            -p ckms

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: k8s-e2e-bins
          if-no-files-found: error
          retention-days: 1
          path: |
            target/release/cosmian-kms-plugin
            target/release/cosmian-kms-operator
            target/release/cosmian-kms-csi-provider
            target/release/ckms

  # ── Build Operator + CSI provider Docker images via Nix (shared) ─────────────
  build-k8s-images:
    name: Build k8s Docker images (Nix)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-nix
        with:
          extra-nix-config: http-connections = 8

      - uses: ./.github/actions/install-mise

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Build Operator image
        run: mise run build:k8s-operator-image

      - name: Build CSI Provider image
        run: mise run build:k8s-csi-provider-image

      - name: Upload image tarballs
        uses: actions/upload-artifact@v7
        with:
          name: k8s-docker-images
          if-no-files-found: error
          retention-days: 1
          path: |
            result-k8s-operator-image
            result-k8s-csi-provider-image

  # ── Run each binary E2E scenario on its own fresh Minikube cluster ───────────
  e2e:
    name: ${{ matrix.scenario }} (Minikube)
    needs: build-k8s-bins
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: k8s-plugin
            task: test:k8s:plugin
          - scenario: k8s-plugin-mtls
            task: test:k8s:plugin --mtls
          - scenario: k8s-csi-provider
            task: test:k8s:csi-provider --skip-image
          - scenario: k8s-operator
            task: test:k8s:operator --skip-image

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-mise

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Download prebuilt binaries
        uses: actions/download-artifact@v8
        with:
          name: k8s-e2e-bins
          path: target/release

      - name: Make binaries executable
        run: |
          chmod +x \
            target/release/cosmian-kms-plugin \
            target/release/cosmian-kms-operator \
            target/release/cosmian-kms-csi-provider \
            target/release/ckms

      - name: Start Minikube
        uses: medyagh/setup-minikube@v0.0.18
        with:
          driver: docker
          kubernetes-version: v1.32.0

      - name: Run ${{ matrix.scenario }} E2E
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run ${{ matrix.task }}

  # ── Test Docker images inside Minikube ───────────────────────────────────────
  e2e-images:
    name: ${{ matrix.scenario }} Docker image (Minikube)
    needs: build-k8s-images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: k8s-operator-image
            task: test:k8s:operator-image
            image_link: result-k8s-operator-image
          - scenario: k8s-csi-provider-image
            task: test:k8s:csi-provider-image
            image_link: result-k8s-csi-provider-image

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-mise

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Download prebuilt image tarballs
        uses: actions/download-artifact@v8
        with:
          name: k8s-docker-images
          path: .

      - name: Restore image symlinks
        run: |
          # actions/download-artifact resolves symlinks to the actual file.
          # Re-create the expected result-* symlinks pointing to the downloaded files.
          for name in result-k8s-operator-image result-k8s-csi-provider-image; do
            # The artifact download creates the file under the symlink name directly
            if [ -f "$name" ] && [ ! -L "$name" ]; then
              # Already a plain file — nothing to do
              echo "$name is a plain file (symlink resolved by artifact upload)"
            fi
          done

      - name: Start Minikube
        uses: medyagh/setup-minikube@v0.0.18
        with:
          driver: docker
          kubernetes-version: v1.32.0

      - name: Run ${{ matrix.scenario }} image test
        run: mise run ${{ matrix.task }}
