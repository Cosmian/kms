---
name: Windows cargo test

on:
  workflow_call:
    inputs:
      archive-name:
        required: false
        type: string
        default: windows
      full-suite:
        description: false skips test_kms_server and ckms lib tests (covered on Linux); pull requests always run the quick suite
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - crate/**
      - '!crate/**/*.md'
      - kmip
      - documentation/docs/google_cse/test_wrapped_private_key
      - test_data
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/config.toml
      - .config/nextest.toml
      - .github/actions/install-rust/**
      - .github/actions/cache-openssl-buildrs/**

concurrency:
  group: windows-cargo-test-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-test:
    name: ${{ inputs.archive-name || 'windows' }} - cargo test
    # Not on dependabot PRs and not on fork PRs (as before).
    if: ${{ !(github.event_name == 'pull_request' && (startsWith(github.head_ref, 'dependabot/') || github.actor == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name
      != github.repository)) }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-rust

      - uses: ./.github/actions/windows-vs-ninja

      - name: Build static OpenSSL
        uses: ./.github/actions/build-static-openssl

      - name: Tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . .\.mise\scripts\windows\cargo_test.ps1
          if ('${{ inputs.full-suite }}' -eq 'true') { TestProject } else { TestProject -Quick }
        env:
          # Google variables
          TEST_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_ID }}
          TEST_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_SECRET }}
          TEST_GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.TEST_GOOGLE_OAUTH_REFRESH_TOKEN }}
