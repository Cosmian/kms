---
name: Kubernetes Packaging & E2E

# Covers all Kubernetes-related CI for Cosmian KMS:
#   - K8s E2E tests (KMS Provider Plugin, CSI Driver Provider, Operator) on every
#     PR/branch push and manual dispatch
#   - K8s plugin deb/rpm packaging on tags and manual dispatch
#   - Helm chart publish to GitHub Pages on tags and manual dispatch
#
# GitHub Pages must be enabled for this repository with source set to the
# "gh-pages" branch (Settings → Pages → Source). The chart-releaser action
# creates and maintains that branch automatically on the first run.
# After the first successful Helm chart publish, users can add the repository:
#   helm repo add cosmian https://cosmian.github.io/kms
#   helm install cosmian-kms cosmian/cosmian-kms

on:
  workflow_call:

  push:
    tags:
      - v*

  workflow_dispatch:

permissions:
  contents: write  # push to gh-pages branch + create GitHub Release assets
  pages: write     # update GitHub Pages
  id-token: write  # needed for pages deployment

jobs:
  # ── Build the k8s binaries + ckms via Nix ONCE, share with every E2E job ─────
  build-k8s-bins:
    name: Build k8s binaries (Nix)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/cleanup-runner

      - uses: ./.github/actions/setup-nix
        with:
          extra-nix-config: http-connections = 8

      - uses: ./.github/actions/install-mise

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Build k8s binaries and ckms via Nix
        run: mise run build:k8s-bins

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: k8s-e2e-bins
          if-no-files-found: error
          retention-days: 1
          path: |
            target/release/kubernetes-kms-plugin
            target/release/cosmian-kms-operator
            target/release/cosmian-kms-csi-provider
            target/release/ckms

  # ── Build Operator + CSI provider Docker images via Nix (shared) ─────────────
  build-k8s-images:
    name: Build k8s Docker images (Nix)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-nix
        with:
          extra-nix-config: http-connections = 8

      - uses: ./.github/actions/install-mise

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Build Operator image
        run: mise run build:k8s-operator-image

      - name: Build CSI Provider image
        run: mise run build:k8s-csi-provider-image

      - name: Upload image tarballs
        uses: actions/upload-artifact@v7
        with:
          name: k8s-docker-images
          if-no-files-found: error
          retention-days: 1
          path: |
            result-k8s-operator-image
            result-k8s-csi-provider-image

  # ── E2E: plugin (binary on the Minikube node) ────────────────────────────────
  # The plugin runs as a systemd service on the control-plane node.
  # It is tested with prebuilt binaries; Docker images are not involved.
  e2e-plugin:
    name: ${{ matrix.scenario }} (Minikube)
    needs: build-k8s-bins
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: k8s-plugin
            task: test:k8s:plugin
          - scenario: k8s-plugin-mtls
            task: test:k8s:plugin --mtls

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-mise

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Download prebuilt binaries
        uses: actions/download-artifact@v8
        with:
          name: k8s-e2e-bins
          path: target/release

      - name: Make binaries executable
        run: |
          chmod +x \
            target/release/kubernetes-kms-plugin \
            target/release/ckms

      - name: Start Minikube
        uses: medyagh/setup-minikube@v0.0.18
        with:
          driver: docker
          kubernetes-version: v1.32.0

      - name: Run ${{ matrix.scenario }} E2E
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run ${{ matrix.task }}

  # ── E2E: operator + CSI provider (Docker images inside Minikube) ─────────────
  # Both components are tested exclusively via their published Nix Docker images.
  # ckms (a local binary) is used only as a test-fixture helper to pre-populate
  # the KMS; the components under test always run inside the cluster as images.
  # Smoke tests (--help via a bare Pod) are included in the same matrix.
  e2e-images:
    name: ${{ matrix.scenario }} (Minikube)
    needs: [build-k8s-bins, build-k8s-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: k8s-operator
            task: test:k8s:operator
          - scenario: k8s-csi-provider
            task: test:k8s:csi-provider
          - scenario: k8s-operator-image
            task: test:k8s:operator-image
          - scenario: k8s-csi-provider-image
            task: test:k8s:csi-provider-image

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-mise

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Download prebuilt binaries (ckms fixture helper)
        uses: actions/download-artifact@v8
        with:
          name: k8s-e2e-bins
          path: target/release

      - name: Download Docker image tarballs
        uses: actions/download-artifact@v8
        with:
          name: k8s-docker-images
          path: .

      - name: Make binaries executable
        run: chmod +x target/release/ckms

      - name: Start Minikube
        uses: medyagh/setup-minikube@v0.0.18
        with:
          driver: docker
          kubernetes-version: v1.32.0

      - name: Run ${{ matrix.scenario }} E2E
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run ${{ matrix.task }}

  # ── Build K8s plugin packages (deb + rpm via Nix) ────────────────────────────
  k8s-plugin-package:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
    name: k8s-plugin-${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/cleanup-runner

      - uses: ./.github/actions/setup-nix
        with:
          extra-nix-config: http-connections = 8

      - uses: ./.github/actions/install-mise

      - name: Set up GPG
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_SIGNING_KEY }}
          passphrase: ${{ secrets.GPG_SIGNING_KEY_PASSPHRASE }}

      - name: List keys
        run: gpg -K

      - name: Build and sign k8s plugin packages (deb + rpm)
        run: mise run package:k8s
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSPHRASE }}

      - name: Upload k8s plugin packages
        uses: actions/upload-artifact@v7
        with:
          name: k8s-plugin-packages-${{ matrix.runner }}
          path: result-k8s-plugin-*/
          retention-days: 1
          if-no-files-found: error

  # ── Publish K8s plugin packages to package.cosmian.com ───────────────────────
  publish-k8s-plugin:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'

    name: Publish k8s-plugin-${{ matrix.cpu-arch }}
    needs: k8s-plugin-package
    runs-on: [self-hosted, not-sgx]
    container:
      image: cosmian/docker_doc_ci
      volumes:
        - /home/cosmian/.ssh/id_rsa:/root/.ssh/id_rsa

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-24.04
            cpu-arch: amd64
            rpm-arch: x86_64
          - runner: ubuntu-24.04-arm
            cpu-arch: arm64
            rpm-arch: aarch64

    steps:
      - name: Checkout repository (for public key file)
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Download k8s plugin packages
        uses: actions/download-artifact@v8
        with:
          name: k8s-plugin-packages-${{ matrix.runner }}

      - name: List downloaded assets
        run: find . -type f -print

      - name: Push to package.cosmian.com
        shell: bash
        run: |
          set -ex
          if [[ "${GITHUB_REF}" =~ 'refs/tags/' ]]; then
            BRANCH="${GITHUB_REF_NAME}"
          else
            BRANCH="last_build/${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          fi
          BASE="/mnt/package/kms/${BRANCH}"

          # deb — directory and filename both use cpu-arch (amd64/arm64)
          DEB_DIR="${BASE}/deb/${{ matrix.cpu-arch }}"
          ssh -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
            cosmian@package.cosmian.com mkdir -p "${DEB_DIR}"
          scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
            ./nix/signing-keys/cosmian-kms-public.asc \
            result-k8s-plugin-deb/*.deb \
            cosmian@package.cosmian.com:"${DEB_DIR}/"

          # rpm — directory uses cpu-arch (amd64/arm64); filename uses rpm-arch (x86_64/aarch64)
          RPM_DIR="${BASE}/rpm/${{ matrix.cpu-arch }}"
          ssh -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
            cosmian@package.cosmian.com mkdir -p "${RPM_DIR}"
          scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
            ./nix/signing-keys/cosmian-kms-public.asc \
            result-k8s-plugin-rpm/*.rpm \
            cosmian@package.cosmian.com:"${RPM_DIR}/"

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            result-k8s-plugin-deb/kubernetes-kms-plugin_*
            result-k8s-plugin-rpm/kubernetes-kms-plugin_*
            ./nix/signing-keys/cosmian-kms-public.asc

  # ── Publish Helm chart to GitHub Pages ───────────────────────────────────────
  helm-chart-publish:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    name: Package and publish Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # chart-releaser needs the full tag history to detect new chart versions.
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure gh-pages branch exists
        run: |
          # chart-releaser requires origin/gh-pages to exist before it can push.
          # Create an empty orphan branch on the first run; no-op on subsequent runs.
          if ! git ls-remote --exit-code --heads origin gh-pages; then
            git checkout --orphan gh-pages
            git reset --hard
            git commit --allow-empty -m "Initialize GitHub Pages branch"
            git push origin gh-pages
            git checkout -
          fi

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # All charts live under charts/<name>/Chart.yaml.
          charts_dir: charts
          # Store packaged .tgz files in a temporary directory; they are
          # uploaded as GitHub Release assets by the action.
          packages_with_index: false
