---
name: Build all

on:
  workflow_call:
    inputs:
      suites-matrix:
        description: JSON include list of the legs to run, built by ci_changes.py from .github/ci-paths.toml
        required: true
        type: string

jobs:
  # Builds the source-built Nix inputs of shell.nix (FIPS provider + main OpenSSL, FIPS bootstrap, SoftHSM2,
  # Utimaco) once per input hash and caches their closure for every Nix job below. On a hit it is a
  # sub-minute lookup. `continue-on-error`: a cache failure only means today's from-source builds.
  nix-dev-shell-cache:
    name: Nix dev-shell cache
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Look up cached closure
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/nix-dev-shell
          key: nix-dev-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shell.nix', 'nix/openssl.nix', 'nix/openssl-fips-bootstrap.*', 'nix/softhsm2.nix',
            'nix/utimaco.nix', '.mise/lib/common.sh') }}
          lookup-only: true

      - name: Write Nix post-build hook
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          cat > /tmp/nix-post-build-hook.sh <<'EOF'
          #!/bin/sh
          printf '%s\n' $OUT_PATHS >> /tmp/nix-built-paths
          EOF
          chmod 755 /tmp/nix-post-build-hook.sh

      - name: Setup Nix
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-nix
        with:
          extra-nix-config: post-build-hook = /tmp/nix-post-build-hook.sh

      - name: Build dev shells and export locally built paths
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          PIN_URL=$(sed -n 's/^export PIN_URL="\(.*\)"$/\1/p' .mise/lib/common.sh)
          # WITH_HSM=1 realises every source-built input (openssl x3, bootstrap, softhsm per variant,
          # utimaco); the other WITH_* flags only add substitutable nixpkgs packages.
          for v in fips non-fips; do
            WITH_HSM=1 nix-shell shell.nix --argstr variant "$v" -I "nixpkgs=${PIN_URL}" --run true
          done
          # rust-overlay toolchain paths are large and re-download fast: keep them out of the cache.
          sort -u /tmp/nix-built-paths | grep -Ev '^/nix/store/[a-z0-9]{32}-(rust|rustc|cargo|clippy|rustfmt)-' > /tmp/nix-keep-paths || true
          test -s /tmp/nix-keep-paths
          mkdir -p /tmp/nix-dev-shell
          # shellcheck disable=SC2046 # store paths contain no whitespace
          nix-store --export $(nix-store -qR $(cat /tmp/nix-keep-paths)) > /tmp/nix-dev-shell/closure.nar
          du -h /tmp/nix-dev-shell/closure.nar
          # Size rule: above ~1 GB, list the biggest paths and add the non-OpenSSL/softhsm/utimaco ones to the grep -Ev above.
          # shellcheck disable=SC2046
          du -sh $(cat /tmp/nix-keep-paths) | sort -h | tail -n 15

      - name: Save closure to cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/nix-dev-shell
          key: nix-dev-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shell.nix', 'nix/openssl.nix', 'nix/openssl-fips-bootstrap.*', 'nix/softhsm2.nix',
            'nix/utimaco.nix', '.mise/lib/common.sh') }}

  # Every CI unit of .github/ci-paths.toml is a leg of this one matrix job, run by test-group.yml: ci_changes.py builds
  # the matrix and filters it by event, secrets and Dependabot, so a leg that does not run has no row at all.
  # `skip` lists `<group>:<leaf>` ids a leg must not run. `k8s` and `pkg` run in packaging-docker.yml; a leaf no group
  # lists runs locally only. The `secrets:` table scopes each secret to its legs (cloud, XKS and HSM credentials never
  # reach the JS toolchain of `ui` or the interop legs).
  test-suites:
    name: ${{ matrix.suite }}${{ matrix.variant != '' && format(' ({0})', matrix.variant) || '' }}${{ matrix.runner != 'ubuntu-24.04' && format(' [{0}]',
      matrix.runner) || '' }}
    needs:
      - nix-dev-shell-cache
    # A leg's `lock` is one concurrency group shared by all runs (real HSMs, XKS server), queued; the other legs
    # get a group of their own, so they never wait.
    concurrency:
      group: ${{ matrix.lock || format('ci-leg-{0}-{1}-{2}-{3}', github.run_id, matrix.suite, matrix.variant, matrix.runner) }}
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.suites-matrix) }}
    uses: ./.github/workflows/test-group.yml
    with:
      suite: ${{ matrix.suite }}
      variant: ${{ matrix.variant }}
      runner: ${{ matrix.runner }}
      setup: ${{ matrix.setup }}
      timeout: ${{ matrix.timeout }}
      environment: ${{ matrix.environment }}
      # real HSMs: the hsm:* legs
      skip: ${{ matrix.suite == 'hsm' && 'hsm:crypt2pay hsm:proteccio' || '' }}
      bench: ${{ matrix.bench }}
    secrets:
      DOCKERHUB_USERNAME: ${{ matrix.setup == 'nix' && !contains(fromJSON('["ui","cloud","xks-remote","hsm:crypt2pay","hsm:proteccio"]'), matrix.suite)
        && secrets.DOCKERHUB_USERNAME || '' }}
      DOCKERHUB_TOKEN: ${{ matrix.setup == 'nix' && !contains(fromJSON('["ui","cloud","xks-remote","hsm:crypt2pay","hsm:proteccio"]'), matrix.suite) &&
        secrets.DOCKERHUB_TOKEN || '' }}
      EDB_SUBSCRIPTION_TOKEN: ${{ startsWith(matrix.suite, 'interop:') && secrets.EDB_SUBSCRIPTION_TOKEN || '' }}
      IRIS_LICENSE_KEY: ${{ startsWith(matrix.suite, 'interop:') && secrets.IRIS_LICENSE_KEY || '' }}
      AUDIT_COMPAT_SPLUNK_PASSWORD: ${{ matrix.suite == 'obs' && secrets.AUDIT_COMPAT_SPLUNK_PASSWORD || '' }}
      TEST_GOOGLE_OAUTH_CLIENT_ID: ${{ matrix.suite == 'cloud' && secrets.TEST_GOOGLE_OAUTH_CLIENT_ID || '' }}
      TEST_GOOGLE_OAUTH_CLIENT_SECRET: ${{ matrix.suite == 'cloud' && secrets.TEST_GOOGLE_OAUTH_CLIENT_SECRET || '' }}
      TEST_GOOGLE_OAUTH_REFRESH_TOKEN: ${{ matrix.suite == 'cloud' && secrets.TEST_GOOGLE_OAUTH_REFRESH_TOKEN || '' }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ matrix.suite == 'cloud' && secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY || '' }}
      KMS_CI_AWS_ACCESS_KEY_ID: ${{ matrix.suite == 'cloud' && secrets.KMS_CI_AWS_ACCESS_KEY_ID || '' }}
      KMS_CI_AWS_SECRET_ACCESS_KEY: ${{ matrix.suite == 'cloud' && secrets.KMS_CI_AWS_SECRET_ACCESS_KEY || '' }}
      KMS_CI_AWS_REGION: ${{ matrix.suite == 'cloud' && secrets.KMS_CI_AWS_REGION || '' }}
      KMS_CI_AZURE_TENANT_ID: ${{ matrix.suite == 'cloud' && secrets.KMS_CI_AZURE_TENANT_ID || '' }}
      KMS_CI_AZURE_CLIENT_ID: ${{ matrix.suite == 'cloud' && secrets.KMS_CI_AZURE_CLIENT_ID || '' }}
      KMS_CI_AZURE_CLIENT_SECRET: ${{ matrix.suite == 'cloud' && secrets.KMS_CI_AZURE_CLIENT_SECRET || '' }}
      KMS_CI_AZURE_KV_NAME: ${{ matrix.suite == 'cloud' && secrets.KMS_CI_AZURE_KV_NAME || '' }}
      PROTECCIO_IP: ${{ contains(fromJSON('["hsm:crypt2pay","hsm:proteccio"]'), matrix.suite) && secrets.PROTECCIO_IP || '' }}
      PROTECCIO_PASSWORD: ${{ contains(fromJSON('["hsm:crypt2pay","hsm:proteccio"]'), matrix.suite) && secrets.PROTECCIO_PASSWORD || '' }}
      PROTECCIO_SLOT: ${{ contains(fromJSON('["hsm:crypt2pay","hsm:proteccio"]'), matrix.suite) && secrets.PROTECCIO_SLOT || '' }}
      CRYPT2PAY_PASSWORD: ${{ contains(fromJSON('["hsm:crypt2pay","hsm:proteccio"]'), matrix.suite) && secrets.CRYPT2PAY_PASSWORD || '' }}
      OVPN_CONF: ${{ contains(fromJSON('["hsm:crypt2pay","hsm:proteccio"]'), matrix.suite) && secrets.OVPN_CONF || '' }}
      KMS_XKS_SSH_PRIVATE_KEY: ${{ matrix.suite == 'xks-remote' && secrets.KMS_XKS_SSH_PRIVATE_KEY || '' }}
      KMS_XKS_SSH_KNOWN_HOSTS: ${{ matrix.suite == 'xks-remote' && secrets.KMS_XKS_SSH_KNOWN_HOSTS || '' }}
      KMS_XKS_SSH_USER: ${{ matrix.suite == 'xks-remote' && secrets.KMS_XKS_SSH_USER || '' }}
      KMS_XKS_SIGV4_ACCESS_KEY_ID: ${{ matrix.suite == 'xks-remote' && secrets.KMS_XKS_SIGV4_ACCESS_KEY_ID || '' }}
      KMS_XKS_SIGV4_SECRET_ACCESS_KEY: ${{ matrix.suite == 'xks-remote' && secrets.KMS_XKS_SIGV4_SECRET_ACCESS_KEY || '' }}
      AWS_XKS_ACCESS_KEY_ID: ${{ matrix.suite == 'xks-remote' && secrets.AWS_XKS_ACCESS_KEY_ID || '' }}
      AWS_XKS_SECRET_ACCESS_KEY: ${{ matrix.suite == 'xks-remote' && secrets.AWS_XKS_SECRET_ACCESS_KEY || '' }}
      AWS_XKS_KEY_ARN: ${{ matrix.suite == 'xks-remote' && secrets.AWS_XKS_KEY_ARN || '' }}
      PAT_TOKEN: ${{ matrix.suite == 'build-documentation' && github.event_name == 'pull_request' && secrets.PAT_TOKEN || '' }}

  # Real publish, tags only (cargo-publish-dry-run is a leg of `test-suites`).
  cargo-publish:
    needs:
      - test-suites
    # A skipped dependency (no legs) must not skip it, but any failed or cancelled dependency blocks it.
    if: >-
      startsWith(github.ref, 'refs/tags/') && !failure() && !cancelled()
    uses: ./.github/workflows/cargo-publish.yml
