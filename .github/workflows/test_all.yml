---
name: Build all

on:
  workflow_call:
    inputs:
      suites-matrix:
        description: JSON include list [{suite, variant, bench}] of the test-suites legs to run (ci_changes.py from the ci-paths.toml `variants`)
        required: true
        type: string

jobs:
  # Caches the Nix dev-shell closure for every Nix job below.
  nix-dev-shell-cache:
    uses: ./.github/workflows/nix-dev-shell-cache.yml

  # One job per group of .mise/tasks/test (`mise run test:<group>`, i.e. its `_default`), each cell run by
  # test-group.yml. `k8s` and `pkg` run in packaging-docker.yml; a leaf no group lists runs locally only.
  # `cloud` and `ui` have their own workflows (test-cloud.yml, test-ui.yml: their secrets are isolated); every other
  # suite is a leg of `test-suites`, whose matrix ci_changes.py builds from the running units.
  #
  # Suites that need at most the Docker Hub login and their own product secrets (never cloud credentials), one leg per
  # (suite, variant). The per-leg `secrets:` expressions hand EDB/IRIS only to interop legs and Splunk only to obs.
  test-suites:
    name: Test ${{ matrix.suite }} (${{ matrix.variant }})
    needs:
      - nix-dev-shell-cache
    if: inputs.suites-matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.suites-matrix) }}
    uses: ./.github/workflows/test-group.yml
    with:
      suite: ${{ matrix.suite }}
      variant: ${{ matrix.variant }}
      # real HSMs: test-hsm-hardware
      skip: ${{ matrix.suite == 'hsm' && 'hsm:crypt2pay hsm:proteccio' || '' }}
      bench: ${{ matrix.bench }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      EDB_SUBSCRIPTION_TOKEN: ${{ startsWith(matrix.suite, 'interop:') && secrets.EDB_SUBSCRIPTION_TOKEN || '' }}
      IRIS_LICENSE_KEY: ${{ startsWith(matrix.suite, 'interop:') && secrets.IRIS_LICENSE_KEY || '' }}
      AUDIT_COMPAT_SPLUNK_PASSWORD: ${{ matrix.suite == 'obs' && secrets.AUDIT_COMPAT_SPLUNK_PASSWORD || '' }}
