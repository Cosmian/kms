---
name: Build all

on:
  workflow_call:
  workflow_dispatch:

jobs:
  # Builds the source-built Nix inputs of shell.nix (OpenSSL 3.1.2 / 3.6.5, FIPS bootstrap, SoftHSM2,
  # Utimaco) once per input hash and caches their closure for every Nix job below. On a hit it is a
  # sub-minute lookup. `continue-on-error`: a cache failure only means today's from-source builds.
  nix-dev-shell-cache:
    name: Nix dev-shell cache
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Look up cached closure
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/nix-dev-shell
          key: nix-dev-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shell.nix', 'nix/openssl.nix', 'nix/openssl-fips-bootstrap.*', 'nix/softhsm2.nix',
            'nix/utimaco.nix', '.mise/lib/common.sh') }}
          lookup-only: true

      - name: Write Nix post-build hook
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          cat > /tmp/nix-post-build-hook.sh <<'EOF'
          #!/bin/sh
          printf '%s\n' $OUT_PATHS >> /tmp/nix-built-paths
          EOF
          chmod 755 /tmp/nix-post-build-hook.sh

      - name: Setup Nix
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-nix
        with:
          extra-nix-config: post-build-hook = /tmp/nix-post-build-hook.sh

      - name: Build dev shells and export locally built paths
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          PIN_URL=$(sed -n 's/^export PIN_URL="\(.*\)"$/\1/p' .mise/lib/common.sh)
          # WITH_HSM=1 realises every source-built input (openssl x3, bootstrap, softhsm per variant,
          # utimaco); the other WITH_* flags only add substitutable nixpkgs packages.
          for v in fips non-fips; do
            WITH_HSM=1 nix-shell shell.nix --argstr variant "$v" -I "nixpkgs=${PIN_URL}" --run true
          done
          # rust-overlay toolchain paths are large and re-download fast: keep them out of the cache.
          sort -u /tmp/nix-built-paths | grep -Ev '^/nix/store/[a-z0-9]{32}-(rust|rustc|cargo|clippy|rustfmt)-' > /tmp/nix-keep-paths || true
          test -s /tmp/nix-keep-paths
          mkdir -p /tmp/nix-dev-shell
          # shellcheck disable=SC2046 # store paths contain no whitespace
          nix-store --export $(nix-store -qR $(cat /tmp/nix-keep-paths)) > /tmp/nix-dev-shell/closure.nar
          du -h /tmp/nix-dev-shell/closure.nar
          # Size rule: above ~1 GB, list the biggest paths and add the non-OpenSSL/softhsm/utimaco ones to the grep -Ev above.
          # shellcheck disable=SC2046
          du -sh $(cat /tmp/nix-keep-paths) | sort -h | tail -n 15

      - name: Save closure to cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/nix-dev-shell
          key: nix-dev-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shell.nix', 'nix/openssl.nix', 'nix/openssl-fips-bootstrap.*', 'nix/softhsm2.nix',
            'nix/utimaco.nix', '.mise/lib/common.sh') }}

  # One job per group of .mise/tasks/test (`mise run test:<group>`, i.e. its `_default`), each cell run by
  # test-group.yml. `skip` lists `<group>:<leaf>` ids a job must not run. `k8s` and `pkg` run in
  # packaging-docker.yml; a leaf no group lists runs locally only.
  # Upstream only (not on forks or fork pull requests): the Google, AWS and Azure secrets are withheld there.
  test-cloud:
    name: Test cloud (${{ matrix.variant }})
    needs:
      - nix-dev-shell-cache
    if: >-
      github.repository == 'Cosmian/kms' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        variant: [fips, non-fips]
    uses: ./.github/workflows/test-group.yml
    with:
      suite: cloud
      variant: ${{ matrix.variant }}
    secrets:
      TEST_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_ID }}
      TEST_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_SECRET }}
      TEST_GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.TEST_GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
      KMS_CI_AWS_ACCESS_KEY_ID: ${{ secrets.KMS_CI_AWS_ACCESS_KEY_ID }}
      KMS_CI_AWS_SECRET_ACCESS_KEY: ${{ secrets.KMS_CI_AWS_SECRET_ACCESS_KEY }}
      KMS_CI_AWS_REGION: ${{ secrets.KMS_CI_AWS_REGION }}
      KMS_CI_AZURE_TENANT_ID: ${{ secrets.KMS_CI_AZURE_TENANT_ID }}
      KMS_CI_AZURE_CLIENT_ID: ${{ secrets.KMS_CI_AZURE_CLIENT_ID }}
      KMS_CI_AZURE_CLIENT_SECRET: ${{ secrets.KMS_CI_AZURE_CLIENT_SECRET }}
      KMS_CI_AZURE_KV_NAME: ${{ secrets.KMS_CI_AZURE_KV_NAME }}

  test-db:
    name: Test db
    needs:
      - nix-dev-shell-cache
    uses: ./.github/workflows/test-db.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  test-hsm:
    name: Test hsm (${{ matrix.variant }})
    needs:
      - nix-dev-shell-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: fips, bench: softhsm2 utimaco crypt2pay-simulator}
          - {variant: non-fips, bench: softhsm2 utimaco crypt2pay-simulator kryoptic}
    uses: ./.github/workflows/test-group.yml
    with:
      suite: hsm
      variant: ${{ matrix.variant }}
      # real HSMs: test-hsm-hardware
      skip: hsm:crypt2pay hsm:proteccio
      bench: ${{ matrix.bench }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  test-interop:
    name: Test interop
    needs:
      - nix-dev-shell-cache
    uses: ./.github/workflows/test-interop.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      EDB_SUBSCRIPTION_TOKEN: ${{ secrets.EDB_SUBSCRIPTION_TOKEN }}
      IRIS_LICENSE_KEY: ${{ secrets.IRIS_LICENSE_KEY }}

  test-obs:
    name: Test obs (${{ matrix.variant }})
    needs:
      - nix-dev-shell-cache
    strategy:
      fail-fast: false
      matrix:
        variant: [fips, non-fips]
    uses: ./.github/workflows/test-group.yml
    with:
      suite: obs
      variant: ${{ matrix.variant }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      AUDIT_COMPAT_SPLUNK_PASSWORD: ${{ secrets.AUDIT_COMPAT_SPLUNK_PASSWORD }}

  # Every pkcs11 leaf is non-FIPS only.
  test-pkcs11:
    name: Test pkcs11 (${{ matrix.variant }})
    needs:
      - nix-dev-shell-cache
    strategy:
      fail-fast: false
      matrix:
        variant: [non-fips]
    uses: ./.github/workflows/test-group.yml
    with:
      suite: pkcs11
      variant: ${{ matrix.variant }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  test-pki:
    name: Test pki (${{ matrix.variant }})
    needs:
      - nix-dev-shell-cache
    strategy:
      fail-fast: false
      matrix:
        variant: [fips, non-fips]
    uses: ./.github/workflows/test-group.yml
    with:
      suite: pki
      variant: ${{ matrix.variant }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Only spire pulls images among the JS-toolchain groups, so it alone gets the Docker Hub login.
  test-spire:
    name: Test spire (${{ matrix.variant }})
    needs:
      - nix-dev-shell-cache
    strategy:
      fail-fast: false
      matrix:
        variant: [non-fips]
    uses: ./.github/workflows/test-group.yml
    with:
      suite: spire
      variant: ${{ matrix.variant }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Runs pnpm install and the JS toolchain (vite, vitest, playwright): any npm dependency can read the
  # job's environment, so it gets no cloud/test secrets.
  test-ui:
    name: Test ui (${{ matrix.variant }})
    needs:
      - nix-dev-shell-cache
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [fips, non-fips]
    uses: ./.github/workflows/test-group.yml
    with:
      suite: ui
      variant: ${{ matrix.variant }}

  # The real hardware HSMs, reached over the network or OpenVPN. Never on pull requests: nightly, tag and
  # dispatch runs only; pull requests cover the HSM code with the software simulators of `test-hsm`. Upstream
  # repository only, where the secrets exist. The HSMs refuse concurrent connections from several CI runs:
  # each cell's `lock` is one concurrency group shared by all runs, queued (test-k8s-hsm in packaging-docker.yml
  # uses the same groups). A task fails, never skips, when an `env:` need is unset: a green cell proves its
  # suite ran.
  # Not in CI: aws-cloudhsm, azure-cloud-hsm and gcp-cloud-hsm (clusters torn down to limit cloud costs) and
  # Luna (no reachable partition). To bring one back, add its cell to `test-hsm-hardware` with its `suite`
  # and its `lock`, make its task fail loudly on a missing secret when `CI=true` (upstream `env:` gate), and
  # pass its secrets through test-group.yml (names in crate/hsm/<name>/README.md).
  test-hsm-hardware:
    name: Test ${{ matrix.suite }} (${{ matrix.variant }})
    needs:
      - nix-dev-shell-cache
    if: github.repository == 'Cosmian/kms' && github.event_name != 'pull_request'
    concurrency:
      group: ${{ matrix.lock }}
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: hsm:crypt2pay, variant: non-fips, lock: hsm-crypt2pay}
          - {suite: hsm:proteccio, variant: non-fips, lock: hsm-proteccio}
    uses: ./.github/workflows/test-group.yml
    with:
      suite: ${{ matrix.suite }}
      variant: ${{ matrix.variant }}
    secrets:
      PROTECCIO_IP: ${{ secrets.PROTECCIO_IP }}
      PROTECCIO_PASSWORD: ${{ secrets.PROTECCIO_PASSWORD }}
      PROTECCIO_SLOT: ${{ secrets.PROTECCIO_SLOT }}
      CRYPT2PAY_PASSWORD: ${{ secrets.CRYPT2PAY_PASSWORD }}
      OVPN_CONF: ${{ secrets.OVPN_CONF }}

  xks-remote:
    name: AWS XKS — remote server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: xks-remote
      cancel-in-progress: false
    permissions:
      contents: read
    environment: xks-remote-approval
    # Upstream only: needs the XKS test server and its secrets, which forks do not have.
    if: >-
      github.repository == 'Cosmian/kms' &&
      github.event_name != 'schedule' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-rust

      - uses: ./.github/actions/cache-openssl-buildrs
        with:
          variant: non-fips

      - uses: ./.github/actions/setup-nix-mise
        with:
          cleanup-runner: 'true'

      - name: Build KMS binary (non-fips, release)
        run: cargo build --bin cosmian_kms --features non-fips --release

      - name: Deploy binary to XKS test server
        env:
          KMS_XKS_SSH_PRIVATE_KEY: ${{ secrets.KMS_XKS_SSH_PRIVATE_KEY }}
          KMS_XKS_SSH_KNOWN_HOSTS: ${{ secrets.KMS_XKS_SSH_KNOWN_HOSTS }}
          KMS_XKS_SSH_USER: ${{ secrets.KMS_XKS_SSH_USER }}
          KMS_BIN: target/release/cosmian_kms
        run: bash .mise/scripts/test/deploy_xks_remote.sh

      - name: Run XKS tests against remote server
        env:
          KMS_XKS_HOST: aws-xks-kms.cosmian.dev
          KMS_XKS_URI_PREFIX: aws
          KMS_XKS_REGION: eu-west-1
          KMS_XKS_SIGV4_ACCESS_KEY_ID: ${{ secrets.KMS_XKS_SIGV4_ACCESS_KEY_ID }}
          KMS_XKS_SIGV4_SECRET_ACCESS_KEY: ${{ secrets.KMS_XKS_SIGV4_SECRET_ACCESS_KEY }}
        run: |
          bash .mise/scripts/test/test_xks_remote.sh

      - name: Run AWS KMS XKS end-to-end test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_XKS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_XKS_SECRET_ACCESS_KEY }}
          AWS_XKS_KEY_ARN: ${{ secrets.AWS_XKS_KEY_ARN }}
        run: bash .mise/scripts/test/test_xks_aws_e2e.sh

  # PKI group (EST / SCEP third-party clients, OCSP, revocation) on macOS; Linux runs it in `test-pki`.
  # Inline, not test-group.yml: macOS has no Nix.
  interop-macos:
    name: Test pki (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-rust

      - uses: ./.github/actions/cache-openssl-buildrs
        with:
          variant: fips

      - uses: ./.github/actions/install-mise

      # estclient / scepclient are Go programs built by the interop scripts
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .mise/scripts/kmip-go/go.mod

      - name: Test
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUITE: pki
          VARIANT: fips
        run: |
          st=0
          mise run "test:${SUITE}" --variant "$VARIANT" || st=$?
          if [ "$st" -eq 77 ]; then echo "::warning::test:${SUITE} skipped (see its SKIP line)"; st=0; fi
          exit "$st"

  # cargo publish is placed in test_all.yml to ensure the publication of crates is possible (no git deps, etc.).
  # cargo-publish.yml does a dry run off-tag and a real publish on tags, so it is called twice:
  # the (long) dry run starts immediately, the real publish only once every test job passed.
  cargo-publish-dry-run:
    if: >-
      !startsWith(github.ref, 'refs/tags/') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/cargo-publish.yml
    secrets:
      token: ${{ secrets.CRATES_IO }}

  cargo-publish:
    needs:
      - test-cloud
      - test-db
      - test-hsm
      - test-hsm-hardware
      - test-interop
      - test-obs
      - test-pkcs11
      - test-pki
      - test-spire
      - test-ui
    # Real publish, tags only: a skipped dependency (upstream-only jobs on forks) must not skip
    # it, but any failed or cancelled dependency blocks it.
    if: >-
      startsWith(github.ref, 'refs/tags/') && !failure() && !cancelled()
    uses: ./.github/workflows/cargo-publish.yml
    secrets:
      token: ${{ secrets.CRATES_IO }}
