---
name: Build all

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string
  workflow_dispatch:

jobs:
  # Builds the source-built Nix inputs of shell.nix (OpenSSL 3.1.2 / 3.6.5, FIPS bootstrap, SoftHSM2,
  # Utimaco) once per input hash and caches their closure for every Nix job below. On a hit it is a
  # sub-minute lookup. `continue-on-error`: a cache failure only means today's from-source builds.
  nix-dev-shell-cache:
    name: Nix dev-shell cache
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Look up cached closure
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/nix-dev-shell
          key: nix-dev-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shell.nix', 'nix/openssl.nix', 'nix/openssl-fips-bootstrap.*', 'nix/softhsm2.nix',
            'nix/utimaco.nix', '.mise/lib/common.sh') }}
          lookup-only: true

      - name: Write Nix post-build hook
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          cat > /tmp/nix-post-build-hook.sh <<'EOF'
          #!/bin/sh
          printf '%s\n' $OUT_PATHS >> /tmp/nix-built-paths
          EOF
          chmod 755 /tmp/nix-post-build-hook.sh

      - name: Setup Nix
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-nix
        with:
          extra-nix-config: post-build-hook = /tmp/nix-post-build-hook.sh

      - name: Build dev shells and export locally built paths
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          PIN_URL=$(sed -n 's/^export PIN_URL="\(.*\)"$/\1/p' .mise/lib/common.sh)
          # WITH_HSM=1 realises every source-built input (openssl x3, bootstrap, softhsm per variant,
          # utimaco); the other WITH_* flags only add substitutable nixpkgs packages.
          for v in fips non-fips; do
            WITH_HSM=1 nix-shell shell.nix --argstr variant "$v" -I "nixpkgs=${PIN_URL}" --run true
          done
          # rust-overlay toolchain paths are large and re-download fast: keep them out of the cache.
          sort -u /tmp/nix-built-paths | grep -Ev '^/nix/store/[a-z0-9]{32}-(rust|rustc|cargo|clippy|rustfmt)-' > /tmp/nix-keep-paths || true
          test -s /tmp/nix-keep-paths
          mkdir -p /tmp/nix-dev-shell
          # shellcheck disable=SC2046 # store paths contain no whitespace
          nix-store --export $(nix-store -qR $(cat /tmp/nix-keep-paths)) > /tmp/nix-dev-shell/closure.nar
          du -h /tmp/nix-dev-shell/closure.nar
          # Size rule: above ~1 GB, list the biggest paths and add the non-OpenSSL/softhsm/utimaco ones to the grep -Ev above.
          # shellcheck disable=SC2046
          du -sh $(cat /tmp/nix-keep-paths) | sort -h | tail -n 15

      - name: Save closure to cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/nix-dev-shell
          key: nix-dev-shell-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('shell.nix', 'nix/openssl.nix', 'nix/openssl-fips-bootstrap.*', 'nix/softhsm2.nix',
            'nix/utimaco.nix', '.mise/lib/common.sh') }}

  test-nix:
    name: Test on ${{ matrix.type }} - ${{ matrix.features }}
    runs-on: ubuntu-24.04
    needs: nix-dev-shell-cache
    env:
      # The `secrets` context is unavailable in step-level `if:`; expose via env instead.
      # Empty on fork pull requests (secrets withheld) -> login is skipped, pulls stay anonymous.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        type:
          - sqlite
          - mysql
          - percona
          - mariadb
          - psql
          - redis
          - gcp-cmek
          - veracrypt
          - jose
          - db2
          - ase
          - audit
        features: [fips, non-fips]
        exclude:
          # redis is exclusively for non-fips
          - type: redis
            features: fips
          # veracrypt disk-encryption PKCS#11 tests force non-fips
          - type: veracrypt
            features: fips
          # jose (REST crypto + jwcrypto interop) runs only with non-fips
          - type: jose
            features: fips
          # db2 requires non-fips (PKCS#12 + full TLS stack for mTLS)
          - type: db2
            features: fips
          # ase (PKCS#11) forces non-fips like the other PKCS#11 test types
          - type: ase
            features: fips
          # PR CI: fips legs of the MySQL-protocol backends run nightly only (sqlite + psql keep fips on PRs).
          - type: ${{ github.event_name == 'pull_request' && 'mysql' || 'nightly-only' }}
            features: fips
          - type: ${{ github.event_name == 'pull_request' && 'percona' || 'nightly-only' }}
            features: fips
          - type: ${{ github.event_name == 'pull_request' && 'mariadb' || 'nightly-only' }}
            features: fips
          # google-cse, secret_vault, secret_aws and secret_azure need upstream-only secrets:
          # they run in the `test-nix-upstream` job, which is skipped on forks.
        include:
          # Docker services required per test type (types without an entry need no containers)
          - type: psql
            docker: postgres
          - type: mysql
            docker: mysql
          - type: percona
            docker: percona
          - type: mariadb
            docker: mariadb
          - type: redis
            docker: redis
          # audit test has no external Docker dependencies from the matrix: the task starts its
          # own `postgres-audit` container (docker-compose.yml) for the PostgreSQL backend tests.
          #
          # Grouped legs: one build per leg, then several suites whose own test time is < 2 min
          # (non-Nix and Nix suites are kept apart: switching OPENSSL_DIR recompiles the workspace).
          # The azure-cloud-hsm loader compilation does not require a live HSM. siem-filebeat
          # needs Elasticsearch; the other siem sub-tests use `docker run` internally. monitoring
          # picks free ports, so it coexists with the compose otel-collector. Fips legs omit the
          # suites that are non-fips only (cef, siem, monitoring: format-agnostic / Docker-heavy).
          - type: blackbox
            features: fips
            suites: ocsp pki-revocation scep-interop est-interop otel secret_cosmian_kms azure-cloud-hsm-build
            docker: otel-collector jaeger
          - type: blackbox
            features: non-fips
            suites: ocsp pki-revocation scep-interop est-interop otel secret_cosmian_kms cef siem monitoring azure-cloud-hsm-build
            docker: otel-collector jaeger elasticsearch
          # xks needs curl SigV4 + non-fips flags; azure-ekm, pykmip and iris need non-fips
          # (PKCS#12 + full TLS stack); kmip-go also runs with fips.
          - type: blackbox-nix
            features: fips
            suites: kmip-go
          - type: blackbox-nix
            features: non-fips
            suites: kmip-go xks azure-ekm pykmip iris
          # PKCS#11 clients (OpenSSH, LUKS, GnuPG) force non-fips (EdDSA / full algorithm set).
          - type: pkcs11-nix
            features: non-fips
            suites: openssh luks gnupg

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: ./.github/actions/cache-openssl-buildrs
        with:
          variant: ${{ matrix.features }}

      - uses: ./.github/actions/setup-nix-mise
        with:
          cleanup-runner: 'true'
          dev-shell-cache: 'true'

      - name: Docker login (Docker Hub)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run docker containers
        if: matrix.docker
        run: |
          docker compose up -d ${{ matrix.docker }}

      - name: Test
        env:
          POSTGRES_USER: kms
          PGUSER: kms
          POSTGRES_PASSWORD: kms
          POSTGRES_DB: kms
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          KMS_POSTGRES_URL: postgresql://kms:kms@127.0.0.1:5432/kms

          MYSQL_DATABASE: kms
          MYSQL_ROOT_PASSWORD: kms
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          KMS_MYSQL_URL: mysql://root:kms@localhost:3306/kms

          PERCONA_HOST: localhost
          PERCONA_PORT: 3307
          KMS_PERCONA_URL: mysql://root:kms@localhost:3307/kms

          MARIADB_HOST: localhost
          MARIADB_PORT: 3308
          KMS_MARIADB_URL: mysql://root:kms@localhost:3308/kms

          KMS_SQLITE_PATH: data/shared

          REDIS_HOST: localhost
          REDIS_PORT: 6379
          KMS_REDIS_URL: redis://localhost:6379

          # Google variables
          TEST_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_ID }}
          TEST_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_SECRET }}
          TEST_GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.TEST_GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}

          # EDB Postgres Advanced Server TDE variables.
          # When EDB_SUBSCRIPTION_TOKEN is set the test suite starts the real
          # EDB Postgres 17 container (edb-tde service in docker-compose.yml)
          # and runs a live end-to-end TDE scenario.  Without it the Docker
          # test is skipped and only the PyKMIP/Thales KMIP simulations run.
          # Register for a free token: https://www.enterprisedb.com/accounts/register
          EDB_SUBSCRIPTION_TOKEN: ${{ secrets.EDB_SUBSCRIPTION_TOKEN }}

          # InterSystems IRIS mTLS integration test
          IRIS_LICENSE_KEY: ${{ secrets.IRIS_LICENSE_KEY }}

          # AWS secret backend variables (secret_aws test type)
          AWS_ACCESS_KEY_ID: ${{ secrets.KMS_CI_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.KMS_CI_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.KMS_CI_AWS_REGION }}

          # Azure Key Vault secret backend variables (secret_azure test type)
          AZURE_TENANT_ID: ${{ secrets.KMS_CI_AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.KMS_CI_AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.KMS_CI_AZURE_CLIENT_SECRET }}
          AZURE_KV_NAME: ${{ secrets.KMS_CI_AZURE_KV_NAME }}

          # Splunk audit JSONL compatibility test password
          SPLUNK_PASSWORD: ${{ secrets.AUDIT_COMPAT_SPLUNK_PASSWORD }}
          # Provide an authenticated token so mise can install tools from
          # GitHub releases without hitting the unauthenticated rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        uses: ./.github/actions/run-mise-suites
        with:
          suites: ${{ matrix.suites || matrix.type }}
          variant: ${{ matrix.features }}

      # PKCS#11 support report: exhaustive ckms pkcs11 capabilities smoke test
      # (442 mechanisms / 92 functions against a live sqlite KMS server). Runs
      # once (non-fips only, since cosmian_pkcs11 needs --features non-fips),
      # piggybacking on the `ase` matrix combination to avoid a separate,
      # colon-containing matrix value (which the yamlfmt pre-commit hook mangles).
      - name: 'Test (PKCS#11 support report: ckms pkcs11 capabilities)'
        if: matrix.type == 'ase' && matrix.features == 'non-fips'
        run: |
          mise run test:pkcs11:support --variant non-fips

  # Test types that run pnpm install and the JS toolchain (vite, vitest, playwright):
  # any npm dependency can read this job's environment, so it gets no cloud/test secrets.
  test-nix-js:
    name: Test on ${{ matrix.type }} - ${{ matrix.features }}
    runs-on: ubuntu-24.04
    needs: nix-dev-shell-cache
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        type:
          - wasm
          - ui
          - spire
        features: [fips, non-fips]
        exclude:
          # spire relies on the Vault API which is non-fips only
          - type: spire
            features: fips
        include:
          # ui runs only the standard Playwright suite; auth/OIDC/SAML run in their own leg.
          - type: ui
            args: --standard-only
          - type: ui-sso
            features: non-fips
            suites: ui-auth ui-oidc ui-saml

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-mise
        with:
          cleanup-runner: 'true'
          dev-shell-cache: 'true'

      # Only spire pulls images; the stored credential is then readable by later steps.
      - name: Docker login (Docker Hub)
        if: ${{ matrix.type == 'spire' && env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Test
        env:
          # Read-only (contents: read); lets mise install tools without hitting the rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        uses: ./.github/actions/run-mise-suites
        with:
          suites: ${{ matrix.suites || matrix.type }}
          variant: ${{ matrix.features }}
          args: ${{ matrix.args }}

  # Test types that depend on upstream-only secrets / external services. Kept out of
  # `test-nix` because a job-level `if` cannot read the `matrix` context: the whole
  # job is skipped on forks, where those secrets do not exist.
  test-nix-upstream:
    name: Test on ${{ matrix.type }} - ${{ matrix.features }}
    runs-on: ubuntu-24.04
    needs: nix-dev-shell-cache
    if: >-
      github.repository == 'Cosmian/kms' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        type:
          - google-cse
        features: [fips, non-fips]
        include:
          # Grouped leg: one runner for the secret backends (non-fips only, they need external services).
          - type: secrets
            features: non-fips
            suites: secret_vault secret_aws secret_azure

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: ./.github/actions/cache-openssl-buildrs
        with:
          variant: ${{ matrix.features }}

      - uses: ./.github/actions/setup-nix-mise
        with:
          cleanup-runner: 'true'
          dev-shell-cache: 'true'

      - name: Test
        env:
          # Google variables (google-cse test type)
          TEST_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_ID }}
          TEST_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.TEST_GOOGLE_OAUTH_CLIENT_SECRET }}
          TEST_GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.TEST_GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}

          # AWS secret backend variables (secret_aws test type)
          AWS_ACCESS_KEY_ID: ${{ secrets.KMS_CI_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.KMS_CI_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.KMS_CI_AWS_REGION }}

          # Azure Key Vault secret backend variables (secret_azure test type)
          AZURE_TENANT_ID: ${{ secrets.KMS_CI_AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.KMS_CI_AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.KMS_CI_AZURE_CLIENT_SECRET }}
          AZURE_KV_NAME: ${{ secrets.KMS_CI_AZURE_KV_NAME }}

          # Provide an authenticated token so mise can install tools from
          # GitHub releases without hitting the unauthenticated rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        uses: ./.github/actions/run-mise-suites
        with:
          suites: ${{ matrix.suites || matrix.type }}
          variant: ${{ matrix.features }}

  hsm:
    name: HSM ${{ matrix.hsm-type }} - ${{ matrix.features }}
    runs-on: ubuntu-24.04
    needs: nix-dev-shell-cache
    # Software/simulated HSMs run locally on each runner, so fips and non-fips legs run in parallel.
    # Hardware HSMs (proteccio, crypt2pay, azure-cloud-hsm, aws-cloudhsm, gcp-cloud-hsm) run in the `hsm-upstream` job.
    strategy:
      fail-fast: false
      matrix:
        hsm-type:
          - utimaco
          - crypt2pay-simulator
          - softhsm2
          - kryoptic
        features: [fips, non-fips]
        exclude:
          # Kryoptic HSM backend always built in non-fips
          - hsm-type: kryoptic
            features: fips

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: ./.github/actions/cache-openssl-buildrs
        with:
          variant: ${{ matrix.features }}
      - uses: ./.github/actions/setup-nix-mise
        with:
          cleanup-runner: 'true'
          dev-shell-cache: 'true'
      - name: Test
        run: |
          mise run test:hsm-${{ matrix.hsm-type }} --variant ${{ matrix.features }}

      - name: Bench (PKCS#11 load, HSM-delegated)
        if: github.event_name != 'pull_request'
        run: |
          mise run bench:pkcs11 --delegated --hsm-model ${{ matrix.hsm-type }} --variant ${{ matrix.features }} -s

      - name: Bench (HSM-delegated)
        if: github.event_name != 'pull_request'
        run: |
          mise run bench:hsm --delegated --hsm-model ${{ matrix.hsm-type }} --variant ${{ matrix.features }} -s

      # The comprehensive provider suite and pkcs11-check require non-FIPS.
      - name: Test (PKCS#11 v3 conformance via pkcs11-tool and pkcs11-check)
        if: matrix.features == 'non-fips'
        run: |
          mise run test:hsm-pkcs11-tool --variant non-fips --marker smoke

  # Hardware HSMs reachable only with upstream-only secrets and infrastructure (Proteccio
  # network HSM, Crypt2Pay over OpenVPN, the Azure Cloud HSM CI cluster). They live in their
  # own job (a job-level `if` cannot read the `matrix` context) and are skipped on forks.
  hsm-upstream:
    name: HSM ${{ matrix.hsm-type }} - ${{ matrix.features }}
    runs-on: ubuntu-24.04
    needs: nix-dev-shell-cache
    if: >-
      github.repository == 'Cosmian/kms' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # This hardware does not support concurrent connections from multiple CI runs: a fixed
    # group per HSM so only one job runs at a time across all PRs.
    concurrency:
      group: ${{ format('hsm-{0}', matrix.hsm-type) }}
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        hsm-type:
          - proteccio
          - crypt2pay
          # aws-cloudhsm, gcp-cloud-hsm and azure-cloud-hsm clusters are torn down after
          # validation to limit cloud costs; re-enable once a cluster is provisioned again.
          # - aws-cloudhsm
          # - gcp-cloud-hsm
          # - azure-cloud-hsm
          # Thales Luna: no network HSM partition or proprietary Luna Client is reachable from
          # CI; validated manually against a Luna appliance (`mise run test:hsm-luna`).
          # Re-enable once a CI partition and LUNA_* secrets are provisioned.
          # - luna
        # non-fips only: parallel connections on proteccio are not supported, non-fips is
        # sufficient for crypt2pay, and aws-cloudhsm/azure-cloud-hsm/gcp-cloud-hsm FIPS-mode compatibility
        # is not yet confirmed against the clusters' supported mechanism lists.
        features: [non-fips]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-nix-mise
        with:
          cleanup-runner: 'true'
          dev-shell-cache: 'true'

      - name: Install OpenVPN
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openvpn

      - name: Test
        env:
          # Proteccio
          PROTECCIO_IP: ${{ secrets.PROTECCIO_IP }}
          PROTECCIO_PASSWORD: ${{ secrets.PROTECCIO_PASSWORD }}
          PROTECCIO_SLOT: ${{ secrets.PROTECCIO_SLOT }}
          # Crypt2Pay (reached through OpenVPN)
          CRYPT2PAY_PASSWORD: ${{ secrets.CRYPT2PAY_PASSWORD }}
          OVPN_CONF: ${{ secrets.OVPN_CONF }}
          # AWS CloudHSM: persistent CI cluster (see crate/hsm/aws_cloudhsm/README.md)
          AWS_CLOUDHSM_CLUSTER_ID: ${{ secrets.KMS_CI_AWS_CLOUDHSM_CLUSTER_ID }}
          AWS_CLOUDHSM_CU_USERNAME: ${{ secrets.KMS_CI_AWS_CLOUDHSM_CU_USERNAME }}
          AWS_CLOUDHSM_CU_PASSWORD: ${{ secrets.KMS_CI_AWS_CLOUDHSM_CU_PASSWORD }}
          AWS_CLOUDHSM_SLOT_ID: ${{ secrets.KMS_CI_AWS_CLOUDHSM_SLOT_ID }}
          AWS_CLOUDHSM_CA_CERT: ${{ secrets.KMS_CI_AWS_CLOUDHSM_CA_CERT }}
          AWS_CLOUDHSM_HSM_IPS: ${{ secrets.KMS_CI_AWS_CLOUDHSM_HSM_IPS }}
          # AWS Client VPN profile (.ovpn, cert-based mutual auth): GitHub-hosted
          # runners have no route to the HSM's private VPC IP; prepare_aws_cloudhsm.sh
          # starts this tunnel only if the HSM is not already directly reachable.
          AWS_CLOUDHSM_OVPN_CONF: ${{ secrets.KMS_CI_AWS_CLOUDHSM_OVPN_CONF }}
          # Reused generic AWS credentials (read-only `cloudhsm:DescribeClusters` is enough)
          AWS_ACCESS_KEY_ID: ${{ secrets.KMS_CI_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.KMS_CI_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.KMS_CI_AWS_REGION }}
          # Azure Cloud HSM: prepare_azure_cloudhsm.sh installs the client SDK and
          # starts azcloudhsm_client (see crate/hsm/azure_cloud_hsm/README.md).
          AZURE_CLOUD_HSM_PO_CERT: ${{ secrets.KMS_CI_AZURE_CLOUD_HSM_PO_CERT }}
          AZURE_CLOUD_HSM_HOSTNAME: ${{ secrets.KMS_CI_AZURE_CLOUD_HSM_HOSTNAME }}
          # GitHub-hosted runners cannot resolve *.privatelink.cloudhsm.azure.net or
          # route to the HSM's private VNet IP; prepare_azure_cloudhsm.sh maps the
          # hostname and starts a VPN tunnel only if the HSM is not already reachable.
          AZURE_CLOUD_HSM_HSM_IP: ${{ secrets.KMS_CI_AZURE_CLOUD_HSM_HSM_IP }}
          # Space-separated private IPs of every cluster node (not just the primary
          # above): azcloudhsm_client dials siblings directly by IP once logged in,
          # bypassing azcloudhsm_resource.cfg/hostname mapping, so the VPN route must
          # reach all of them or key generation fails quorum ("Required number of
          # servers(3) not available"). Optional: skipped (return 0) if unset.
          AZURE_CLOUD_HSM_HSM_IPS: ${{ secrets.KMS_CI_AZURE_CLOUD_HSM_HSM_IPS }}
          AZURE_CLOUD_HSM_OVPN_CONF: ${{ secrets.KMS_CI_AZURE_CLOUD_HSM_OVPN_CONF }}
          AZURE_CLOUD_HSM_USER_PASSWORD: ${{ secrets.KMS_CI_AZURE_CLOUD_HSM_USER_PASSWORD }}
          AZURE_CLOUD_HSM_SLOT_ID: ${{ secrets.KMS_CI_AZURE_CLOUD_HSM_SLOT_ID }}
        run: |
          mise run test:hsm-${{ matrix.hsm-type }} --variant ${{ matrix.features }}

  helm:
    name: Helm chart E2E (minikube)
    runs-on: ubuntu-24.04
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-mise

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Start Minikube
        uses: medyagh/setup-minikube@e9e035a86bbc3caea26a450bd4dbf9d0c453682e # v0.0.21
        with:
          driver: docker
          kubernetes-version: v1.30.0
          cpus: 2
          memory: 4096m

      - name: Test (lint + template + E2E deployment)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise run test:helm --e2e

  xks-remote:
    name: AWS XKS — remote server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: xks-remote
      cancel-in-progress: false
    permissions:
      contents: read
    environment: xks-remote-approval
    # Upstream only: needs the XKS test server and its secrets, which forks do not have.
    if: >-
      github.repository == 'Cosmian/kms' &&
      github.event_name != 'schedule' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-nix-mise
        with:
          cleanup-runner: 'true'

      - name: Build KMS binary (non-fips, release)
        run: cargo build --bin cosmian_kms --features non-fips --release

      - name: Deploy binary to XKS test server
        env:
          KMS_XKS_SSH_PRIVATE_KEY: ${{ secrets.KMS_XKS_SSH_PRIVATE_KEY }}
          KMS_XKS_SSH_KNOWN_HOSTS: ${{ secrets.KMS_XKS_SSH_KNOWN_HOSTS }}
          KMS_XKS_SSH_USER: ${{ secrets.KMS_XKS_SSH_USER }}
          KMS_BIN: target/release/cosmian_kms
        run: bash .mise/scripts/test/deploy_xks_remote.sh

      - name: Run XKS tests against remote server
        env:
          KMS_XKS_HOST: aws-xks-kms.cosmian.dev
          KMS_XKS_URI_PREFIX: aws
          KMS_XKS_REGION: eu-west-1
          KMS_XKS_SIGV4_ACCESS_KEY_ID: ${{ secrets.KMS_XKS_SIGV4_ACCESS_KEY_ID }}
          KMS_XKS_SIGV4_SECRET_ACCESS_KEY: ${{ secrets.KMS_XKS_SIGV4_SECRET_ACCESS_KEY }}
        run: |
          bash .mise/scripts/test/test_xks_remote.sh

      - name: Run AWS KMS XKS end-to-end test
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_XKS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_XKS_SECRET_ACCESS_KEY }}
          AWS_XKS_KEY_ARN: ${{ secrets.AWS_XKS_KEY_ARN }}
        run: bash .mise/scripts/test/test_xks_aws_e2e.sh

  # EST / SCEP interoperability against third-party clients (micromdm scepclient, globalsign
  # estclient) on macOS; Linux runs them in the `test-nix` matrix.
  interop-macos:
    name: Interop (macOS) - scep + est
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ inputs.toolchain || '1.99.1' }}
          components: rustfmt, clippy

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: ./.github/actions/cache-openssl-buildrs
        with:
          variant: fips

      - uses: ./.github/actions/install-mise

      # estclient / scepclient are Go programs built by the interop scripts
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .mise/scripts/kmip-go/go.mod

      - name: Interop test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: ./.github/actions/run-mise-suites
        with:
          suites: scep-interop est-interop
          variant: fips

  windows-2022:
    # Windows is slow: PRs run the quick suite; tags and nightly run the full one.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/test_windows.yml
    with:
      toolchain: ${{ inputs.toolchain }}
      archive-name: windows
      # test_kms_server and ckms lib tests are covered on Linux; the full suite runs off-PR only.
      full-suite: ${{ github.event_name != 'pull_request' }}

  # cargo publish is placed in test_all.yml to ensure the publication of crates is possible (no git deps, etc.).
  # cargo-publish.yml does a dry run off-tag and a real publish on tags, so it is called twice:
  # the (long) dry run starts immediately, the real publish only once every test job passed.
  cargo-publish-dry-run:
    if: >-
      !startsWith(github.ref, 'refs/tags/') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/cargo-publish.yml
    with:
      toolchain: 1.99.1
    secrets:
      token: ${{ secrets.CRATES_IO }}

  cargo-publish:
    needs:
      - test-nix
      - test-nix-js
      - test-nix-upstream
      - hsm
      - hsm-upstream
      - helm
    # Real publish, tags only: a skipped dependency (upstream-only jobs on forks) must not skip
    # it, but any failed or cancelled dependency blocks it.
    if: >-
      startsWith(github.ref, 'refs/tags/') && !failure() && !cancelled()
    uses: ./.github/workflows/cargo-publish.yml
    with:
      toolchain: 1.99.1
    secrets:
      token: ${{ secrets.CRATES_IO }}
