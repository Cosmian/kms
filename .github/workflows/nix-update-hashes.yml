---
# Local reusable workflow — Update Nix vendor hashes.
#
# Runs on a Linux + macOS matrix, recomputes all Nix vendor hash files via
# `mise run release:nix-update-hashes` (credential-free builders), publishes the result to `ref` through commit-generated.yml, and
# optionally dispatches packaging.yml on the same ref once both platform jobs
# have completed.
#
# Hash files split by platform (the two sets are disjoint so both runners can
# commit concurrently without conflicts):
#   Linux  : server.vendor.{static,dynamic}.sha256
#             cargo.vendor.linux.sha256 (CLI + k8s plugin/operator/csi-provider)
#             ui.vendor.{fips,non-fips}.sha256
#             ui.pnpm.linux.sha256
#   macOS  : cli.vendor.{static,dynamic}.darwin.sha256
#             ui.pnpm.darwin.sha256
#
# Callers / triggers
# ──────────────────
# workflow_dispatch — manual invocation on a branch; trigger_packaging=true by
#                     default so packaging follows automatically.
# release.yml       — Job 2: trigger_packaging=false (package-and-commit-sbom.yml
#                     owns packaging: it dispatches, waits and commits SBOMs).
# nightly.yml       — trigger_packaging=false, for the same reason.
# (packaging.yml does NOT call this workflow; it is a pure build workflow.)

name: Update Nix vendor hashes

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >
          Branch to update (leave empty to use the dispatched branch).
        required: false
        type: string
        default: ''
      new_version:
        description: >
          Optional version string appended to the commit message (e.g. "5.20.0").
        required: false
        type: string
        default: ''
      trigger_packaging:
        description: >
          Dispatch packaging.yml on `ref` after all hashes are committed.
        required: false
        type: boolean
        default: true

  workflow_call:
    inputs:
      ref:
        description: >
          Git ref (branch name) to check out and push updated hashes to.
          For release.yml this is the release branch (e.g. release/5.20.0).
        required: true
        type: string
      new_version:
        description: >
          Optional version string appended to the commit message (e.g. "5.20.0").
        required: false
        type: string
        default: ''
      trigger_packaging:
        description: >
          Dispatch packaging.yml on `ref` after all hashes are committed.
          Set to false when the caller manages its own packaging dispatch
          (e.g. release.yml).
        required: false
        type: boolean
        default: false
    secrets:
      PAT_TOKEN:
        description: >
          Personal Access Token with `repo` + `workflow` scopes.
          Required so that the push and any subsequent workflow dispatch
          re-trigger other workflows (GITHUB_TOKEN cannot do this).
        required: true

jobs:
  # Read-only: pins the branch tip once so both platform builders and both publishers work on the
  # same commit, and expands the exact hash files a patch may touch.
  resolve-ref:
    name: Resolve ${{ inputs.ref || github.ref_name }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      hash_paths: ${{ steps.pin.outputs.hash_paths }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # workflow_dispatch: fall back to the dispatched branch when no
          # explicit ref is given.
          ref: ${{ inputs.ref || github.ref_name }}
          submodules: false
          persist-credentials: false

      - name: Pin commit and list tracked hash files
        id: pin
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo 'hash_paths<<EOF'
            git ls-files -- 'nix/expected-hashes/*.sha256'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  # Builders: execute dependency build code (nix builds) and hold NO credential.
  generate-nix-hashes:
    name: Recompute Nix vendor hashes (${{ matrix.runner }})
    needs: resolve-ref
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-mise
        with:
          extra-nix-config: http-connections = 8

      - uses: ./.github/actions/install-rust

      - name: Probe that dependency code receives no release credential
        run: python3 .mise/scripts/dev/test_release_security.py --probe "$GITHUB_WORKSPACE"

      - name: Recompute all Nix vendor hashes
        run: mise run release:nix-update-hashes

      - name: Capture the hash changes as a patch
        env:
          BASE_SHA: ${{ needs.resolve-ref.outputs.sha }}
          OUT_DIR: ${{ runner.temp }}/nix-hashes
          PATHS: ${{ needs.resolve-ref.outputs.hash_paths }}
        run: bash .mise/scripts/release/make_generated_patch.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nix-hashes-${{ matrix.runner }}
          path: ${{ runner.temp }}/nix-hashes
          retention-days: 1
          if-no-files-found: error

  # Publishers (Git only, no build): one platform at a time. The two file sets are disjoint and each
  # commit is rebased onto the branch tip, so order does not matter.
  commit-nix-hashes:
    name: Commit Nix vendor hashes (${{ matrix.runner }})
    needs: [resolve-ref, generate-nix-hashes]
    strategy:
      max-parallel: 1
      matrix:
        runner: [ubuntu-24.04, macos-15]
    permissions:
      contents: read
    uses: ./.github/workflows/commit-generated.yml
    with:
      ref: ${{ inputs.ref || github.ref_name }}
      base-sha: ${{ needs.resolve-ref.outputs.sha }}
      artifact: nix-hashes-${{ matrix.runner }}
      paths: ${{ needs.resolve-ref.outputs.hash_paths }}
      # [skip ci] prevents push-triggered workflows (e.g. nightly.yml)
      # from re-running on this automated commit and creating a loop.
      message: >-
        build: update Nix vendor hashes (${{ startsWith(matrix.runner, 'macos') && 'macOS' || 'Linux' }})${{
        inputs.new_version != '' && format(' for {0}', inputs.new_version) || '' }} [skip ci]
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Optional follow-up: dispatch packaging.yml on the same ref once BOTH
  # platform hash commits have been published.
  #
  # This keeps packaging.yml a pure build workflow (no commits, no hash logic).
  # The release workflow sets trigger_packaging=false and manages its own
  # packaging dispatch with richer polling and SBOM retrieval.
  # ─────────────────────────────────────────────────────────────────────────────
  trigger-packaging:
    name: Dispatch packaging.yml
    needs: commit-nix-hashes
    if: inputs.trigger_packaging
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Dispatch packaging.yml on ${{ inputs.ref || github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REF: ${{ inputs.ref || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "Dispatching packaging.yml on ref '$REF'…"
          gh workflow run packaging.yml --repo "$REPOSITORY" --ref "$REF"
