---
name: Release

# Fully automated release workflow.
#
# What it does:
#   1. Validates semver inputs and that the release tag does not exist yet.
#   2. Runs the version-bump script (.mise/scripts/release/release.sh) in a
#      credential-free builder job (prepare-build) that uploads a data patch.
#   3. commit-generated.yml, the only job with PAT_TOKEN, applies that patch
#      (exact file list) and creates "release/<new_version>" from develop
#      (matching the git-flow model), or rebases onto the existing branch.
#   4. The bumped versions are pushed on the release branch.
#   5. Runs `nix_build_update_hash.sh` on BOTH Linux and macOS runners in
#      parallel to recompute all Nix vendor hashes (Linux writes server +
#      linux-cli + UI wasm hashes; macOS writes darwin-cli + UI pnpm hashes)
#      and commits the results.
#   6. update-generated-docs.yml (after the Nix hashes) regenerates the docs,
#      KMIP tables, CBOM, log index and sbom/licenses.txt and commits them.
#   7. package-and-commit-sbom.yml dispatches packaging.yml on the release
#      branch and polls until it completes (the packaging CI publishes SBOMs
#      to package.cosmian.com at last_build/release/<new_version>).
#   8. That same workflow retrieves the SBOMs from package.cosmian.com and
#      commits them.
#   9. Git-flow finalization (mirrors `git flow release finish`):
#        a. Merges release/<new_version> into main (--no-ff).
#        b. Creates the annotated tag X.Y.Z on main's merge commit.
#           (conventional git-flow always tags the main merge commit, not the
#            release branch — this also triggers packaging.yml on:push:tags which
#            builds the final packages and creates the GitHub Release)
#        c. Merges release/<new_version> into develop (syncs version bump back).
#        d. Deletes the release branch.
#
# Prerequisites (repository secrets):
#   PAT_TOKEN — Personal Access Token with `repo` + `workflow` scopes.
#               Required so that commits and tag pushes made by this workflow
#               re-trigger other workflows (GITHUB_TOKEN pushes do not). Only
#               Git-only jobs (commit-generated.yml, sync-branches) receive it.
#
# Retry / recovery:
#   Re-dispatching with the same inputs is safe as long as the tag has NOT
#   been pushed yet:
#   - `prepare-build` hard-stops if the tag already exists (tags are permanent and
#     will NEVER be deleted by this workflow).
#   - `prepare` never deletes or force-pushes: it rebases the bump onto an
#     existing release branch (an identical bump is dropped as already applied)
#     and fails when the branch holds conflicting work.
#   - If the tag was already pushed (sync-branches got past the tagging step
#     but then failed), re-dispatch is still safe: sync-branches is fully
#     idempotent and skips steps that already succeeded (checks Cargo.toml
#     version on main/develop and tag existence before acting).
#
# Inputs:
#   old_version — current version in Cargo.toml (e.g. 5.19.0)
#   new_version — version to release (e.g. 5.20.0)

on:
  workflow_dispatch:
    inputs:
      old_version:
        description: Current version in Cargo.toml
        required: true
        type: string
      new_version:
        description: New version to release
        required: true
        type: string

# Only one release can run at a time.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 — Validate inputs and bump versions. A builder: it holds NO credential
  # (checkout without token/persisted auth, read-only token) and only uploads a
  # data patch; the next job is the only one that can write to Git.
  # ─────────────────────────────────────────────────────────────────────────────
  prepare-build:
    name: Validate inputs & bump versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}

    steps:
      - name: Validate semver format
        env:
          OLD_VERSION: ${{ inputs.old_version }}
          NEW_VERSION: ${{ inputs.new_version }}
        run: |
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+$'
          if ! [[ "$OLD_VERSION" =~ $semver_re ]]; then
            echo "ERROR: old_version '$OLD_VERSION' is not valid semver X.Y.Z" >&2
            exit 1
          fi
          if ! [[ "$NEW_VERSION" =~ $semver_re ]]; then
            echo "ERROR: new_version '$NEW_VERSION' is not valid semver X.Y.Z" >&2
            exit 1
          fi
          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "ERROR: old_version and new_version are identical" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Capture base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate old_version matches Cargo.toml
        env:
          OLD_VERSION: ${{ inputs.old_version }}
          NEW_VERSION: ${{ inputs.new_version }}
        run: |
          actual=$(grep -A 20 '^\[workspace\.package\]' Cargo.toml \
            | grep '^version' | head -1 \
            | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          if [ "$actual" = "$OLD_VERSION" ]; then
            echo "develop is at $actual — OK."
          elif [ "$actual" = "$NEW_VERSION" ]; then
            echo "NOTE: develop is already at $NEW_VERSION." \
                 "A previous run already merged the version bump into develop." \
                 "The version-bump step will be a no-op; continuing."
          else
            echo "ERROR: old_version '$OLD_VERSION' does not match" \
                 "workspace Cargo.toml version '$actual'" >&2
            exit 1
          fi

      # Hard-stop if the tag already exists: a tag on main is the proof that at
      # least the merge + tagging step already succeeded. The workflow NEVER
      # deletes tags. If sync-branches failed AFTER tagging, re-run the workflow:
      # its idempotency guards skip the steps that already happened.
      - name: Refuse an already released version
        env:
          TAG: ${{ inputs.new_version }}
        run: |
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag '$TAG' already exists on origin." >&2
            echo "       The release tag is permanent and will never be deleted" \
                 "by this workflow." >&2
            exit 1
          fi

      - uses: ./.github/actions/install-rust

      - uses: ./.github/actions/install-mise

      - name: Probe that dependency code receives no release credential
        run: python3 .mise/scripts/dev/test_release_security.py --probe "$GITHUB_WORKSPACE"

      - name: Run version-bump script
        env:
          OLD_VERSION: ${{ inputs.old_version }}
          NEW_VERSION: ${{ inputs.new_version }}
        run: |
          # release.sh performs sed-based substitutions across all Cargo.toml
          # and other versioned files.  The --ci flag skips the pre-commit
          # hooks section (nix-build-all, cbom, release-docker-build-ui) since
          # those are handled by dedicated jobs in this workflow.
          mise run release:bump --ci "$OLD_VERSION" "$NEW_VERSION"

      # Refreshes the workspace entries of Cargo.lock only: no compilation, so no
      # dependency build script or proc macro runs in this job.
      - name: Update Cargo.lock
        run: cargo update --workspace

      - name: Capture the version bump as a patch
        env:
          OLD_VERSION: ${{ inputs.old_version }}
          NEW_VERSION: ${{ inputs.new_version }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          OUT_DIR: ${{ runner.temp }}/release-bump
          PATHS: |
            .github/copilot-instructions.md
            .mise/scripts/windows/windows_ui.ps1
            Cargo.lock
            Cargo.toml
            README.md
            charts/cosmian-kms/Chart.yaml
            crate/access/Cargo.toml
            crate/clients/ckms/Cargo.toml
            crate/clients/clap/Cargo.toml
            crate/clients/client/Cargo.toml
            crate/clients/client_utils/Cargo.toml
            crate/clients/cng/Cargo.toml
            crate/clients/k8s/csi_provider/Cargo.toml
            crate/clients/pkcs11/module/Cargo.toml
            crate/clients/pkcs11/provider/Cargo.toml
            crate/clients/wasm/Cargo.toml
            crate/crypto/Cargo.toml
            crate/hsm/aws_cloudhsm/Cargo.toml
            crate/hsm/base_hsm/Cargo.toml
            crate/hsm/crypt2pay/Cargo.toml
            crate/hsm/kryoptic/Cargo.toml
            crate/hsm/proteccio/Cargo.toml
            crate/hsm/smartcardhsm/Cargo.toml
            crate/hsm/softhsm2/Cargo.toml
            crate/hsm/utimaco/Cargo.toml
            crate/interfaces/Cargo.toml
            crate/kmip/Cargo.toml
            crate/server/Cargo.toml
            crate/server_database/Cargo.toml
            crate/test_kms_server/Cargo.toml
            documentation/docs/certifications_and_compliance/fips.md
            documentation/docs/configuration/monitoring-setup.md
            documentation/docs/index.md
            documentation/docs/installation/installation_getting_started.md
            documentation/docs/installation/marketplace_guide.md
            documentation/docs/integrations/cloud_providers/microsoft/windows_cng_ksp.md
            documentation/docs/integrations/databases/demo_tde/setup_oracle_tde.sh
            documentation/docs/integrations/databases/oracle_tde.md
            documentation/docs/kms_clients/index.md
            documentation/docs/kms_clients/installation.md
            nix/README.md
            nix/docker.nix
            nix/kms-server.nix
            nix/signing-keys/README.md
            nix/ui.nix
            ui/package.json
        run: |
          set -euo pipefail
          if git diff --quiet HEAD; then
            # No diff: either old_version is wrong, or develop was already at
            # new_version (previous run merged it back). Distinguish the two.
            CURRENT=$(grep -A 20 '^\[workspace\.package\]' Cargo.toml \
              | grep '^version' | head -1 \
              | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
            if [ "$CURRENT" != "$NEW_VERSION" ]; then
              echo "ERROR: Nothing changed after version bump. Check that" \
                   "old_version='$OLD_VERSION' is correct." >&2
              exit 1
            fi
            echo "NOTE: version already at $NEW_VERSION — version bump was a no-op."
          fi
          bash .mise/scripts/release/make_generated_patch.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-bump
          path: ${{ runner.temp }}/release-bump
          retention-days: 1
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1b — Commit the version bump to release/<new_version> (Git only).
  # Creates the branch from the base commit when it does not exist; an existing
  # branch is rebased onto, never deleted or force-pushed.
  # ─────────────────────────────────────────────────────────────────────────────
  prepare:
    name: Commit release branch
    needs: prepare-build
    permissions:
      contents: read
    uses: ./.github/workflows/commit-generated.yml
    with:
      ref: release/${{ inputs.new_version }}
      base-sha: ${{ needs.prepare-build.outputs.base_sha }}
      artifact: release-bump
      message: 'build: release ${{ inputs.new_version }}'
      paths: |
        .github/copilot-instructions.md
        .mise/scripts/windows/windows_ui.ps1
        Cargo.lock
        Cargo.toml
        README.md
        charts/cosmian-kms/Chart.yaml
        crate/access/Cargo.toml
        crate/clients/ckms/Cargo.toml
        crate/clients/clap/Cargo.toml
        crate/clients/client/Cargo.toml
        crate/clients/client_utils/Cargo.toml
        crate/clients/cng/Cargo.toml
        crate/clients/k8s/csi_provider/Cargo.toml
        crate/clients/pkcs11/module/Cargo.toml
        crate/clients/pkcs11/provider/Cargo.toml
        crate/clients/wasm/Cargo.toml
        crate/crypto/Cargo.toml
        crate/hsm/aws_cloudhsm/Cargo.toml
        crate/hsm/base_hsm/Cargo.toml
        crate/hsm/crypt2pay/Cargo.toml
        crate/hsm/kryoptic/Cargo.toml
        crate/hsm/proteccio/Cargo.toml
        crate/hsm/smartcardhsm/Cargo.toml
        crate/hsm/softhsm2/Cargo.toml
        crate/hsm/utimaco/Cargo.toml
        crate/interfaces/Cargo.toml
        crate/kmip/Cargo.toml
        crate/server/Cargo.toml
        crate/server_database/Cargo.toml
        crate/test_kms_server/Cargo.toml
        documentation/docs/certifications_and_compliance/fips.md
        documentation/docs/configuration/monitoring-setup.md
        documentation/docs/index.md
        documentation/docs/installation/installation_getting_started.md
        documentation/docs/installation/marketplace_guide.md
        documentation/docs/integrations/cloud_providers/microsoft/windows_cng_ksp.md
        documentation/docs/integrations/databases/demo_tde/setup_oracle_tde.sh
        documentation/docs/integrations/databases/oracle_tde.md
        documentation/docs/kms_clients/index.md
        documentation/docs/kms_clients/installation.md
        nix/README.md
        nix/docker.nix
        nix/kms-server.nix
        nix/signing-keys/README.md
        nix/ui.nix
        ui/package.json
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2 — Recompute Nix vendor hashes (matrix: Linux + macOS)
  #
  # Delegated to the local reusable workflow nix-update-hashes.yml.
  # See that file for the full hash-file split by platform and idempotency notes.
  # ─────────────────────────────────────────────────────────────────────────────
  update-nix-hashes:
    name: Update Nix vendor hashes
    needs: prepare
    uses: ./.github/workflows/nix-update-hashes.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      new_version: ${{ inputs.new_version }}
      # package-and-commit-sbom.yml dispatches packaging itself (with polling +
      # SBOM retrieval), so the reusable workflow must NOT dispatch it again.
      trigger_packaging: false
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2b — Regenerate docs, CBOM, licenses and log index.
  #
  # Delegated to the local reusable workflow update-generated-docs.yml.
  # Sequenced after update-nix-hashes so the two do not push to the release
  # branch concurrently (both still rebase before pushing, but this avoids the
  # race in the common case).
  # ─────────────────────────────────────────────────────────────────────────────
  update-generated-docs:
    name: Update generated docs
    needs: [prepare, update-nix-hashes]
    uses: ./.github/workflows/update-generated-docs.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      new_version: ${{ inputs.new_version }}
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3 — Dispatch packaging CI, wait for it, retrieve and commit SBOMs.
  #
  # Delegated to the local reusable workflow package-and-commit-sbom.yml.
  # The SBOMs are published at:
  #   package.cosmian.com/kms/last_build/release/<new_version>/sbom/
  # ─────────────────────────────────────────────────────────────────────────────
  package-and-commit-sbom:
    name: Package & commit SBOM
    needs: [prepare, update-nix-hashes, update-generated-docs]
    uses: ./.github/workflows/package-and-commit-sbom.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      new_version: ${{ inputs.new_version }}
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5 — Git-flow finalization: merge into main, tag, merge into develop
  #
  # Conventional git-flow: `git flow release finish X.Y.Z`
  #   1. Merge release/<version> into main  (--no-ff)
  #   2. Create the annotated tag on the resulting main merge commit
  #      (git-flow always tags main, never the release branch)
  #      The tag push triggers packaging.yml (on:push:tags) which builds the
  #      final packages and creates the GitHub Release.
  #   3. Merge release/<version> into develop  (--no-ff, syncs version bump)
  #   4. Delete the release branch
  # ─────────────────────────────────────────────────────────────────────────────
  sync-branches:
    name: git-flow release finish ${{ inputs.new_version }}
    needs: [prepare, package-and-commit-sbom]
    runs-on: ubuntu-24.04
    # Git only: no build, no dependency code. PAT_TOKEN reaches each network command
    # through the environment of that command (see git-auth.sh), never the checkout config.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Configure git identity and authenticated-git helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # PAT_TOKEN is (re)supplied by the steps that need the network, so pushes re-trigger CI.
          cat > "${RUNNER_TEMP}/git-auth.sh" <<'EOS'
          git_auth() {
            local encoded
            encoded="$(printf 'x-access-token:%s' "${PAT_TOKEN:?}" | base64 | tr -d '\n')"
            echo "::add-mask::${encoded}"
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${encoded}" GIT_TERMINAL_PROMPT=0 git "$@"
          }
          EOS

      - name: Merge release branch into main
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.ref }}
          TAG: ${{ inputs.new_version }}
        run: |
          source "${RUNNER_TEMP}/git-auth.sh"

          git_auth fetch origin main "$RELEASE_BRANCH"
          git reset --hard origin/main

          # Idempotency: skip if main already carries the new version.
          # (Happens when retrying after this step succeeded but a later step
          # failed in a previous run.)
          MAIN_VERSION=$(git show origin/main:Cargo.toml \
            | grep -A 20 '^\[workspace\.package\]' | grep '^version' | head -1 \
            | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          if [ "$MAIN_VERSION" = "$TAG" ]; then
            echo "main is already at $TAG — merge already done in a previous run, skipping."
          else
            # --no-ff creates an explicit merge commit on main for visibility.
            git merge --no-ff "origin/$RELEASE_BRANCH" \
              -m "build: merge $RELEASE_BRANCH into main"
            git_auth push origin main
            echo "Merged '$RELEASE_BRANCH' into 'main'."
          fi

      - name: Create and push annotated tag on main
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          TAG: ${{ inputs.new_version }}
        run: |
          source "${RUNNER_TEMP}/git-auth.sh"

          # Idempotency: skip if the tag was already pushed.
          # (Happens when retrying after the tag was pushed but a later step
          # failed in a previous run.)
          if git_auth ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "Tag '$TAG' already exists — skipping."
          else
            # Ensure we are on the latest main HEAD before tagging.
            git_auth fetch origin main
            git reset --hard origin/main
            git tag -a "$TAG" -m "Release $TAG"
            git_auth push origin "$TAG"
            echo "Tag '$TAG' pushed on main."
            echo "packaging.yml (on:push:tags) will now build and publish the release."
          fi

      - name: Merge release branch into develop
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.ref }}
          TAG: ${{ inputs.new_version }}
        run: |
          source "${RUNNER_TEMP}/git-auth.sh"

          git_auth fetch origin develop "$RELEASE_BRANCH"
          git checkout develop
          git reset --hard origin/develop

          # Idempotency: skip if develop already carries the new version.
          # (Happens when retrying after this step succeeded but branch
          # deletion failed in a previous run.)
          DEVELOP_VERSION=$(git show origin/develop:Cargo.toml \
            | grep -A 20 '^\[workspace\.package\]' | grep '^version' | head -1 \
            | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          if [ "$DEVELOP_VERSION" = "$TAG" ]; then
            echo "develop is already at $TAG — merge already done in a previous run, skipping."
          else
            # develop may not contain the helper yet; use the release branch copy.
            # The script is Git-only (merge/diff/restore/commit): it runs no build.
            git show "origin/$RELEASE_BRANCH:.mise/scripts/release/merge_into_develop.sh" \
              | bash -s -- "origin/$RELEASE_BRANCH"
            git_auth push origin develop
            echo "Merged '$RELEASE_BRANCH' into 'develop'."
          fi

      - name: Delete finished release branch
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.ref }}
        run: |
          source "${RUNNER_TEMP}/git-auth.sh"
          # Idempotency: skip if already deleted (previous run deleted it but
          # then failed in the workflow summary step, for example).
          if git_auth ls-remote --exit-code --heads origin "$RELEASE_BRANCH" >/dev/null 2>&1; then
            git_auth push origin --delete "$RELEASE_BRANCH"
            echo "Deleted remote branch '$RELEASE_BRANCH'."
          else
            echo "Branch '$RELEASE_BRANCH' already deleted — nothing to do."
          fi

      - name: Workflow summary
        env:
          NEW_VERSION: ${{ inputs.new_version }}
          OLD_VERSION: ${{ inputs.old_version }}
          PKG_RUN_ID: ${{ needs.package-and-commit-sbom.outputs.packaging_run_id }}
        run: |
          printf '## Release %s — all automated steps complete\n\n' "$NEW_VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf '| Step | Details |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '|------|---------|\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| Branch | `release/%s` from `develop`, merged into `main` & `develop`, deleted |\n' "$NEW_VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf '| Version bump | `%s` → `%s` |\n' "$OLD_VERSION" "$NEW_VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf '| Nix hashes | Updated and committed |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| Generated docs | docs, CBOM, licenses, log index regenerated and committed |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| Packaging CI | Run [#%s](https://github.com/Cosmian/kms/actions/runs/%s) ✅ |\n' \
            "$PKG_RUN_ID" "$PKG_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          printf '| SBOMs | Retrieved and committed |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| Tag | `%s` on `main` merge commit |\n\n' "$NEW_VERSION" >> "$GITHUB_STEP_SUMMARY"
          printf 'The `packaging.yml` on-tag pipeline is building the final packages and GitHub Release.\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '### Remaining manual step\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Once the tag pipeline completes, update the GitHub Release notes at:\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'https://github.com/Cosmian/kms/releases/tag/%s\n' "$NEW_VERSION" >> "$GITHUB_STEP_SUMMARY"
