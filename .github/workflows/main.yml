---
name: CI (tags, nightly, manual)
run-name: CI (${{ github.head_ref || github.ref_name }})

# Tags, the nightly schedule and manual dispatch: every unit runs. Pull requests run pull-request.yml and the
# unit workflows' own `pull_request: paths:` triggers instead.
on:
  push:
    tags:
      - '**'
  workflow_dispatch:
  schedule:
    - cron: 0 3 * * * # Daily at 03:00 UTC

# Every run (tag, schedule, manual) gets a unique group, so it is never queued behind or cancelled by another run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # Every suite leg of test_all.yml (`--all`: no git diff, nothing skipped).
  matrix:
    name: Build test matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      suites-matrix: ${{ steps.classify.outputs.suites-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-mise

      - name: Build the full matrix
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run dev:ci-changes --all

  cargo-clippy:
    uses: ./.github/workflows/clippy.yml

  cargo-deny:
    uses: Cosmian/reusable_workflows/.github/workflows/cargo-audit.yml@9079c7a06025e1373a9be950fd94a36464ded0b9 # develop
    name: Security Audit

  cargo-machete:
    uses: ./.github/workflows/machete.yml

  supply-chain:
    uses: ./.github/workflows/supply-chain.yml

  forward-proxy:
    uses: ./.github/workflows/forward_proxy.yml

  no-nix:
    uses: ./.github/workflows/no-nix.yml

  # Windows is slow: PRs run the quick suite of windows-cargo-test; tags and nightly run the full one.
  windows-cargo-test:
    uses: ./.github/workflows/windows-cargo-test.yml
    with:
      archive-name: windows
      full-suite: true

  windows-ui:
    uses: ./.github/workflows/windows-ui.yml
    with:
      archive-name: windows

  windows-cng-ksp:
    uses: ./.github/workflows/windows-cng-ksp.yml
    with:
      archive-name: windows

  windows-hsm-idemia:
    uses: ./.github/workflows/windows-hsm-idemia.yml
    with:
      archive-name: windows

  windows-est:
    uses: ./.github/workflows/windows-est.yml
    with:
      archive-name: windows

  build-documentation:
    uses: ./.github/workflows/build-documentation.yml
    secrets: inherit

  # Cloud credentials stay out of test_all.yml; see test-cloud.yml. Upstream only.
  test-cloud:
    uses: ./.github/workflows/test-cloud.yml
    secrets: inherit

  # Runs pnpm install and the JS toolchain: any npm dependency can read the job's environment, so test-ui.yml gets
  # no cloud/test secrets.
  test-ui:
    uses: ./.github/workflows/test-ui.yml
    secrets: inherit

  # PKI group on macOS; Linux runs it in the `pki` legs of test_all.yml.
  test-pki-macos:
    uses: ./.github/workflows/test-pki-macos.yml

  xks-remote:
    uses: ./.github/workflows/xks-remote.yml
    secrets: inherit

  test: # Suite legs (db, interop, hsm, obs, pkcs11, pki, spire)
    needs: matrix
    uses: ./.github/workflows/test_all.yml
    secrets: inherit
    with:
      suites-matrix: ${{ needs.matrix.outputs.suites-matrix }}

  nix-dev-shell-cache:
    uses: ./.github/workflows/nix-dev-shell-cache.yml

  # The real hardware HSMs, reached over the network or OpenVPN. Never on pull requests: nightly, tag and
  # dispatch runs only; pull requests cover the HSM code with the software simulators of the `hsm` legs of `test-suites`. Upstream
  # repository only, where the secrets exist. The HSMs refuse concurrent connections from several CI runs:
  # each cell's `lock` is one concurrency group shared by all runs, queued (test-k8s-hsm in packaging-docker.yml
  # uses the same groups). A task fails, never skips, when an `env:` need is unset: a green cell proves its
  # suite ran.
  # Not in CI: aws-cloudhsm, azure-cloud-hsm and gcp-cloud-hsm (clusters torn down to limit cloud costs) and
  # Luna (no reachable partition). To bring one back, add its cell to `test-hsm-hardware` with its `suite`
  # and its `lock`, make its task fail loudly on a missing secret when `CI=true` (upstream `env:` gate), and
  # pass its secrets through test-group.yml (names in crate/hsm/<name>/README.md).
  test-hsm-hardware:
    name: Test ${{ matrix.suite }} (${{ matrix.variant }})
    needs:
      - nix-dev-shell-cache
    if: github.repository == 'Cosmian/kms'
    concurrency:
      group: ${{ matrix.lock }}
      queue: max
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: hsm:crypt2pay, variant: non-fips, lock: hsm-crypt2pay}
          - {suite: hsm:proteccio, variant: non-fips, lock: hsm-proteccio}
    uses: ./.github/workflows/test-group.yml
    with:
      suite: ${{ matrix.suite }}
      variant: ${{ matrix.variant }}
    secrets:
      PROTECCIO_IP: ${{ secrets.PROTECCIO_IP }}
      PROTECCIO_PASSWORD: ${{ secrets.PROTECCIO_PASSWORD }}
      PROTECCIO_SLOT: ${{ secrets.PROTECCIO_SLOT }}
      CRYPT2PAY_PASSWORD: ${{ secrets.CRYPT2PAY_PASSWORD }}
      OVPN_CONF: ${{ secrets.OVPN_CONF }}

  # cargo publish is a main.yml job so that crates are known to be publishable (no git deps, etc.).
  # cargo-publish.yml does a dry run off-tag and a real publish on tags, so it is called twice:
  # the (long) dry run starts immediately, the real publish only once every test job passed.
  cargo-publish-dry-run:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/cargo-publish-dry-run.yml
    secrets: inherit

  cargo-publish:
    needs:
      - test
      - test-cloud
      - test-hsm-hardware
      - test-ui
    # Real publish, tags only: a skipped dependency (upstream-only jobs on forks) must not skip
    # it, but any failed or cancelled dependency blocks it.
    if: >-
      startsWith(github.ref, 'refs/tags/') && !failure() && !cancelled()
    uses: ./.github/workflows/cargo-publish.yml
    secrets:
      token: ${{ secrets.CRATES_IO }}

  public_documentation:
    if: github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.ref_name, 'dependabot/') && github.actor != 'dependabot[bot]'
      || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Deploy documentation in staging
        if: ${{ github.ref_name == 'develop' }}
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1
        with:
          workflow: staging.yml
          repo: Cosmian/public_documentation
          ref: develop
          token: ${{ secrets.PAT_TOKEN }}

      - name: Deploy documentation in prod
        if: startsWith(github.ref, 'refs/tags')
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1
        with:
          workflow: prod.yml
          repo: Cosmian/public_documentation
          ref: main
          token: ${{ secrets.PAT_TOKEN }}
