---
name: CI
run-name: CI (${{ github.head_ref || github.ref_name }})

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: 0 3 * * * # Daily at 03:00 UTC

# A new push to the same PR cancels the pipeline still running for the previous commit.
# Every other run (tag, schedule, manual) gets a unique group, so it is never queued behind or
# cancelled by another run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main:
    secrets: inherit
    uses: ./.github/workflows/main_base.yml
    with:
      toolchain: 1.99.1
