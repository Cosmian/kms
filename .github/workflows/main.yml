---
name: CI
run-name: CI (${{ github.head_ref || github.ref_name }})

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: 0 3 * * * # Daily at 03:00 UTC

# A new push to the same PR cancels the pipeline still running for the previous commit.
# Every other run (tag, schedule, manual) gets a unique group, so it is never queued behind or
# cancelled by another run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs only the jobs whose files (.github/ci-paths.toml) the PR changes; tags, schedule and dispatch run everything.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      suites-matrix: ${{ steps.classify.outputs.suites-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # On pull_request the checkout is the test merge commit, whose first parent is the base branch tip.
          fetch-depth: 2

      - uses: ./.github/actions/install-mise

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          NO_SECRETS: ${{ github.repository != 'Cosmian/kms' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name !=
            github.repository) }}
          DEPENDABOT: ${{ github.event_name == 'pull_request' && (startsWith(github.ref_name, 'dependabot/') || github.actor == 'dependabot[bot]') }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mise run dev:ci-changes --self-test
          flags=()
          if [ "${NO_SECRETS}" = "true" ]; then flags+=(--no-secrets); fi
          if [ "${FORK_PR}" = "true" ]; then flags+=(--fork-pr); fi
          if [ "${DEPENDABOT}" = "true" ]; then flags+=(--dependabot); fi
          case "${EVENT_NAME}" in
            pull_request) mise run dev:ci-changes --base HEAD^1 "${flags[@]}" ;;
            push) mise run dev:ci-changes --all --event tag "${flags[@]}" ;; # main.yml's only push trigger is tags
            *) mise run dev:ci-changes --all --event "${EVENT_NAME}" "${flags[@]}" ;;
          esac

  cargo-deny:
    uses: Cosmian/reusable_workflows/.github/workflows/cargo-audit.yml@9079c7a06025e1373a9be950fd94a36464ded0b9 # develop
    name: Security Audit

  supply-chain:
    uses: ./.github/workflows/supply-chain.yml

  test: # Every CI unit as a leg of one matrix (PRs, tags and the nightly schedule / manual dispatch)
    needs: changes
    if: needs.changes.outputs.suites-matrix != '[]'
    uses: ./.github/workflows/test_all.yml
    secrets: inherit
    with:
      suites-matrix: ${{ needs.changes.outputs.suites-matrix }}

  public_documentation:
    if: github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.ref_name, 'dependabot/') && github.actor != 'dependabot[bot]'
      || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Deploy documentation in staging
        if: ${{ github.ref_name == 'develop' }}
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1
        with:
          workflow: staging.yml
          repo: Cosmian/public_documentation
          ref: develop
          token: ${{ secrets.PAT_TOKEN }}

      - name: Deploy documentation in prod
        if: startsWith(github.ref, 'refs/tags')
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1
        with:
          workflow: prod.yml
          repo: Cosmian/public_documentation
          ref: main
          token: ${{ secrets.PAT_TOKEN }}
