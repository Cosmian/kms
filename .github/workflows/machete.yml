---
name: Machete

on:
  workflow_call: {}
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'

concurrency:
  group: machete-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  machete:
    uses: Cosmian/reusable_workflows/.github/workflows/cargo-machete.yml@9079c7a06025e1373a9be950fd94a36464ded0b9 # develop
