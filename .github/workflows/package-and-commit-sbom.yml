---
# Local reusable workflow — Package, wait, and commit SBOMs.
#
# Dispatches packaging.yml on `ref` through `workflow_dispatch` (the
# `publish-sbom` job in packaging.yml runs only on PR, tag, or
# workflow_dispatch; dispatching builds the ref's current HEAD, which includes
# the bot commits made earlier). Polls until the run completes, retrieves the
# SBOMs from package.cosmian.com/kms/last_build/<ref>/sbom/ and commits them
# to `ref` through commit-generated.yml (the retrieval job holds no credential).
#
# Callers / triggers
# ──────────────────
# release.yml — after update-nix-hashes and update-generated-docs.
# nightly.yml — non-tag refs, after update-nix-hashes and update-generated-docs.

name: Package and commit SBOM

on:
  workflow_call:
    inputs:
      ref:
        description: >
          Git ref (branch name) to package and to push the SBOMs to.
        required: true
        type: string
      new_version:
        description: >
          Optional version string appended to the commit message (e.g. "5.20.0").
        required: false
        type: string
        default: ''
    secrets:
      PAT_TOKEN:
        description: >
          Personal Access Token with `repo` + `workflow` scopes.
          Required to dispatch packaging.yml and so that the push re-triggers
          other workflows (GITHUB_TOKEN cannot do this).
        required: true
    outputs:
      packaging_run_id:
        description: ID of the dispatched packaging.yml run.
        value: ${{ jobs.trigger-packaging.outputs.packaging_run_id }}

jobs:
  trigger-packaging:
    name: Trigger & await packaging CI
    runs-on: ubuntu-24.04
    outputs:
      packaging_run_id: ${{ steps.dispatch.outputs.run_id }}

    steps:
      - name: Dispatch packaging.yml on ${{ inputs.ref }}
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          BRANCH: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          echo "Dispatching packaging.yml on branch '$BRANCH'…"

          # Capture the timestamp before dispatch so we can find the new run
          BEFORE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # gh prints the run URL when the dispatch API returns run details.
          OUT=$(gh workflow run packaging.yml \
            --repo Cosmian/kms \
            --ref "$BRANCH")
          echo "$OUT"
          RUN_ID=$(sed -nE 's#.*/actions/runs/([0-9]+).*#\1#p' <<<"$OUT" | head -n1)

          # Fallback when no URL was printed: poll the run list (it lags the
          # dispatch by more than a fixed 10 s sleep at times) for a run created
          # after BEFORE; a transient API error just moves on to the next try.
          for _ in $(seq 1 18); do
            [ -n "$RUN_ID" ] && break
            sleep 10
            RUN_ID=$(GH_PAGER=cat gh run list \
              --repo Cosmian/kms \
              --branch "$BRANCH" \
              --workflow packaging.yml \
              --limit 5 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt > \"$BEFORE\")] | .[0].databaseId // empty") || RUN_ID=
          done

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: Could not find the dispatched packaging.yml run." >&2
            exit 1
          fi

          echo "Dispatched run ID: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for packaging run to complete
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: |
          set -euo pipefail

          echo "Waiting for packaging run $RUN_ID to complete…"
          echo "  (packaging takes 40-70 min to run; self-hosted runners may"
          echo "   also be pending/queued for hours — timeout set to 360 min)"

          MAX_WAIT=21600
          INTERVAL=60
          elapsed=0

          while true; do
            STATUS=$(GH_PAGER=cat gh run view "$RUN_ID" \
              --repo Cosmian/kms \
              --json status,conclusion \
              --jq '.status')
            CONCLUSION=$(GH_PAGER=cat gh run view "$RUN_ID" \
              --repo Cosmian/kms \
              --json status,conclusion \
              --jq '.conclusion // empty')

            echo "  $(date -u +"%H:%M:%SZ") — Run $RUN_ID: status=$STATUS conclusion=${CONCLUSION:-pending}"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Packaging run $RUN_ID completed successfully."
                break
              else
                echo "ERROR: Packaging run $RUN_ID finished with conclusion '$CONCLUSION'." >&2
                echo "       Review: https://github.com/Cosmian/kms/actions/runs/$RUN_ID" >&2
                echo "       Fix the packaging failure and re-run the calling workflow." >&2
                exit 1
              fi
            fi

            if [ "$elapsed" -ge "$MAX_WAIT" ]; then
              echo "ERROR: Timed out waiting for packaging CI after ${MAX_WAIT}s." >&2
              exit 1
            fi

            sleep "$INTERVAL"
            elapsed=$((elapsed + INTERVAL))
          done

  # Builder: downloads over HTTPS and holds NO credential (checkout without token/persisted auth).
  retrieve-sbom:
    name: Retrieve SBOM
    needs: trigger-packaging
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Capture base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/install-mise

      - name: Retrieve SBOMs from package.cosmian.com
        env:
          REF: ${{ inputs.ref }}
        run: |
          # The packaging CI publishes SBOMs under:
          #   last_build/<ref>/sbom/
          mise run sbom:generate --retrieve --branch "last_build/${REF}"

      # Exactly the files `sbom:generate --retrieve` downloads. sbom/openvex.json is hand-curated and
      # sbom/licenses.txt belongs to update-generated-docs.yml: neither may travel in this patch.
      - name: Capture the SBOMs as a patch
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          OUT_DIR: ${{ runner.temp }}/retrieved-sbom
          PATHS: |
            sbom/server/fips/static/bom.cdx.json
            sbom/server/fips/static/bom.spdx.json
            sbom/server/fips/static/sbom.csv
            sbom/server/fips/static/meta.json
            sbom/server/fips/static/vulns.csv
            sbom/server/fips/static/graph.png
            sbom/server/fips/dynamic/bom.cdx.json
            sbom/server/fips/dynamic/bom.spdx.json
            sbom/server/fips/dynamic/sbom.csv
            sbom/server/fips/dynamic/meta.json
            sbom/server/fips/dynamic/vulns.csv
            sbom/server/fips/dynamic/graph.png
            sbom/server/non-fips/static/bom.cdx.json
            sbom/server/non-fips/static/bom.spdx.json
            sbom/server/non-fips/static/sbom.csv
            sbom/server/non-fips/static/meta.json
            sbom/server/non-fips/static/vulns.csv
            sbom/server/non-fips/static/graph.png
            sbom/server/non-fips/dynamic/bom.cdx.json
            sbom/server/non-fips/dynamic/bom.spdx.json
            sbom/server/non-fips/dynamic/sbom.csv
            sbom/server/non-fips/dynamic/meta.json
            sbom/server/non-fips/dynamic/vulns.csv
            sbom/server/non-fips/dynamic/graph.png
            sbom/ckms/fips/static/bom.cdx.json
            sbom/ckms/fips/static/bom.spdx.json
            sbom/ckms/fips/static/sbom.csv
            sbom/ckms/fips/static/meta.json
            sbom/ckms/fips/static/vulns.csv
            sbom/ckms/fips/static/graph.png
            sbom/ckms/fips/dynamic/bom.cdx.json
            sbom/ckms/fips/dynamic/bom.spdx.json
            sbom/ckms/fips/dynamic/sbom.csv
            sbom/ckms/fips/dynamic/meta.json
            sbom/ckms/fips/dynamic/vulns.csv
            sbom/ckms/fips/dynamic/graph.png
            sbom/ckms/non-fips/static/bom.cdx.json
            sbom/ckms/non-fips/static/bom.spdx.json
            sbom/ckms/non-fips/static/sbom.csv
            sbom/ckms/non-fips/static/meta.json
            sbom/ckms/non-fips/static/vulns.csv
            sbom/ckms/non-fips/static/graph.png
            sbom/ckms/non-fips/dynamic/bom.cdx.json
            sbom/ckms/non-fips/dynamic/bom.spdx.json
            sbom/ckms/non-fips/dynamic/sbom.csv
            sbom/ckms/non-fips/dynamic/meta.json
            sbom/ckms/non-fips/dynamic/vulns.csv
            sbom/ckms/non-fips/dynamic/graph.png
        run: bash .mise/scripts/release/make_generated_patch.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: retrieved-sbom
          path: ${{ runner.temp }}/retrieved-sbom
          retention-days: 1
          if-no-files-found: error

  # Publisher: Git only. develop/main can move during the long packaging wait: the commit is rebased.
  # [skip ci] stops this commit from re-triggering nightly.yml.
  commit-sbom:
    name: Commit SBOM
    needs: retrieve-sbom
    permissions:
      contents: read
    uses: ./.github/workflows/commit-generated.yml
    with:
      ref: ${{ inputs.ref }}
      base-sha: ${{ needs.retrieve-sbom.outputs.base_sha }}
      artifact: retrieved-sbom
      message: >-
        build: update SBOM reports${{ inputs.new_version != '' && format(' for {0}', inputs.new_version) || '' }} [skip ci]
      paths: |
        sbom/server/fips/static/bom.cdx.json
        sbom/server/fips/static/bom.spdx.json
        sbom/server/fips/static/sbom.csv
        sbom/server/fips/static/meta.json
        sbom/server/fips/static/vulns.csv
        sbom/server/fips/static/graph.png
        sbom/server/fips/dynamic/bom.cdx.json
        sbom/server/fips/dynamic/bom.spdx.json
        sbom/server/fips/dynamic/sbom.csv
        sbom/server/fips/dynamic/meta.json
        sbom/server/fips/dynamic/vulns.csv
        sbom/server/fips/dynamic/graph.png
        sbom/server/non-fips/static/bom.cdx.json
        sbom/server/non-fips/static/bom.spdx.json
        sbom/server/non-fips/static/sbom.csv
        sbom/server/non-fips/static/meta.json
        sbom/server/non-fips/static/vulns.csv
        sbom/server/non-fips/static/graph.png
        sbom/server/non-fips/dynamic/bom.cdx.json
        sbom/server/non-fips/dynamic/bom.spdx.json
        sbom/server/non-fips/dynamic/sbom.csv
        sbom/server/non-fips/dynamic/meta.json
        sbom/server/non-fips/dynamic/vulns.csv
        sbom/server/non-fips/dynamic/graph.png
        sbom/ckms/fips/static/bom.cdx.json
        sbom/ckms/fips/static/bom.spdx.json
        sbom/ckms/fips/static/sbom.csv
        sbom/ckms/fips/static/meta.json
        sbom/ckms/fips/static/vulns.csv
        sbom/ckms/fips/static/graph.png
        sbom/ckms/fips/dynamic/bom.cdx.json
        sbom/ckms/fips/dynamic/bom.spdx.json
        sbom/ckms/fips/dynamic/sbom.csv
        sbom/ckms/fips/dynamic/meta.json
        sbom/ckms/fips/dynamic/vulns.csv
        sbom/ckms/fips/dynamic/graph.png
        sbom/ckms/non-fips/static/bom.cdx.json
        sbom/ckms/non-fips/static/bom.spdx.json
        sbom/ckms/non-fips/static/sbom.csv
        sbom/ckms/non-fips/static/meta.json
        sbom/ckms/non-fips/static/vulns.csv
        sbom/ckms/non-fips/static/graph.png
        sbom/ckms/non-fips/dynamic/bom.cdx.json
        sbom/ckms/non-fips/dynamic/bom.spdx.json
        sbom/ckms/non-fips/dynamic/sbom.csv
        sbom/ckms/non-fips/dynamic/meta.json
        sbom/ckms/non-fips/dynamic/vulns.csv
        sbom/ckms/non-fips/dynamic/graph.png
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
