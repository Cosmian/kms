---
name: Windows Build

on:
  workflow_call:
    inputs:
      archive-name:
        required: true
        type: string
      variant:
        required: false
        type: string
        default: non-fips
    secrets:
      AZURE_TENANT_ID_POC:
        required: true
      AZURE_CLIENT_ID_POC:
        required: true
      AZURE_CLIENT_SECRET_POC:
        required: true

jobs:
  cargo-build:
    name: ${{ inputs.archive-name }} - 2022-${{ inputs.variant }}
    runs-on: windows-2022
    steps:
      - name: Print ENV
        run: printenv

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-rust

      - name: Discover environment variables on Runner
        shell: pwsh
        run: |
          Get-ChildItem env:

      - name: Locate VCPKG_INSTALLATION_ROOT
        shell: pwsh
        run: |
          Get-ChildItem $env:VCPKG_INSTALLATION_ROOT

      - name: Build static OpenSSL
        uses: ./.github/actions/build-static-openssl

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      # Corepack runs the pnpm pinned with its sha512 in ui/package.json.
      - name: Enable Corepack pnpm
        run: corepack enable pnpm

      - name: Cache the OpenSSL FIPS provider
        if: inputs.variant == 'fips'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\openssl-fips
          key: openssl-fips-3.1.2-${{ runner.os }}-${{ hashFiles('.mise/scripts/windows/prepare_windows_fips_provider.ps1') }}

      - name: Build UI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . .\.mise\scripts\windows\windows_ui.ps1
          Build-UI -Variant ${{ inputs.variant }}

      - name: Copy UI to server directory
        if: inputs.variant == 'non-fips'
        shell: pwsh
        run: |
          if (Test-Path "crate\server\ui_non_fips") {
            Remove-Item -Recurse -Force "crate\server\ui_non_fips"
          }
          New-Item -ItemType Directory -Path "crate\server\ui_non_fips" -Force
          Copy-Item -Recurse "ui\dist\*" "crate\server\ui_non_fips\"
          Write-Host "UI copied to crate\server\ui_non_fips"
          Get-ChildItem -Recurse "crate\server\ui_non_fips"

      - name: List vcpkg install
        shell: pwsh
        run: |
          # vcpkg manifest mode (vcpkg.json present) installs to vcpkg_installed/<triplet>
          # relative to the project root, not under VCPKG_INSTALLATION_ROOT\packages.
          $manifestDir = "vcpkg_installed\x64-windows-static"
          if (Test-Path $manifestDir) {
            Write-Host "vcpkg manifest-mode install found at: $manifestDir"
            Get-ChildItem -Recurse $manifestDir
          } else {
            Write-Host "Falling back to classic-mode path under VCPKG_INSTALLATION_ROOT"
            Get-ChildItem -Recurse "$env:VCPKG_INSTALLATION_ROOT\packages"
          }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . .\.mise\scripts\windows\cargo_build.ps1
          BuildProject -Variant ${{ inputs.variant }}
          # GitHub's pwsh wrapper propagates a stale $LASTEXITCODE otherwise.
          exit 0

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.archive-name }}-release
          # Single glob keeps target/release as the artifact root so the sign
          # job's non-recursive filter finds the .exe files at the top level.
          # Do not add other paths (e.g. README.md) here: upload-artifact
          # would then use the repo root as base and nest files under
          # target/release/, breaking the sign step (see PR #1101 regression).
          path: target/release/*.exe
          retention-days: 1
          if-no-files-found: error

  sign:
    name: ${{ inputs.archive-name }} - sign installers
    needs: cargo-build
    uses: Cosmian/reusable_scripts/.github/workflows/sign-windows-artifacts.yml@54c23fe09936c084848b4495cf5bb744720b9d0c # develop
    with:
      artifact-to-download: ${{ inputs.archive-name }}-release
      files-folder: to-sign
      files-folder-filter: exe
      artifact-name: ${{ inputs.archive-name }}-release-signed
      signing-account-name: cosmian-codesigning-test
      certificate-profile-name: cosmian-public-profile
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID_POC }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_POC }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET_POC }}

  test:
    needs: sign
    name: ${{ inputs.archive-name }} - test on clean env.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.archive-name }}-release-signed
          path: installers

      - name: List files recursively
        shell: pwsh
        run: Get-ChildItem -Recurse

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $executables = @(
            Get-ChildItem -Path installers -Recurse -Filter "cosmian-kms-server*.exe"
            if ('${{ inputs.variant }}' -ne 'fips') { Get-ChildItem -Path installers -Recurse -Filter "cosmian-kms-cli*.exe" }
          )
          $expected = if ('${{ inputs.variant }}' -eq 'fips') { 1 } else { 2 }
          if ($executables.Count -ne $expected) {
            Write-Error "Expected $expected signed Windows installer(s), found $($executables.Count)"
            exit 1
          }

          $invalidSignatures = @()
          foreach ($executable in $executables) {
            $signature = Get-AuthenticodeSignature -FilePath $executable.FullName
            $signer = $signature.SignerCertificate
            $status = "$($signature.Status)"
            $subject = if ($null -ne $signer) { $signer.Subject } else { "<none>" }
            Write-Host "$($executable.Name): status=$status signer=$subject"

            # Azure Trusted Signing test profiles can return UnknownError when
            # the runner cannot build the public trust chain. The signer
            # certificate is still present; reject missing certificates and
            # cryptographic/hash failures, but allow this trust-only status.
            $trustOnlyStatus = $signature.Status -eq "UnknownError" -and $null -ne $signer
            if ($signature.Status -ne "Valid" -and -not $trustOnlyStatus) {
              $invalidSignatures += "$($executable.FullName) ($($signature.Status))"
            }
          }

          if ($invalidSignatures.Count -gt 0) {
            Write-Error "Invalid Authenticode signatures: $($invalidSignatures -join ', ')"
            exit 1
          }

      - name: Launch binaries
        shell: pwsh
        run: |
          # The artifacts are NSIS installers (not bare binaries), so we
          # verify they exist rather than trying to execute them with -V.
          $serverExe = Get-ChildItem -Path installers -Recurse -Filter "cosmian-kms-server*.exe" | Select-Object -First 1
          if ($null -eq $serverExe) { Write-Error "Server installer not found"; exit 1 }
          Write-Host "Server installer present: $($serverExe.FullName)"

          if ('${{ inputs.variant }}' -ne 'fips') {
            $cliExe = Get-ChildItem -Path installers -Recurse -Filter "cosmian-kms-cli*.exe" | Select-Object -First 1
            if ($null -eq $cliExe) { Write-Error "CLI installer not found"; exit 1 }
            Write-Host "CLI installer present: $($cliExe.FullName)"
          }

      # Real silent install, service start and uninstall (the windows-2022 runner is elevated).
      # Not enabled for non-fips: existing publishing must not gain a new failure mode.
      - name: Install and smoke-test the installer
        if: inputs.variant == 'fips'
        shell: pwsh
        run: |
          $installer = Get-ChildItem installers -Recurse -Filter "cosmian-kms-server*.exe" | Select-Object -First 1
          .\.mise\scripts\windows\test_windows_package.ps1 -Installer $installer.FullName -Variant fips
