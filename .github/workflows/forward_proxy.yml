---
name: forward proxy

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string

jobs:
  forward-proxy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-mise

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy

      - name: Prerequisites
        run: |
          set -ex
          sudo apt update
          sudo apt install squid
          sudo cp .github/scripts/squid/passwd /etc/squid/
          sudo cp .github/scripts/squid/squid.conf /etc/squid/
          sudo systemctl restart squid
          sudo journalctl -u squid --no-pager -f &
          sleep 5
          curl http://localhost:8888
          curl -v -x http://localhost:8888 -U myuser:mypwd http://example.org

      - name: Forward proxy test
        run: |
          set -ex
          cargo +${{ inputs.toolchain }} build -p ckms --features non-fips

          # Get the local IP address
          LOCAL_IP=$(hostname -I | awk '{print $1}')
          echo "Local IP address: $LOCAL_IP"

          # Export only the host part in KMS_URL — the test extracts the host
          # and combines it with the actual server port (dynamically allocated).
          # The port in this URL is intentionally omitted; only the host matters.
          export KMS_URL=http://$LOCAL_IP

          cargo +${{ inputs.toolchain }} test --workspace --lib --features non-fips -- --nocapture --ignored test_server_version_using_forward_proxy
