---
name: CI checks

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string

jobs:
  cla-assistant:
    if: (github.event.pull_request.head.repo.full_name != github.repository) && ((github.event.comment.body == 'recheck' || github.event.comment.body ==
      'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target')
    uses: ./.github/workflows/cla.yml
    secrets: inherit

  cargo-clippy:
    uses: Cosmian/reusable_workflows/.github/workflows/clippy.yml@4dea9311cbb490ce7aed588ae42e1bde70d4547d # develop
    with:
      toolchain: ${{ inputs.toolchain }}

  cargo-deny:
    uses: Cosmian/reusable_workflows/.github/workflows/cargo-audit.yml@4dea9311cbb490ce7aed588ae42e1bde70d4547d # develop
    name: Security Audit
    with:
      toolchain: ${{ inputs.toolchain }}

  cargo-machete:
    uses: Cosmian/reusable_workflows/.github/workflows/cargo-machete.yml@4dea9311cbb490ce7aed588ae42e1bde70d4547d # develop
    with:
      toolchain: ${{ inputs.toolchain }}

  cargo-vet:
    name: Supply chain — cargo vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ inputs.toolchain }}

      - name: Install cargo-vet
        run: cargo install --locked cargo-vet@0.10.2

      - name: cargo vet check
        run: cargo vet check --locked

  python-dependency-audit:
    name: Supply chain — pip-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Audit Python requirements
        run: |
          set -euo pipefail
          python3 -m venv /tmp/pip-audit-venv
          source /tmp/pip-audit-venv/bin/activate
          pip install --quiet pip-audit==2.10.1
          for f in \
            .mise/scripts/test/requirements-pkcs11-check.txt \
            .mise/scripts/test/requirements-jose.txt \
            .mise/scripts/test/requirements-cef.txt \
            .mise/scripts/test/requirements-audit-compat.txt \
            .mise/scripts/docs/requirements.txt; do
            echo "::group::pip-audit $f"
            pip-audit -r "$f"
            echo "::endgroup::"
          done

  govulncheck:
    name: Supply chain — govulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .mise/scripts/kmip-go/go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        working-directory: .mise/scripts/kmip-go
        run: govulncheck -test ./...

  npm-dependency-audit:
    name: Supply chain — npm audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - uses: ./.github/actions/install-mise

      - name: Audit UI npm dependencies
        run: mise run audit:npm

  forward-proxy:
    uses: ./.github/workflows/forward_proxy.yml
    with:
      toolchain: ${{ inputs.toolchain }}

  cargo-test:
    name: No Nix - ${{ matrix.runner }} - ${{ matrix.type }} - ${{ matrix.features }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        type:
          - sqlite
        features: [fips, non-fips]
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]

    steps:
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: With cargo only
        run: |
          set -ex
          if [ "${{ matrix.features }}" = "non-fips" ]; then
            export FEATURES_FLAG="--features non-fips";
            # Build the PKCS#11 cdylib so that `ckms pkcs11 verify` and
            # integration tests can dynamically load it at runtime.
            # `cargo test --lib` does not produce cdylib artifacts.
            cargo build -p cosmian_pkcs11 --features non-fips
          else
            export FEATURES_FLAG="";
          fi
          cargo test --workspace --lib $FEATURES_FLAG -- --nocapture

  test: # Run all tests
    if: github.event_name == 'pull_request' && !startsWith(github.ref_name, 'dependabot/') && github.actor != 'dependabot[bot]' || startsWith(github.ref,
      'refs/tags/')
    uses: ./.github/workflows/test_all.yml
    secrets: inherit
    with:
      toolchain: ${{ inputs.toolchain }}

  build-documentation:
    name: Build documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install mdBook toolchain
        run: bash documentation/theme/scripts/setup-mdbook.sh

      - name: Build documentation
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cd documentation && mdbook build

  linkcheck:
    name: Check documentation links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config lychee.toml 'documentation/docs/**/*.md'
          fail: false

  public_documentation:
    if: github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.ref_name, 'dependabot/') && github.actor != 'dependabot[bot]'
      || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Deploy documentation in staging
        if: ${{ github.ref_name == 'develop' }}
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1
        with:
          workflow: staging.yml
          repo: Cosmian/public_documentation
          ref: develop
          token: ${{ secrets.PAT_TOKEN }}

      - name: Deploy documentation in prod
        if: startsWith(github.ref, 'refs/tags')
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1
        with:
          workflow: prod.yml
          repo: Cosmian/public_documentation
          ref: main
          token: ${{ secrets.PAT_TOKEN }}
