---
name: Test pki (macOS)

on:
  workflow_call: {}
  pull_request:
    paths:
      - crate/server/src/routes/est/**
      - crate/server/src/routes/scep/**
      - crate/server/src/routes/ocsp/**
      - crate/server/src/routes/crl.rs
      - crate/server/src/routes/csr.rs
      - crate/server/src/routes/enrollment.rs
      - crate/server/src/routes/enrollment_guard.rs
      - .mise/tasks/test/pki/**
      - .mise/scripts/test/test_est_interop.sh
      - .mise/scripts/test/test_scep_interop.sh
      - .mise/scripts/kmip-go/go.mod
      - crate/server/src/core/certificate/**
      - crate/server/src/core/operations/certify/**
      - crate/server/src/core/operations/generate_crl.rs
      - crate/server/src/core/operations/generate_csr.rs
      - crate/server/src/core/operations/recertify.rs
      - crate/clients/clap/src/actions/certificates/**

concurrency:
  group: test-pki-macos-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PKI group (EST / SCEP third-party clients, OCSP, revocation) on macOS; Linux runs it in the `pki` legs of `test-suites`.
  # Inline, not test-group.yml: macOS has no Nix.
  interop-macos:
    name: Test pki (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-rust

      - uses: ./.github/actions/cache-openssl-buildrs
        with:
          variant: fips

      - uses: ./.github/actions/install-mise

      # estclient / scepclient are Go programs built by the interop scripts
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .mise/scripts/kmip-go/go.mod

      - name: Test
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUITE: pki
          VARIANT: fips
        run: |
          st=0
          mise run "test:${SUITE}" --variant "$VARIANT" || st=$?
          if [ "$st" -eq 77 ]; then echo "::warning::test:${SUITE} skipped (see its SKIP line)"; st=0; fi
          exit "$st"
