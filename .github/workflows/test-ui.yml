---
name: Test ui

on:
  workflow_call: {}
  pull_request:
    paths:
      - ui/**
      - crate/clients/wasm/**
      - crate/server/src/routes/ui_auth.rs
      - authentication
      - .mise/tasks/test/ui/**
      - .mise/tasks/build/ui
      - .mise/tasks/build/wasm
      - .mise/scripts/test/test_ui.sh
      - .mise/scripts/test/test_ui_auth.sh
      - .mise/scripts/test/test_ui_oidc.sh
      - .mise/scripts/test/test_ui_saml.sh
      - .mise/scripts/test/saml_sso/**

concurrency:
  group: test-ui-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cache:
    uses: ./.github/workflows/nix-dev-shell-cache.yml

  # Runs pnpm install and the JS toolchain (vite, vitest, playwright): any npm dependency can read the
  # job's environment, so it gets no cloud/test secrets.
  test-ui:
    name: Test ui (${{ matrix.variant }})
    needs: cache
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [fips, non-fips]
    uses: ./.github/workflows/test-group.yml
    with:
      suite: ui
      variant: ${{ matrix.variant }}
