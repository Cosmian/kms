---
name: Packaging

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string
        default: 1.99.1

  workflow_dispatch:
    inputs:
      toolchain:
        description: Rust toolchain version
        required: false
        type: string
        default: 1.99.1

jobs:
  windows-package:
    uses: ./.github/workflows/build_windows.yml
    with:
      toolchain: 1.99.1
      archive-name: windows
    secrets:
      AZURE_TENANT_ID_POC: ${{ secrets.AZURE_TENANT_ID_POC }}
      AZURE_CLIENT_ID_POC: ${{ secrets.AZURE_CLIENT_ID_POC }}
      AZURE_CLIENT_SECRET_POC: ${{ secrets.AZURE_CLIENT_SECRET_POC }}

  docker:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event_name ==
      'schedule'
    uses: ./.github/workflows/packaging-docker.yml
    with:
      toolchain: 1.99.1
    secrets: inherit

  packages:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event_name ==
      'schedule'
    name: ${{ matrix.runner }}-${{ matrix.features }}-${{ matrix.link }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        features: [fips, non-fips]
        link: [static, dynamic]
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-nix-mise
        with:
          cleanup-runner: ${{ runner.os == 'Linux' }}
          extra-nix-config: http-connections = 8

      - name: Import GPG key
        uses: ./.github/actions/import-gpg-key
        with:
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          passphrase: ${{ secrets.GPG_SIGNING_KEY_PASSPHRASE }}

      - name: Package with GPG signature
        run: |
          if [ "$(uname)" = "Darwin" ]; then
            mise run package:dmg --variant ${{ matrix.features }} --link ${{ matrix.link }}
          else
            mise run package:deb --variant ${{ matrix.features }} --link ${{ matrix.link }}
            mise run package:rpm --variant ${{ matrix.features }} --link ${{ matrix.link }}
            mise run package:pkcs11-zip --variant ${{ matrix.features }} --link ${{ matrix.link }}
          fi
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSPHRASE }}

      - name: Generate SBOM (server + ckms)
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          mise run sbom:generate --variant ${{ matrix.features }} --link ${{ matrix.link }} --target openssl_3_1_2
          mise run sbom:generate --variant ${{ matrix.features }} --link ${{ matrix.link }} --target openssl_3_6_5
          mise run sbom:generate --variant ${{ matrix.features }} --link ${{ matrix.link }} --target server
          mise run sbom:generate --variant ${{ matrix.features }} --link ${{ matrix.link }} --target ckms

      - name: Upload SBOM artifact
        if: matrix.runner == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom_${{ matrix.features }}_${{ matrix.link }}
          path: sbom/
          retention-days: 1
          if-no-files-found: error

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.features }}_${{ matrix.link }}_${{ matrix.runner }}-release
          path: result-*-${{ matrix.features }}-${{ matrix.link }}/*
          retention-days: 1
          if-no-files-found: error

  kubernetes:
    uses: ./.github/workflows/packaging-kubernetes.yml
    secrets: inherit

  # Alpine apk pipeline. No `needs:`: it runs in parallel with the glibc
  # packages (musl vendor hashes are independent of nix-update-hashes.yml).
  # Called here so that every packaging.yml run also runs packaging-apk.yml.
  apk:
    uses: ./.github/workflows/packaging-apk.yml
    secrets: inherit
    with:
      toolchain: 1.99.1

  publish-release:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'

    name: Publish ${{ matrix.runner }}-${{ matrix.features }}-${{ matrix.link }}
    needs: packages
    runs-on: [self-hosted, not-sgx]
    container:
      image: cosmian/docker_doc_ci
      volumes:
        - /home/cosmian/.ssh/id_rsa:/root/.ssh/id_rsa

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        features: [fips, non-fips]
        link: [static, dynamic]
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        package-type: [deb, rpm, dmg, pkcs11-zip]
        cpu-arch: [amd64, arm64]
        exclude:
          - runner: ubuntu-24.04
            package-type: dmg
          - runner: ubuntu-24.04-arm
            package-type: dmg
          - runner: macos-15
            package-type: deb
          - runner: macos-15
            package-type: rpm
          - runner: macos-15
            package-type: pkcs11-zip
          - runner: ubuntu-24.04
            cpu-arch: arm64
          - runner: ubuntu-24.04-arm
            cpu-arch: amd64
          - runner: macos-15
            cpu-arch: amd64
    steps:
      - name: Remove existing old artifacts
        run: rm -rf ${{ matrix.features }}_${{ matrix.link }}_${{ matrix.runner }}-release

      - name: Checkout repository (for public key file)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Download packaged artifact for this matrix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ matrix.features }}_${{ matrix.link }}_${{ matrix.runner }}-release

      - name: List downloaded assets
        run: |
          set -ex
          ls -la
          find . -type f -print

      - name: Compute upload set
        id: upload-set
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.runner }}" == ubuntu* ]]; then BINARY_PATTERN=linux; else BINARY_PATTERN=darwin; fi
          if [[ "${{ matrix.package-type }}" == "rpm" ]]; then
            if [[ "${{ matrix.runner }}" == "ubuntu-24.04-arm" ]]; then PACKAGE_PATTERN="aarch64"; else PACKAGE_PATTERN="x86_64"; fi
          else
            PACKAGE_PATTERN="${{ matrix.cpu-arch }}"
          fi
          if [[ "${{ matrix.package-type }}" == "pkcs11-zip" ]]; then PKG_EXT=".zip"; else PKG_EXT=".${{ matrix.package-type }}"; fi
          {
            echo "subdir=${{ matrix.package-type }}/${{ matrix.cpu-arch }}/${{ matrix.features }}/${{ matrix.link }}"
            echo 'files<<EOF'
            if [[ "${{ matrix.package-type }}" != "pkcs11-zip" ]]; then
              echo "./nix/signing-keys/cosmian-kms-public.asc"
              echo "result-server-${{ matrix.features }}-${{ matrix.link }}/bin/*${BINARY_PATTERN}*"
            fi
            echo "result-${{ matrix.package-type }}-${{ matrix.features }}-${{ matrix.link }}/*${PACKAGE_PATTERN}*${PKG_EXT}*"
            echo 'EOF'
          } >>"$GITHUB_OUTPUT"

      - name: Push to package.cosmian.com (self-hosted)
        uses: ./.github/actions/push-package-cosmian
        with:
          known-hosts: ${{ vars.PACKAGE_COSMIAN_SSH_KNOWN_HOSTS }}
          subdir: ${{ steps.upload-set.outputs.subdir }}
          files: ${{ steps.upload-set.outputs.files }}

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/') && matrix.link == 'static' && matrix.package-type != 'pkcs11-zip'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            result-${{ matrix.package-type }}-${{ matrix.features }}-${{ matrix.link }}/cosmian-kms-server*
            result-${{ matrix.package-type }}-${{ matrix.features }}-${{ matrix.link }}/cosmian-kms-cli*
            ./nix/signing-keys/cosmian-kms-public.asc

      - name: Publish GitHub Release assets (pkcs11-zip)
        if: startsWith(github.ref, 'refs/tags/') && matrix.link == 'static' && matrix.package-type == 'pkcs11-zip'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            result-pkcs11-zip-${{ matrix.features }}-${{ matrix.link }}/cosmian-pkcs11-*
            ./nix/signing-keys/cosmian-kms-public.asc

  publish-sbom:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'

    name: Publish SBOM ${{ matrix.features }}-${{ matrix.link }}
    needs: packages
    concurrency:
      group: publish-sbom-${{ matrix.features }}-${{ matrix.link }}
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, not-sgx]
    container:
      image: cosmian/docker_doc_ci
      volumes:
        - /home/cosmian/.ssh/id_rsa:/root/.ssh/id_rsa

    strategy:
      fail-fast: false
      matrix:
        features: [fips, non-fips]
        link: [static, dynamic]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Download SBOM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sbom_${{ matrix.features }}_${{ matrix.link }}
          path: sbom

      - name: Push SBOM (server) to package.cosmian.com
        uses: ./.github/actions/push-package-cosmian
        with:
          known-hosts: ${{ vars.PACKAGE_COSMIAN_SSH_KNOWN_HOSTS }}
          subdir: sbom/server/${{ matrix.features }}/${{ matrix.link }}
          files: sbom/server/${{ matrix.features }}/${{ matrix.link }}/*

      - name: Push SBOM (ckms) to package.cosmian.com
        uses: ./.github/actions/push-package-cosmian
        with:
          known-hosts: ${{ vars.PACKAGE_COSMIAN_SSH_KNOWN_HOSTS }}
          subdir: sbom/ckms/${{ matrix.features }}/${{ matrix.link }}
          files: sbom/ckms/${{ matrix.features }}/${{ matrix.link }}/*

  build-monitoring-archive:
    name: Build monitoring stack archive
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Create monitoring archive
        run: zip -r cosmian-kms-monitoring.zip monitoring/

      - name: Upload monitoring archive artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cosmian-kms-monitoring
          path: cosmian-kms-monitoring.zip
          retention-days: 1
          if-no-files-found: error

  publish-monitoring:
    name: Publish monitoring stack archive
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
    needs: build-monitoring-archive
    runs-on: [self-hosted, not-sgx]
    container:
      image: cosmian/docker_doc_ci
      volumes:
        - /home/cosmian/.ssh/id_rsa:/root/.ssh/id_rsa

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - name: Download monitoring archive artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cosmian-kms-monitoring

      - name: Push to package.cosmian.com
        uses: ./.github/actions/push-package-cosmian
        with:
          known-hosts: ${{ vars.PACKAGE_COSMIAN_SSH_KNOWN_HOSTS }}
          subdir: monitoring
          files: cosmian-kms-monitoring.zip

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: cosmian-kms-monitoring.zip

  tests:
    needs: packages
    uses: ./.github/workflows/packaging-tests.yml
    secrets: inherit
    with:
      toolchain: 1.99.1
