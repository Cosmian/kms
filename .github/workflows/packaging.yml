---
name: Packaging

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string
        default: 1.97.0

  workflow_dispatch:
    inputs:
      toolchain:
        description: Rust toolchain version
        required: false
        type: string
        default: 1.97.0

jobs:
  windows-package:
    uses: ./.github/workflows/build_windows.yml
    with:
      toolchain: 1.97.0
      archive-name: windows
    secrets:
      AZURE_TENANT_ID_POC: ${{ secrets.AZURE_TENANT_ID_POC }}
      AZURE_CLIENT_ID_POC: ${{ secrets.AZURE_CLIENT_ID_POC }}
      AZURE_CLIENT_SECRET_POC: ${{ secrets.AZURE_CLIENT_SECRET_POC }}

  docker:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event_name ==
      'schedule'
    uses: ./.github/workflows/packaging-docker.yml
    with:
      toolchain: 1.97.0
    secrets: inherit

  packages:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event_name ==
      'schedule'
    name: ${{ matrix.runner }}-${{ matrix.features }}-${{ matrix.link }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        features: [fips, non-fips]
        link: [static, dynamic]
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/cleanup-runner
        if: runner.os == 'Linux'

      - uses: ./.github/actions/setup-nix
        with:
          extra-nix-config: http-connections = 8

      - uses: ./.github/actions/install-mise

      - name: Set up GPG
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_SIGNING_KEY }}
          passphrase: ${{ secrets.GPG_SIGNING_KEY_PASSPHRASE }}

      - name: List keys
        run: gpg -K

      - name: Package with GPG signature
        run: |
          if [ "$(uname)" = "Darwin" ]; then
            mise run package:dmg --variant ${{ matrix.features }} --link ${{ matrix.link }}
          else
            mise run package:deb --variant ${{ matrix.features }} --link ${{ matrix.link }}
            mise run package:rpm --variant ${{ matrix.features }} --link ${{ matrix.link }}
            mise run package:pkcs11-zip --variant ${{ matrix.features }} --link ${{ matrix.link }}
            # Alpine .apk packages don't have a static/dynamic-OpenSSL axis (musl libc
            # linkage is implied by --variant — see nix/kms-server-musl.nix); build them
            # once per (features, runner) rather than once per matrix.link to avoid a
            # redundant duplicate build.
            if [ "${{ matrix.link }}" = "static" ]; then
              mise run package:apk --variant ${{ matrix.features }}
            fi
          fi
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_KEY_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSPHRASE }}

      - name: Generate SBOM (server + ckms)
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          mise run sbom:generate --variant ${{ matrix.features }} --link ${{ matrix.link }} --target openssl_3_1_2
          mise run sbom:generate --variant ${{ matrix.features }} --link ${{ matrix.link }} --target openssl_3_6_2
          mise run sbom:generate --variant ${{ matrix.features }} --link ${{ matrix.link }} --target server
          mise run sbom:generate --variant ${{ matrix.features }} --link ${{ matrix.link }} --target ckms

      - name: Upload SBOM artifact
        if: matrix.runner == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: sbom_${{ matrix.features }}_${{ matrix.link }}
          path: sbom/
          retention-days: 1
          if-no-files-found: error

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.features }}_${{ matrix.link }}_${{ matrix.runner }}-release
          path: result-*-${{ matrix.features }}-${{ matrix.link }}/*
          retention-days: 1
          if-no-files-found: error

      - name: Upload Alpine apk packages
        if: runner.os == 'Linux' && matrix.link == 'static'
        uses: actions/upload-artifact@v7
        with:
          name: apk_${{ matrix.features }}_${{ matrix.runner }}
          path: |
            result-apk-server-${{ matrix.features }}/*
            result-apk-cli-${{ matrix.features }}/*
          retention-days: 1
          if-no-files-found: error

  # Reproducibility cross-check for the Alpine apk packages: builds the same target
  # with a completely independent toolchain (plain cargo + system musl-gcc,
  # no Nix). Never signed or published — see .mise/tasks/test/musl-crosscheck.
  musl-crosscheck:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event_name ==
      'schedule'
    name: musl-crosscheck-${{ matrix.features }}-${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        features: [fips, non-fips]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-mise

      - name: Install musl-tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools linux-libc-dev

      - name: Build throwaway OpenSSL for the cross-check
        run: mise run test:musl-openssl-prebuild

      - name: Run musl cross-check (plain cargo + musl-gcc, no Nix)
        env:
          OPENSSL_DIR: /tmp/musl-openssl-crosscheck
        run: mise run test:musl-crosscheck --variant ${{ matrix.features }}

  # Third, independent musl validation path: unlike musl-crosscheck above
  # (plain cargo + Debian/Ubuntu's musl-gcc, which *wraps* the host's own
  # glibc-targeted gcc/libgcc — the exact layer responsible for the
  # -moutline-atomics/__getauxval and header-sysroot issues worked around in
  # musl-openssl-prebuild), this job builds *inside a real Alpine container*
  # using Alpine's own apk-provided native toolchain end-to-end — no
  # cross-compilation, no wrapper, no foreign sysroot. See
  # .mise/tasks/test/alpine-native-build for the full rationale and a
  # standalone `docker run` invocation for local reproduction.
  alpine-native-build:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event_name ==
      'schedule'
    name: alpine-native-${{ matrix.features }}-${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    container:
      image: alpine:3.21
    strategy:
      fail-fast: false
      matrix:
        features: [fips, non-fips]
        # x64 only: GitHub Actions' JS-action support inside Alpine
        # containers is upstream-limited to x64 Linux runners — arm64 hard
        # fails with "JavaScript Actions in Alpine containers are only
        # supported on x64 Linux runners" before even reaching checkout
        # (tracked upstream: https://github.com/actions/runner/issues/1637,
        # no workaround currently exists). aarch64 coverage for musl itself
        # is not lost — musl-crosscheck above and the Nix-built artifacts
        # (test-alpine-musl below) both already cover ubuntu-24.04-arm.
        runner: [ubuntu-24.04]
    steps:
      # Must run *before* actions/checkout: GitHub's own bundled Node.js
      # (used to execute every JS-based `uses:` action, including checkout
      # and install-mise) is glibc-linked; `gcompat` shims the glibc
      # syscalls it needs on musl. `bash` is needed because composite
      # actions below default to `shell: bash`, which Alpine doesn't ship
      # (busybox `ash` only). `git` is needed too — without it,
      # actions/checkout silently falls back to the GitHub REST API tarball
      # download, which doesn't support `submodules: recursive` and
      # hard-fails instead of just skipping it. `curl` is needed by both
      # install-mise and the rustup install step further down. Installing
      # everything in one early step (rather than splitting
      # "bootstrap" vs. "toolchain" apk calls across later steps) avoids
      # repeatedly hitting "command not found" in whichever later step
      # happens to need a package that hasn't been apk-added yet. Must use
      # `shell: sh` explicitly here since bash doesn't exist yet.
      - name: Install Alpine packages (bootstrap + native build toolchain)
        shell: sh
        run: |
          apk add --no-cache \
            gcompat bash git curl \
            build-base perl linux-headers openssl-dev pkgconfig

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/install-mise

      - name: Install Rust via rustup (musl-native build, same 1.97.0 pin as the rest of CI)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain 1.97.0 --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build natively on Alpine (no cross-compilation)
        run: mise run test:alpine-native-build --variant ${{ matrix.features }}

  # Proves the Nix-built Alpine apk packages actually run on real Alpine — not just
  # that they link correctly in the Nix sandbox. See
  # .mise/scripts/test/test_alpine_musl.sh for the full test sequence
  # (FIPS-provider / legacy-provider-skip log checks, AES/RSA/EC round-trips,
  # PQC for non-FIPS including SLH-DSA as a musl thread-stack-size canary).
  test-alpine-musl:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event_name ==
      'schedule'
    name: alpine-${{ matrix.alpine-tag }}-${{ matrix.features }}-${{ matrix.runner }}
    needs: packages
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        features: [fips, non-fips]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        alpine-tag: ['3.20', '3.21', latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download apk artifact
        uses: actions/download-artifact@v8
        with:
          name: apk_${{ matrix.features }}_${{ matrix.runner }}

      - name: Locate apk packages
        run: |
          set -euo pipefail
          SERVER_APK=$(find "result-apk-server-${{ matrix.features }}" -name "cosmian-kms-server-*.apk")
          CLI_APK=$(find "result-apk-cli-${{ matrix.features }}" -name "cosmian-kms-cli-*.apk")
          echo "SERVER_APK=$(pwd)/${SERVER_APK}" >> "$GITHUB_ENV"
          echo "CLI_APK=$(pwd)/${CLI_APK}" >> "$GITHUB_ENV"

      - name: Run Alpine ${{ matrix.alpine-tag }} smoke test
        run: |
          bash .mise/scripts/test/test_alpine_musl.sh \
            --variant ${{ matrix.features }} \
            --server-apk "${SERVER_APK}" \
            --cli-apk "${CLI_APK}" \
            --alpine-tag ${{ matrix.alpine-tag }}

  kubernetes:
    uses: ./.github/workflows/packaging-kubernetes.yml
    secrets: inherit

  publish-release:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'

    name: Publish ${{ matrix.runner }}-${{ matrix.features }}-${{ matrix.link }}-${{ matrix.package-type }}
    needs: packages
    runs-on: [self-hosted, not-sgx]
    container:
      image: cosmian/docker_doc_ci
      volumes:
        - /home/cosmian/.ssh/id_rsa:/root/.ssh/id_rsa

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        features: [fips, non-fips]
        link: [static, dynamic]
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        # apk (Alpine, musl) is published here too — see the `apk`-specific
        # branches below and the trailing excludes, rather than as a separate
        # publish-apk job.
        package-type: [deb, rpm, dmg, pkcs11-zip, apk]
        cpu-arch: [amd64, arm64]
        exclude:
          - runner: ubuntu-24.04
            package-type: dmg
          - runner: ubuntu-24.04-arm
            package-type: dmg
          - runner: macos-15
            package-type: deb
          - runner: macos-15
            package-type: rpm
          - runner: macos-15
            package-type: pkcs11-zip
          - runner: macos-15
            package-type: apk
          - runner: ubuntu-24.04
            cpu-arch: arm64
          - runner: ubuntu-24.04-arm
            cpu-arch: amd64
          - runner: macos-15
            cpu-arch: amd64
          # Alpine apk packages have no static/dynamic-OpenSSL axis (musl libc
          # linkage is implied by --variant, not a free choice — see
          # nix/kms-server-musl.nix): the `packages` job only builds/uploads the
          # apk artifact once per (features, runner), under link == static.
          - package-type: apk
            link: dynamic
    steps:
      - name: Remove existing old artifacts
        run: |
          if [[ "${{ matrix.package-type }}" == "apk" ]]; then
            rm -rf apk_${{ matrix.features }}_${{ matrix.runner }}
          else
            rm -rf ${{ matrix.features }}_${{ matrix.link }}_${{ matrix.runner }}-release
          fi

      - name: Checkout repository (for public key file)
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Download packaged artifact for this matrix
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.package-type == 'apk' && format('apk_{0}_{1}', matrix.features, matrix.runner) || format('{0}_{1}_{2}-release', matrix.features,
            matrix.link, matrix.runner) }}

      - name: List downloaded assets
        run: |
          set -ex
          ls -la
          find . -type f -print

      - name: Push to package.cosmian.com (self-hosted)
        shell: bash
        run: |
          set -ex
          if [[ "${GITHUB_REF}" =~ 'refs/tags/' ]]; then
            BRANCH="${GITHUB_REF_NAME}"
          else
            BRANCH="last_build/${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          fi
          DESTINATION_DIR=/mnt/package/kms/$BRANCH
          ssh -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa cosmian@package.cosmian.com mkdir -p "$DESTINATION_DIR"

          # Alpine apk packages have no static/dynamic-OpenSSL axis (musl libc
          # linkage is implied by --variant, not a free choice — see
          # nix/kms-server-musl.nix), so they use a flatter remote layout and a
          # different artifact/source naming scheme than the deb/rpm/dmg/
          # pkcs11-zip packages below.
          if [[ "${{ matrix.package-type }}" == "apk" ]]; then
            remote_dir="${DESTINATION_DIR}/apk/${{ matrix.cpu-arch }}/${{ matrix.features }}"
            ssh -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa cosmian@package.cosmian.com mkdir -p "$remote_dir"
            scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
              ./nix/signing-keys/cosmian-kms-public.asc \
              result-apk-server-${{ matrix.features }}/* \
              result-apk-cli-${{ matrix.features }}/* \
              cosmian@package.cosmian.com:"${remote_dir}/"
            exit 0
          fi

          # Upload artifacts from the known result directory
          RESULT_DIR="result-${{ matrix.package-type }}-${{ matrix.features }}-${{ matrix.link }}"
          RESULT_SERVER_DIR="result-server-${{ matrix.features }}-${{ matrix.link }}/bin"

          # Create remote directory
          remote_dir="${DESTINATION_DIR}/${{ matrix.package-type }}/${{ matrix.cpu-arch }}/${{ matrix.features }}/${{ matrix.link }}"
          ssh -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa cosmian@package.cosmian.com mkdir -p "$remote_dir"

          # If Linux runner
          if [[ "${{ matrix.runner }}" == ubuntu* ]]; then
            BINARY_PATTERN=linux
          else
            BINARY_PATTERN=darwin
          fi

          # If rpm package, adjust binary pattern
          if [[ "${{ matrix.package-type }}" == "rpm" ]]; then
            # if ubuntu arm64 runner
            if [[ "${{ matrix.runner }}" == "ubuntu-24.04-arm" ]]; then
              PACKAGE_PATTERN="aarch64"
            else
              PACKAGE_PATTERN="x86_64"
            fi
          else
            PACKAGE_PATTERN="${{ matrix.cpu-arch }}"
          fi

          # Map package-type to file extension (pkcs11-zip produces .zip files)
          if [[ "${{ matrix.package-type }}" == "pkcs11-zip" ]]; then
            PKG_EXT=".zip"
          else
            PKG_EXT=".${{ matrix.package-type }}"
          fi

          # Upload package files (installer packages + server binary)
          # pkcs11-zip: only upload ZIP artifacts (no server binary)
          if [[ "${{ matrix.package-type }}" == "pkcs11-zip" ]]; then
            scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
              $RESULT_DIR/*${PACKAGE_PATTERN}*${PKG_EXT}* \
              cosmian@package.cosmian.com:${remote_dir}/
          else
            scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
              ./nix/signing-keys/cosmian-kms-public.asc \
              $RESULT_DIR/*${PACKAGE_PATTERN}*${PKG_EXT}* \
              $RESULT_SERVER_DIR/*${BINARY_PATTERN}* \
              cosmian@package.cosmian.com:${remote_dir}/
          fi

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/') && matrix.link == 'static' && matrix.package-type != 'pkcs11-zip' && matrix.package-type != 'apk'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            result-${{ matrix.package-type }}-${{ matrix.features }}-${{ matrix.link }}/cosmian-kms-server*
            result-${{ matrix.package-type }}-${{ matrix.features }}-${{ matrix.link }}/cosmian-kms-cli*
            ./nix/signing-keys/cosmian-kms-public.asc

      - name: Publish GitHub Release assets (pkcs11-zip)
        if: startsWith(github.ref, 'refs/tags/') && matrix.link == 'static' && matrix.package-type == 'pkcs11-zip'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            result-pkcs11-zip-${{ matrix.features }}-${{ matrix.link }}/cosmian-pkcs11-*
            ./nix/signing-keys/cosmian-kms-public.asc

      - name: Publish GitHub Release assets (apk)
        if: startsWith(github.ref, 'refs/tags/') && matrix.package-type == 'apk'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            result-apk-server-${{ matrix.features }}/cosmian-kms-server-*
            result-apk-cli-${{ matrix.features }}/cosmian-kms-cli-*
            ./nix/signing-keys/cosmian-kms-public.asc

  publish-sbom:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'

    name: Publish SBOM ${{ matrix.features }}-${{ matrix.link }}
    needs: packages
    concurrency:
      group: publish-sbom-${{ matrix.features }}-${{ matrix.link }}
      cancel-in-progress: false
      queue: max
    runs-on: [self-hosted, not-sgx]
    container:
      image: cosmian/docker_doc_ci
      volumes:
        - /home/cosmian/.ssh/id_rsa:/root/.ssh/id_rsa

    strategy:
      fail-fast: false
      matrix:
        features: [fips, non-fips]
        link: [static, dynamic]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Download SBOM artifact
        uses: actions/download-artifact@v8
        with:
          name: sbom_${{ matrix.features }}_${{ matrix.link }}
          path: sbom

      - name: Push SBOM to package.cosmian.com
        shell: bash
        run: |
          set -ex
          if [[ "${GITHUB_REF}" =~ 'refs/tags/' ]]; then
            BRANCH="${GITHUB_REF_NAME}"
          else
            BRANCH="last_build/${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          fi
          SBOM_REMOTE_BASE="/mnt/package/kms/${BRANCH}/sbom"

          for target in server ckms; do
            remote_dir="${SBOM_REMOTE_BASE}/${target}/${{ matrix.features }}/${{ matrix.link }}"
            ssh -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
              cosmian@package.cosmian.com mkdir -p "${remote_dir}"
            scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
              sbom/${target}/${{ matrix.features }}/${{ matrix.link }}/* \
              cosmian@package.cosmian.com:"${remote_dir}/"
          done

  build-monitoring-archive:
    name: Build monitoring stack archive
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Create monitoring archive
        run: zip -r cosmian-kms-monitoring.zip monitoring/

      - name: Upload monitoring archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: cosmian-kms-monitoring
          path: cosmian-kms-monitoring.zip
          retention-days: 1
          if-no-files-found: error

  publish-monitoring:
    name: Publish monitoring stack archive
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
    needs: build-monitoring-archive
    runs-on: [self-hosted, not-sgx]
    container:
      image: cosmian/docker_doc_ci
      volumes:
        - /home/cosmian/.ssh/id_rsa:/root/.ssh/id_rsa

    steps:
      - name: Download monitoring archive artifact
        uses: actions/download-artifact@v8
        with:
          name: cosmian-kms-monitoring

      - name: Push to package.cosmian.com
        shell: bash
        run: |
          set -ex
          if [[ "${GITHUB_REF}" =~ 'refs/tags/' ]]; then
            BRANCH="${GITHUB_REF_NAME}"
          else
            BRANCH="last_build/${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          fi
          REMOTE_DIR="/mnt/package/kms/${BRANCH}/monitoring"
          ssh -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa cosmian@package.cosmian.com mkdir -p "${REMOTE_DIR}"
          scp -o 'StrictHostKeyChecking no' -i /root/.ssh/id_rsa \
            cosmian-kms-monitoring.zip \
            cosmian@package.cosmian.com:"${REMOTE_DIR}/"

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: cosmian-kms-monitoring.zip

  tests:
    needs: packages
    uses: ./.github/workflows/packaging-tests.yml
    with:
      toolchain: 1.97.0
