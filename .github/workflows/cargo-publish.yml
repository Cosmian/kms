---
name: Cargo Publish Workspace

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string
    secrets:
      token:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # This might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # All of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: ./.github/actions/cleanup-runner

      - name: Dump context for debug
        uses: crazy-max/ghaction-dump-context@v3

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt, clippy

      - name: Publishing - dry run
        if: startsWith(github.ref, 'refs/tags/') != true
        shell: bash
        run: |
          cargo publish --all-features --workspace --dry-run

      - name: Publishing
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.token }}
        run: |
          cargo publish --all-features --workspace

      - name: Check disk space after build
        if: always()
        run: df -h
