---
name: Cargo Publish Workspace

# Two jobs on two fresh runners, so no dependency code (build script, proc macro) can ever run next to the
# registry token:
#   verify  — builds the whole workspace package set (`--dry-run` compiles); holds NO credential.
#   publish — tags only, environment `crates-io` (required reviewers; the CRATES_IO secret lives ONLY in that
#             environment, so callers never hold it); `--no-verify` skips compilation. Cargo repackages the same immutable commit: it does not upload verify's tarballs.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify publication (no credential)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          # This might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # All of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: ./.github/actions/cleanup-runner

      - uses: ./.github/actions/install-rust

      - name: Probe that dependency code receives no release credential
        run: python3 .mise/scripts/dev/test_release_security.py --probe "$GITHUB_WORKSPACE"

      - name: Publishing - dry run (compiles every crate)
        run: cargo publish --all-features --workspace --dry-run

      - name: Check disk space after build
        if: always()
        run: df -h

  publish:
    name: Publish to crates.io
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - uses: ./.github/actions/install-rust

      # Nothing is compiled here: --no-verify skips the build that would run dependency code.
      - name: Publishing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO }}
        run: cargo publish --all-features --workspace --no-verify
