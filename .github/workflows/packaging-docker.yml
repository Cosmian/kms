---
name: Packaging - Docker

on:
  workflow_call:
    inputs:
      toolchain:
        required: true
        type: string
        default: 1.97.0
  workflow_dispatch:
    inputs:
      toolchain:
        description: Rust toolchain to use (e.g., stable, nightly-YYYY-MM-DD)
        required: true
        type: string
        default: 1.97.0

jobs:
  nix-docker-image:
    name: docker-${{ matrix.features }}-${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: docker-test-${{ matrix.features }}-${{ matrix.runner }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
      id-token: write # Required for cosign keyless signing
    strategy:
      fail-fast: false
      matrix:
        features: [fips, non-fips]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Derive architecture from runner
        id: arch
        run: |
          set -euo pipefail
          if [[ "${{ matrix.runner }}" == *arm* ]]; then
            echo "arch=arm64" >> "$GITHUB_OUTPUT"
            echo "platform=linux/arm64" >> "$GITHUB_OUTPUT"
            echo "suffix=-arm64" >> "$GITHUB_OUTPUT"
          else
            echo "arch=amd64" >> "$GITHUB_OUTPUT"
            echo "platform=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "suffix=-amd64" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-nix

      - uses: ./.github/actions/install-mise

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Extract base Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ (matrix.features == 'fips' && 'ghcr.io/cosmian/kms-fips' || 'ghcr.io/cosmian/kms') }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Append arch suffix to tags
        id: arch_tags
        run: |
          set -euo pipefail
          echo "tags_with_arch<<EOF" >> $GITHUB_OUTPUT
          while IFS= read -r t; do
            [ -n "$t" ] && echo "${t}${{ steps.arch.outputs.suffix }}" >> $GITHUB_OUTPUT
          done <<< "${{ steps.meta.outputs.tags }}"
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and load Docker image
        id: build
        run: |
          mise run build:docker --variant ${{ matrix.features }} --load

      - name: Get image name and digest
        id: image_info
        run: |
          set -euo pipefail
          # Extract the image name and tag from the loaded image
          IMAGE_INFO=$(docker images --format "{{.Repository}}:{{.Tag}} {{.ID}}" | grep "cosmian-kms" | head -n1)
          IMAGE_NAME=$(echo "$IMAGE_INFO" | awk '{print $1}')
          IMAGE_ID=$(echo "$IMAGE_INFO" | awk '{print $2}')
          echo "Original image: $IMAGE_NAME (ID: $IMAGE_ID)"
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "image_id=$IMAGE_ID" >> $GITHUB_OUTPUT

      - name: Tag and push images
        id: push
        env:
          TAGS: ${{ steps.arch_tags.outputs.tags_with_arch }}
          IMAGE_NAME: ${{ steps.image_info.outputs.image_name }}
        run: |
          set -euo pipefail
          DIGEST=""
          for tag in ${TAGS}; do
            echo "Tagging and pushing: $tag"
            docker tag "$IMAGE_NAME" "$tag"
            docker push "$tag"

            # Get the digest from the first push
            if [ -z "$DIGEST" ]; then
              DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$tag" | cut -d'@' -f2)
              echo "digest=$DIGEST" >> $GITHUB_OUTPUT
            fi
          done

      - name: Sign Docker images with Cosign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.arch_tags.outputs.tags_with_arch }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}

      - name: Select test tag
        id: pick_test_tag
        run: |
          first=$(echo "${{ steps.arch_tags.outputs.tags_with_arch }}" | head -n1)
          echo "test_tag=$first" >> $GITHUB_OUTPUT

          # Ensure the test tag is available locally for testing
          # The image was loaded as cosmian-kms:VERSION-VARIANT, tag it with the GHCR name for the test
          echo "Tagging local image for test: ${{ steps.image_info.outputs.image_name }} -> $first"
          docker tag "${{ steps.image_info.outputs.image_name }}" "$first"

      # - name: Connect to Netbird (non-fips amd64 only)
      #   if: matrix.features == 'non-fips' && matrix.runner == 'ubuntu-24.04'
      #   env:
      #     NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
      #   run: |
      #     curl -fsSL https://pkgs.netbird.io/install.sh | sh
      #     [[ -n "${NETBIRD_SETUP_KEY}" ]] || { echo "ERROR: NETBIRD_SETUP_KEY secret is not set"; exit 1; }
      #     sudo netbird up \
      #       --setup-key "${NETBIRD_SETUP_KEY}" \
      #       --management-url https://netbird.cosmian.com \
      #       --log-level warning \
      #       --allow-server-ssh \
      #       --enable-ssh-root \
      #       --disable-ssh-auth \
      #       --enable-rosenpass=false
      #     timeout 60 bash -c 'until ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 ec2-user@oracle.netbird.selfhosted true 2>/dev/null; do sleep 2; done' \
      #       || { echo "ERROR: oracle.netbird.selfhosted not reachable via SSH after 60s"; netbird status; exit 1; }
      #     echo "Connected to Netbird, oracle host is reachable"

      - name: Test Docker image
        env:
          DOCKER_IMAGE_NAME: ${{ steps.pick_test_tag.outputs.test_tag }}
          ORACLE_KMS_DEMO_USER_PASS: ${{ secrets.ORACLE_KMS_DEMO_USER_PASS }}
          COSMIAN_HSM_PIN: ${{ secrets.COSMIAN_HSM_PIN }}
        run: |
          mise run test:docker --variant ${{ matrix.features }}

      # - name: Oracle TDE remote upgrade and smoke test
      #   if: matrix.features == 'non-fips' && matrix.runner == 'ubuntu-24.04'
      #   env:
      #     DOCKER_IMAGE_NAME: ${{ steps.pick_test_tag.outputs.test_tag }}
      #     ORACLE_KMS_DEMO_USER_PASS: ${{ secrets.ORACLE_KMS_DEMO_USER_PASS }}
      #     COSMIAN_HSM_PIN: ${{ secrets.COSMIAN_HSM_PIN }}
      #   run: |
      #     mise run test:docker-oracle

      # - name: Disconnect from Netbird (non-fips amd64 only)
      #   if: always() && matrix.features == 'non-fips' && matrix.runner == 'ubuntu-24.04'
      #   run: netbird down || true

      - name: Select tag for output
        id: pick
        run: |
          first=$(echo "${{ steps.arch_tags.outputs.tags_with_arch }}" | head -n1)
          echo "first_tag=$first" >> $GITHUB_OUTPUT

    outputs:
      arch-tag: ${{ steps.pick.outputs.first_tag }}
      arch: ${{ steps.arch.outputs.arch }}

  nix-docker-manifest:
    name: docker-${{ matrix.features }}-manifest
    needs: nix-docker-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # Required for cosign keyless signing
    strategy:
      fail-fast: false
      matrix:
        features: [fips, non-fips]
    env:
      REGISTRY_IMAGE: ${{ (matrix.features == 'fips' && 'ghcr.io/cosmian/kms-fips' || 'ghcr.io/cosmian/kms') }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create and push manifest list
        id: manifest
        run: |
          set -euo pipefail
          echo "Tags to manifest:"; echo "${{ steps.meta.outputs.tags }}"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Creating manifest for $tag"
            docker buildx imagetools create \
              --tag "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"

            # Get the manifest digest
            DIGEST=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r '.digest')
            echo "manifest_digest_${tag##*:}=$DIGEST" >> $GITHUB_OUTPUT

            docker buildx imagetools inspect "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Sign multi-arch manifest with Cosign
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag} "
          done
          cosign sign --yes ${images}

  # ── Kubernetes Operator Docker image ──────────────────────────────────────

  k8s-operator-image:
    name: k8s-operator-${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: k8s-operator-docker-${{ matrix.runner }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Derive architecture from runner
        id: arch
        run: |
          if [[ "${{ matrix.runner }}" == *arm* ]]; then
            echo "arch=arm64" >> "$GITHUB_OUTPUT"
            echo "suffix=-arm64" >> "$GITHUB_OUTPUT"
          else
            echo "arch=amd64" >> "$GITHUB_OUTPUT"
            echo "suffix=-amd64" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-nix

      - uses: ./.github/actions/install-mise

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/cosmian/kms-operator
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and load Operator image
        run: mise run build:k8s-operator-image --load

      - name: Smoke test Operator image
        run: mise run test:k8s-operator-image

      - name: Tag and push Operator image
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        run: |
          set -euo pipefail
          IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "cosmian-kms-operator" | head -1)
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            ARCH_TAG="${tag}${{ steps.arch.outputs.suffix }}"
            docker tag "$IMAGE" "$ARCH_TAG"
            docker push "$ARCH_TAG"
          done <<< "${{ steps.meta.outputs.tags }}"

  # ── Kubernetes CSI Provider Docker image ──────────────────────────────────

  k8s-csi-provider-image:
    name: k8s-csi-provider-${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: k8s-csi-provider-docker-${{ matrix.runner }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Derive architecture from runner
        id: arch
        run: |
          if [[ "${{ matrix.runner }}" == *arm* ]]; then
            echo "arch=arm64" >> "$GITHUB_OUTPUT"
            echo "suffix=-arm64" >> "$GITHUB_OUTPUT"
          else
            echo "arch=amd64" >> "$GITHUB_OUTPUT"
            echo "suffix=-amd64" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-nix

      - uses: ./.github/actions/install-mise

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/cosmian/kms-csi-provider
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and load CSI Provider image
        run: mise run build:k8s-csi-provider-image --load

      - name: Smoke test CSI Provider image
        run: mise run test:k8s-csi-provider-image

      - name: Tag and push CSI Provider image
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        run: |
          set -euo pipefail
          IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "cosmian-kms-csi-provider" | head -1)
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            ARCH_TAG="${tag}${{ steps.arch.outputs.suffix }}"
            docker tag "$IMAGE" "$ARCH_TAG"
            docker push "$ARCH_TAG"
          done <<< "${{ steps.meta.outputs.tags }}"
