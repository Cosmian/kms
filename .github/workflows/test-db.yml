---
name: Test db

# One job per database backend (a leaf of .mise/tasks/test/db), so a slow or hung backend never blocks the others.
on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME: {required: false}
      DOCKERHUB_TOKEN: {required: false}

jobs:
  leaf:
    name: Test db ${{ matrix.leaf }} (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {leaf: sqlite, variant: fips}
          - {leaf: sqlite, variant: non-fips}
          - {leaf: psql, variant: fips}
          - {leaf: psql, variant: non-fips}
          - {leaf: mysql, variant: fips}
          - {leaf: mysql, variant: non-fips}
          - {leaf: mariadb, variant: fips}
          - {leaf: mariadb, variant: non-fips}
          - {leaf: percona, variant: fips}
          - {leaf: percona, variant: non-fips}
          # redis (Findex) is non-FIPS only
          - {leaf: redis, variant: non-fips}
    uses: ./.github/workflows/test-group.yml
    with:
      suite: db:${{ matrix.leaf }}
      variant: ${{ matrix.variant }}
      extra-env: |
        POSTGRES_USER=kms
        PGUSER=kms
        POSTGRES_PASSWORD=kms
        POSTGRES_DB=kms
        POSTGRES_HOST=localhost
        POSTGRES_PORT=5432
        KMS_POSTGRES_URL=postgresql://kms:kms@127.0.0.1:5432/kms
        MYSQL_DATABASE=kms
        MYSQL_ROOT_PASSWORD=kms
        MYSQL_HOST=localhost
        MYSQL_PORT=3306
        KMS_MYSQL_URL=mysql://root:kms@localhost:3306/kms
        PERCONA_HOST=localhost
        PERCONA_PORT=3307
        KMS_PERCONA_URL=mysql://root:kms@localhost:3307/kms
        MARIADB_HOST=localhost
        MARIADB_PORT=3308
        KMS_MARIADB_URL=mysql://root:kms@localhost:3308/kms
        KMS_SQLITE_PATH=data/shared
        REDIS_HOST=localhost
        REDIS_PORT=6379
        KMS_REDIS_URL=redis://localhost:6379
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
