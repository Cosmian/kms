---
name: Benchmark

# The seven benchmarks (see .mise/tasks/bench/README.md), selectable one at a time with `benchmark`:
#   software             bench:load                          -> ckms_bench
#   hsm-kek              bench:hsm                           -> ckms_bench_hsm_kek_softhsm2
#   hsm-delegated        bench:hsm --delegated               -> ckms_bench_hsm_delegated_softhsm2
#   pkcs11               bench:pkcs11                        -> ckms_bench_pkcs11
#   pkcs11-hsm-delegated bench:pkcs11 --delegated            -> ckms_bench_pkcs11_hsm_delegated_softhsm2
#   jose-cache           bench:jose-cache                    -> ckms_bench_jose_cache_on / _off
#   jose-cek-switch      bench:jose-cek-switch               -> ckms_bench_jose_cek_switch_kryoptic
# `all` runs the seven. Only `software` supports `server_version` (a released version).

on:
  # Called by other workflows (e.g. the release workflow) to record a baseline.
  workflow_call:
    inputs:
      server_version:
        description: KMS server version to benchmark (e.g. 5.24.0); omit to build from the selected branch
        required: false
        default: ''
        type: string
      variant:
        description: Build variant (fips|non-fips)
        required: false
        default: non-fips
        type: string
      bench_mode:
        description: Benchmark mode (all|encrypt|key-creation|sign-verify|batch)
        required: false
        default: all
        type: string
      benchmark:
        description: Benchmark to run (all|software|hsm-kek|hsm-delegated|pkcs11|pkcs11-hsm-delegated|jose-cache|jose-cek-switch)
        required: false
        default: all
        type: string
      bench_label:
        description: Run label of the jose-cek-switch report (e.g. before, after)
        required: false
        default: ci
        type: string

  # Manual trigger from the GitHub UI.
  workflow_dispatch:
    inputs:
      benchmark:
        description: Benchmark to run
        required: true
        type: choice
        default: all
        options:
          - all
          - software
          - hsm-kek
          - hsm-delegated
          - pkcs11
          - pkcs11-hsm-delegated
          - jose-cache
          - jose-cek-switch
      server_version:
        description: KMS server version to benchmark (e.g. 5.24.0; software benchmark only); omit to build from the selected branch
        required: false
        type: string
        default: ''
      variant:
        description: Build variant (fips|non-fips)
        required: false
        type: choice
        default: non-fips
        options:
          - non-fips
          - fips
      bench_mode:
        description: Benchmark mode (ignored by jose-cache; pkcs11 only supports all|encrypt|key-creation and falls back to all)
        required: false
        type: choice
        default: all
        options:
          - all
          - encrypt
          - key-creation
          - sign-verify
          - batch
      bench_label:
        description: Run label of the jose-cek-switch report (e.g. before, after)
        required: false
        default: ci
        type: string

  # Nightly on the default branch (develop; schedules only run there): benchmark develop (software
  # benchmark only) and compare it against the last released version.
  schedule:
    - cron: 0 2 * * * # Daily at 02:00 UTC

jobs:
  # ── Job 1: run the selected benchmark(s) ───────────────────────────────────
  benchmark:
    name: Benchmark KMS ${{ inputs.server_version || github.ref_name }} (${{ inputs.variant || 'non-fips' }}, ${{ inputs.benchmark || 'software' }})
    # Benchmarks require a stable, dedicated machine to produce comparable results.
    # See https://github.com/Cosmian/kms/issues/776
    # Forks have no self-hosted benchmark runner: do not queue the nightly there.
    if: github.event_name != 'schedule' || github.repository == 'Cosmian/kms'
    runs-on: [self-hosted, benchmark]
    timeout-minutes: 600
    permissions:
      contents: read
    concurrency:
      # One group per benchmark: running two different benchmarks never cancels the other.
      group: benchmark-${{ inputs.server_version || github.ref_name }}-${{ inputs.variant || 'non-fips' }}-${{ inputs.benchmark || 'software' }}
      cancel-in-progress: true
    env:
      # Prefixed WF_ on purpose: the mise bench tasks read BENCH_* variables from the environment.
      WF_BENCHMARK: ${{ inputs.benchmark || 'all' }}
      WF_SERVER_VERSION: ${{ inputs.server_version }}
      WF_VARIANT: ${{ inputs.variant || 'non-fips' }}
      WF_MODE: ${{ inputs.bench_mode || 'all' }}
      WF_LABEL: ${{ inputs.bench_label || 'ci' }}
    outputs:
      run_software: ${{ steps.select.outputs.run_software }}

    steps:
      # Single place deciding what runs; every later step only tests its `run_*` output.
      - name: Select benchmarks
        id: select
        shell: bash
        run: |
          set -euo pipefail
          all="software hsm-kek hsm-delegated pkcs11 pkcs11-hsm-delegated jose-cache jose-cek-switch"
          bench="${WF_BENCHMARK}"
          if [[ "${bench}" != all && " ${all} " != *" ${bench} "* ]]; then
            echo "::error::Unknown benchmark '${bench}' (expected: all ${all})"
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == schedule ]]; then
            # Nightly: only the software baseline is published and compared against the last release.
            bench=software
          elif [[ -n "${WF_SERVER_VERSION}" ]]; then
            # Only bench:load can benchmark a released version (--server-version); the others always
            # benchmark the checked-out code and would publish it under that version.
            case "${bench}" in
              all | software) bench=software ;;
              *)
                echo "::error::Benchmark '${bench}' cannot run against server_version '${WF_SERVER_VERSION}': only 'software' supports it."
                exit 1
                ;;
            esac
          fi
          # bench:pkcs11 --mode accepts a narrower set than the other tasks (no sign-verify/batch).
          pkcs11_mode="${WF_MODE}"
          case "${pkcs11_mode}" in
            all | encrypt | key-creation) ;;
            *)
              echo "NOTE: bench_mode '${pkcs11_mode}' is not a valid bench:pkcs11 mode; using 'all' instead."
              pkcs11_mode=all
              ;;
          esac
          # Report folders written by the selected benchmarks (bench:hsm/bench:pkcs11 default to softhsm2).
          declare -A dir_of=(
            [software]="ckms_bench"
            [hsm-kek]="ckms_bench_hsm_kek_softhsm2"
            [hsm-delegated]="ckms_bench_hsm_delegated_softhsm2"
            [pkcs11]="ckms_bench_pkcs11"
            [pkcs11-hsm-delegated]="ckms_bench_pkcs11_hsm_delegated_softhsm2"
            [jose-cache]="ckms_bench_jose_cache_on ckms_bench_jose_cache_off"
            [jose-cek-switch]="ckms_bench_jose_cek_switch_kryoptic"
          )
          report_dirs=()
          for b in ${all}; do
            if [[ "${bench}" == all || "${bench}" == "${b}" ]]; then
              # shellcheck disable=SC2206 # dir_of values are space-separated folder names
              report_dirs+=(${dir_of[${b}]})
            fi
          done
          {
            for b in ${all}; do
              if [[ "${bench}" == all || "${bench}" == "${b}" ]]; then
                echo "run_${b//-/_}=true"
              else
                echo "run_${b//-/_}=false"
              fi
            done
            echo "pkcs11_mode=${pkcs11_mode}"
            echo "report_dirs=${report_dirs[*]}"
            echo "from_source=$([[ -z "${WF_SERVER_VERSION}" ]] && echo true || echo false)"
          } | tee -a "${GITHUB_OUTPUT}"

      - name: Clean workspace (fix self-hosted runner permission issues)
        run: sudo chown -R "$USER:$USER" "$GITHUB_WORKSPACE" || true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          clean: false

      # The report folders are checked in: delete the selected ones so that a stale copy can never be
      # mistaken for (and published as) the result of this run. clean: false keeps the working tree otherwise.
      - name: Remove checked-in reports of the selected benchmarks
        shell: bash
        env:
          REPORT_DIRS: ${{ steps.select.outputs.report_dirs }}
        run: |
          set -euo pipefail
          for d in ${REPORT_DIRS}; do rm -rf -- "documentation/docs/benchmarks/${d}"; done

      - uses: ./.github/actions/install-rust

      - uses: ./.github/actions/install-mise

      # Every benchmark built from source runs inside nix-shell (bench:load and bench:jose-cache are
      # wrapped below; bench:hsm and bench:pkcs11 re-enter it themselves). The self-hosted runner keeps
      # /nix between runs and the installer aborts on an existing install, so only install when
      # nix-shell is missing.
      - name: Detect Nix
        id: nix
        if: steps.select.outputs.from_source == 'true'
        run: |
          NIX_BIN=/nix/var/nix/profiles/default/bin
          if [[ -x "$NIX_BIN/nix-shell" ]]; then
            echo "$NIX_BIN" >> "$GITHUB_PATH"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-nix
        if: steps.select.outputs.from_source == 'true' && steps.nix.outputs.present != 'true'

      - name: Install system dependencies
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq \
              jq bc curl pkg-config libssl-dev python3 python3-matplotlib gnuplot softhsm2
          elif command -v brew >/dev/null 2>&1; then
            brew install jq bc openssl pkg-config python3 gnuplot softhsm
          fi

      - name: Run software baseline benchmark (bench:load)
        if: steps.select.outputs.run_software == 'true'
        run: |
          ARGS=(--variant "${WF_VARIANT}" --mode "${WF_MODE}" --criterion)
          if [[ -n "${WF_SERVER_VERSION}" ]]; then
            mise run bench:load "${ARGS[@]}" --server-version "${WF_SERVER_VERSION}"
          else
            # Outside nix-shell, crate/crypto/build.rs silently falls back to the runner's system OpenSSL 3.0.13
            # (no ML-KEM/ML-DSA/SLH-DSA/AES-GCM-SIV): those benchmarks are skipped and cannot be compared.
            nix-shell shell.nix --argstr variant "${WF_VARIANT}" \
              --run "mise run bench:load ${ARGS[*]@Q}"
          fi

      - name: Run HSM-backed KEK benchmark (bench:hsm)
        if: steps.select.outputs.run_hsm_kek == 'true'
        run: mise run bench:hsm --variant "${WF_VARIANT}" --mode "${WF_MODE}" --criterion

      - name: Run HSM-delegated crypto benchmark (bench:hsm --delegated)
        if: steps.select.outputs.run_hsm_delegated == 'true'
        run: mise run bench:hsm --delegated --variant "${WF_VARIANT}" --mode "${WF_MODE}" --criterion

      - name: Run PKCS#11 benchmark (bench:pkcs11)
        if: steps.select.outputs.run_pkcs11 == 'true'
        env:
          PKCS11_MODE: ${{ steps.select.outputs.pkcs11_mode }}
        run: mise run bench:pkcs11 --variant "${WF_VARIANT}" --mode "${PKCS11_MODE}" --criterion

      - name: Run HSM-delegated PKCS#11 benchmark (bench:pkcs11 --delegated)
        if: steps.select.outputs.run_pkcs11_hsm_delegated == 'true'
        env:
          PKCS11_MODE: ${{ steps.select.outputs.pkcs11_mode }}
        run: mise run bench:pkcs11 --delegated --variant "${WF_VARIANT}" --mode "${PKCS11_MODE}" --criterion

      # Starts its own two servers (JOSE CEK cache on, then off); has no --mode/--criterion.
      - name: Run JOSE caches benchmark (bench:jose-cache)
        if: steps.select.outputs.run_jose_cache == 'true'
        run: |
          nix-shell shell.nix --argstr variant "${WF_VARIANT}" \
            --run "mise run bench:jose-cache --variant ${WF_VARIANT}"

      # Starts its own KMS servers sharing one Kryoptic token (re-enters nix-shell itself, like bench:hsm);
      # fails when the 2,500 JWE/s target, 0 errors or post-switch recovery is not met (performance gate).
      - name: Run JOSE CEK switch benchmark (bench:jose-cek-switch)
        if: steps.select.outputs.run_jose_cek_switch == 'true'
        run: |
          # The self-hosted workspace persists: drop the runs of earlier workflows so the report holds this run only.
          rm -rf target/cek-switch target/*/cek-switch
          mise run bench:jose-cek-switch --variant "${WF_VARIANT}" --label "${WF_LABEL}"

      # Stage only the reports of the selected benchmarks: documentation/docs/benchmarks/ also holds the
      # checked-in reports of every other benchmark, which must not be republished under this version.
      # The selected folders were deleted after checkout, so a missing one means the benchmark did not
      # write it (bench_generate_report returns 0 without touching the docs when plotting fails).
      - name: Collect benchmark reports
        if: always()
        shell: bash
        env:
          REPORT_DIRS: ${{ steps.select.outputs.report_dirs }}
        run: |
          set -euo pipefail
          src=documentation/docs/benchmarks
          dst="${RUNNER_TEMP}/benchmark-reports"
          rm -rf "${dst}"
          mkdir -p "${dst}"
          missing=0
          for d in ${REPORT_DIRS}; do
            if [[ -d "${src}/${d}" ]]; then
              cp -r "${src}/${d}" "${dst}/"
            else
              echo "::error::Expected report folder ${src}/${d} was not generated"
              missing=1
            fi
          done
          ls -1 "${dst}"
          exit "${missing}"

      - name: Upload benchmark report folder
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-report-${{ inputs.server_version || github.ref_name }}-${{ inputs.variant || 'non-fips' }}-${{ inputs.benchmark || 'software'
            }}
          path: ${{ runner.temp }}/benchmark-reports
          if-no-files-found: error
          retention-days: 30

  # ── Job 2: publish benchmark report to package.cosmian.com ────────────────
  publish:
    name: Publish to package.cosmian.com
    needs: benchmark
    runs-on: [self-hosted, not-sgx]
    permissions:
      contents: read
    container:
      image: cosmian/docker_doc_ci
      volumes:
        - /home/cosmian/.ssh/id_rsa:/root/.ssh/id_rsa

    steps:
      - name: Download benchmark artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: benchmark-report-${{ inputs.server_version || github.ref_name }}-${{ inputs.variant || 'non-fips' }}-${{ inputs.benchmark || 'software'
            }}
          path: report

      - name: Push benchmark report to package.cosmian.com
        shell: bash
        env:
          VERSION_DIR: ${{ inputs.server_version || github.ref_name }}
          KNOWN_HOSTS: ${{ vars.PACKAGE_COSMIAN_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${KNOWN_HOSTS:?Package server SSH host key is not configured (vars.PACKAGE_COSMIAN_SSH_KNOWN_HOSTS)}"
          known_hosts=$(mktemp)
          trap 'rm -f "${known_hosts}"' EXIT
          printf '%s\n' "${KNOWN_HOSTS}" > "${known_hosts}"
          REMOTE_DIR="/mnt/package/kms/${VERSION_DIR}/benchmarks"
          SSH_OPTS=(-o StrictHostKeyChecking=yes -o "UserKnownHostsFile=${known_hosts}" -o BatchMode=yes -i /root/.ssh/id_rsa)

          printf 'mkdir -p -- %q\n' "${REMOTE_DIR}" | ssh "${SSH_OPTS[@]}" cosmian@package.cosmian.com bash

          # Copy the staged report folders (report.md + load/ + criterion/ SVGs + raw JSON).
          # Use tar-over-ssh instead of `scp dir/.` — newer OpenSSH (SFTP mode)
          # rejects the trailing-dot trick with "unexpected filename: .".
          tar -C report -cf - . | ssh "${SSH_OPTS[@]}" cosmian@package.cosmian.com "tar -xf - -C '${REMOTE_DIR}'"

          echo ""
          echo "Published:"
          for d in report/*/; do
            echo "  https://package.cosmian.com/kms/${VERSION_DIR}/benchmarks/$(basename "${d}")/report.md"
          done

  # ── Job 3: compare the published report against the last released version ──
  # Runs for every build-from-source run that benchmarked the software baseline (nightly develop,
  # manual branch runs); skipped when a released version is itself being benchmarked (nothing to
  # compare it against here) or when the selected benchmark does not produce ckms_bench.
  compare:
    name: Compare against last release
    needs: [benchmark, publish]
    # Published paths carry no variant, so only the non-fips report is comparable to the release baseline.
    if: >-
      inputs.server_version == ''
      && (inputs.variant || 'non-fips') == 'non-fips'
      && needs.benchmark.outputs.run_software == 'true'
    runs-on: [self-hosted, benchmark]
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: false

      - uses: ./.github/actions/install-mise

      # Highest released X.Y.Z listed on package.cosmian.com that has a published ckms_bench report.
      - name: Find last released version
        id: base
        shell: bash
        run: |
          set -euo pipefail
          URL=https://package.cosmian.com/kms
          for v in $(curl -fsSL "${URL}/" | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -rV); do
            if curl -fsSI -o /dev/null "${URL}/${v}/benchmarks/ckms_bench/env.json"; then
              echo "Last released version with benchmarks: ${v}"
              echo "version=${v}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done
          echo "::error::No released version with a published ckms_bench report"
          exit 1

      - name: Compare benchmark reports
        env:
          BASE_VERSION: ${{ steps.base.outputs.version }}
        run: |
          mise run bench:compare "${BASE_VERSION}" "${GITHUB_REF_NAME}" 5 --fail \
            --output target/bench_compare/report.md

      - name: Publish comparison to the job summary
        if: always()
        run: '[[ -f target/bench_compare/report.md ]] && cat target/bench_compare/report.md >> "${GITHUB_STEP_SUMMARY}" || true'

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-compare-${{ github.ref_name }}
          path: target/bench_compare/report.md
          if-no-files-found: ignore
          retention-days: 30
