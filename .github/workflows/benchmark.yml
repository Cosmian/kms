---
name: Benchmark

on:
  # Called by other workflows (e.g. the release workflow) to record a baseline.
  workflow_call:
    inputs:
      server_version:
        description: KMS server version to benchmark (e.g. 5.24.0); omit to build from the selected branch
        required: false
        default: ''
        type: string
      variant:
        description: Build variant (fips|non-fips)
        required: false
        default: non-fips
        type: string
      bench_mode:
        description: Benchmark mode (all|encrypt|key-creation|sign-verify|batch)
        required: false
        default: all
        type: string

  # Manual trigger from the GitHub UI.
  workflow_dispatch:
    inputs:
      server_version:
        description: KMS server version to benchmark (e.g. 5.24.0); omit to build from the selected branch
        required: false
        type: string
        default: ''
      variant:
        description: Build variant (fips|non-fips)
        required: false
        type: string
        default: non-fips
      bench_mode:
        description: Benchmark mode (all|encrypt|key-creation|sign-verify|batch)
        required: false
        type: string
        default: all

  # Nightly on the default branch (develop; schedules only run there): benchmark develop and
  # compare it against the last released version. Inputs are empty on this trigger, so the
  # `inputs.* ||` defaults below select non-fips / all.
  schedule:
    - cron: 0 2 * * * # Daily at 02:00 UTC

jobs:
  # ── Job 1: run the benchmark suite ─────────────────────────────────────────
  benchmark:
    name: Benchmark KMS ${{ inputs.server_version || github.ref_name }} (${{ inputs.variant || 'non-fips' }})
    # Benchmarks require a stable, dedicated machine to produce comparable results.
    # See https://github.com/Cosmian/kms/issues/776
    # Forks have no self-hosted benchmark runner: do not queue the nightly there.
    if: github.event_name != 'schedule' || github.repository == 'Cosmian/kms'
    runs-on: [self-hosted, benchmark]
    timeout-minutes: 600
    concurrency:
      group: benchmark-${{ inputs.server_version || github.ref_name }}-${{ inputs.variant || 'non-fips' }}
      cancel-in-progress: true

    steps:
      - name: Clean workspace (fix self-hosted runner permission issues)
        run: sudo chown -R "$USER:$USER" "$GITHUB_WORKSPACE" || true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          clean: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: ./.github/actions/install-mise

      # bench:load (built from source), bench:hsm and bench:pkcs11 run inside nix-shell (not preinstalled on the benchmark runner).
      - uses: ./.github/actions/setup-nix
        if: inputs.server_version == ''

      - name: Install system dependencies
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq \
              jq bc curl pkg-config libssl-dev python3 python3-matplotlib gnuplot softhsm2
          elif command -v brew >/dev/null 2>&1; then
            brew install jq bc openssl pkg-config python3 gnuplot softhsm
          fi

      - name: Run software baseline benchmark (bench:load)
        run: |
          ARGS=(--variant "${{ inputs.variant || 'non-fips' }}" --mode "${{ inputs.bench_mode || 'all' }}" --criterion)
          if [[ -n "${{ inputs.server_version }}" ]]; then
            mise run bench:load "${ARGS[@]}" --server-version "${{ inputs.server_version }}"
          else
            # Outside nix-shell, crate/crypto/build.rs silently falls back to the runner's system OpenSSL 3.0.13
            # (no ML-KEM/ML-DSA/SLH-DSA/AES-GCM-SIV): those benchmarks are skipped and cannot be compared.
            nix-shell shell.nix --argstr variant "${{ inputs.variant || 'non-fips' }}" \
              --run "mise run bench:load ${ARGS[*]@Q}"
          fi

      # The steps below always benchmark the checked-out code (no --server-version support), so
      # running them for a released version would publish checkout numbers under that version.
      - name: Run HSM-backed KEK benchmark (bench:hsm)
        if: inputs.server_version == '' && github.event_name != 'schedule'
        run: |
          mise run bench:hsm \
            --variant "${{ inputs.variant || 'non-fips' }}" \
            --mode "${{ inputs.bench_mode || 'all' }}" \
            --criterion

      - name: Run HSM-delegated crypto benchmark (bench:hsm --delegated)
        if: inputs.server_version == '' && github.event_name != 'schedule'
        run: |
          mise run bench:hsm --delegated \
            --variant "${{ inputs.variant || 'non-fips' }}" \
            --mode "${{ inputs.bench_mode || 'all' }}" \
            --criterion

      - name: Run PKCS#11 benchmark (bench:pkcs11)
        if: inputs.server_version == '' && github.event_name != 'schedule'
        run: |
          # bench:pkcs11's --mode choices are a different, narrower set than the other
          # three tasks (no "sign-verify"/"batch"). Fall back to "all" when the shared
          # bench_mode input picked one of those two, instead of failing the whole job.
          PKCS11_MODE="${{ inputs.bench_mode || 'all' }}"
          case "${PKCS11_MODE}" in
            all | encrypt | key-creation) ;;
            *)
              echo "NOTE: bench_mode '${PKCS11_MODE}' is not a valid bench:pkcs11 mode; using 'all' instead."
              PKCS11_MODE="all"
              ;;
          esac
          mise run bench:pkcs11 \
            --variant "${{ inputs.variant || 'non-fips' }}" \
            --mode "${PKCS11_MODE}" \
            --criterion

      - name: Run HSM-delegated PKCS#11 benchmark (bench:pkcs11 --delegated)
        if: inputs.server_version == '' && github.event_name != 'schedule'
        run: |
          # Same PKCS11_MODE fallback logic for the delegated step
          PKCS11_MODE_DELEGATED="${{ inputs.bench_mode || 'all' }}"
          case "${PKCS11_MODE_DELEGATED}" in
            all | encrypt | key-creation) ;;
            *)
              echo "NOTE: bench_mode '${PKCS11_MODE_DELEGATED}' is not a valid bench:pkcs11 mode; using 'all' instead."
              PKCS11_MODE_DELEGATED="all"
              ;;
          esac
          mise run bench:pkcs11 --delegated \
            --variant "${{ inputs.variant || 'non-fips' }}" \
            --mode "${PKCS11_MODE_DELEGATED}" \
            --criterion


      - name: Upload benchmark report folder
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-report-${{ inputs.server_version || github.ref_name }}-${{ inputs.variant || 'non-fips' }}
          # Reports generated per HSM backend: ckms_bench/, ckms_bench_hsm_kek_<backend>/,
          # ckms_bench_hsm_delegated_<backend>/, ckms_bench_pkcs11/, ckms_bench_pkcs11_hsm_delegated_<backend>/
          # mirroring the existing pattern in .github/workflows/flamegraph.yml.
          path: documentation/docs/benchmarks/
          retention-days: 30

  # ── Job 2: publish benchmark report to package.cosmian.com ────────────────
  publish:
    name: Publish to package.cosmian.com
    needs: benchmark
    runs-on: [self-hosted, not-sgx]
    container:
      image: cosmian/docker_doc_ci
      volumes:
        - /home/cosmian/.ssh/id_rsa:/root/.ssh/id_rsa

    steps:
      - name: Download benchmark artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: benchmark-report-${{ inputs.server_version || github.ref_name }}-${{ inputs.variant || 'non-fips' }}
          path: report

      - name: Push benchmark report to package.cosmian.com
        shell: bash
        run: |
          set -ex
          REMOTE_DIR="/mnt/package/kms/${{ inputs.server_version || github.ref_name }}/benchmarks"
          SSH_OPTS="-o StrictHostKeyChecking=no -i /root/.ssh/id_rsa"

          # Create remote directory.
          ssh ${SSH_OPTS} cosmian@package.cosmian.com mkdir -p "${REMOTE_DIR}"

          # Copy the full report folder (report.md + load/ + criterion/ SVGs + raw JSON).
          # Use tar-over-ssh instead of `scp dir/.` — newer OpenSSH (SFTP mode)
          # rejects the trailing-dot trick with "unexpected filename: .".
          tar -C report -cf - . | ssh ${SSH_OPTS} cosmian@package.cosmian.com "tar -xf - -C '${REMOTE_DIR}'"

          echo ""
          echo "Published:"
          echo "  https://package.cosmian.com/kms/${{ inputs.server_version || github.ref_name }}/benchmarks/ckms_bench/report.md"
          echo "  https://package.cosmian.com/kms/${{ inputs.server_version || github.ref_name }}/benchmarks/ckms_bench_hsm_kek_softhsm2/report.md"
          echo "  https://package.cosmian.com/kms/${{ inputs.server_version || github.ref_name }}/benchmarks/ckms_bench_hsm_delegated_softhsm2/report.md"
          echo "  https://package.cosmian.com/kms/${{ inputs.server_version || github.ref_name }}/benchmarks/ckms_bench_pkcs11/report.md"
          echo "  https://package.cosmian.com/kms/${{ inputs.server_version || github.ref_name }}/benchmarks/ckms_bench_pkcs11_hsm_delegated_softhsm2/report.md"

  # ── Job 3: compare the published report against the last released version ──
  # Runs for every build-from-source run (nightly develop, manual branch runs); skipped when a
  # released version is itself being benchmarked (nothing to compare it against here).
  compare:
    name: Compare against last release
    needs: publish
    # Published paths carry no variant, so only the non-fips report is comparable to the release baseline.
    if: inputs.server_version == '' && (inputs.variant || 'non-fips') == 'non-fips'
    runs-on: [self-hosted, benchmark]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          clean: false

      - uses: ./.github/actions/install-mise

      # Highest released X.Y.Z listed on package.cosmian.com that has a published ckms_bench report.
      - name: Find last released version
        id: base
        shell: bash
        run: |
          set -euo pipefail
          URL=https://package.cosmian.com/kms
          for v in $(curl -fsSL "${URL}/" | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -rV); do
            if curl -fsSI -o /dev/null "${URL}/${v}/benchmarks/ckms_bench/env.json"; then
              echo "Last released version with benchmarks: ${v}"
              echo "version=${v}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          done
          echo "::error::No released version with a published ckms_bench report"
          exit 1

      - name: Compare benchmark reports
        run: |
          mise run bench:compare "${{ steps.base.outputs.version }}" "${{ github.ref_name }}" 5 --fail \
            --output target/bench_compare/report.md

      - name: Publish comparison to the job summary
        if: always()
        run: '[[ -f target/bench_compare/report.md ]] && cat target/bench_compare/report.md >> "${GITHUB_STEP_SUMMARY}" || true'

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-compare-${{ github.ref_name }}
          path: target/bench_compare/report.md
          if-no-files-found: ignore
          retention-days: 30
