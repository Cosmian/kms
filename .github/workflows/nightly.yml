---
name: Nightly Packaging

# Triggered nightly (schedule), manually, on tag pushes, or on push to
# develop/main.  Bot commits from nix-update-hashes.yml,
# update-generated-docs.yml and package-and-commit-sbom.yml carry [skip ci]
# so they do NOT re-trigger this workflow.

on:
  push:
    branches:
      - develop
      - main
    tags:
      - '**'
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * * # Daily at midnight

# All jobs are restricted to the upstream repository: they need secrets
# (e.g. PAT_TOKEN to push commits, signing credentials) that forks do not
# have, so on a fork `actions/checkout` fails immediately on the missing token.

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Non-tag refs (branches, schedule, workflow_dispatch), strictly in order:
  #   1. Recompute Nix vendor hashes on the current branch and commit them.
  #   2. Regenerate docs, CBOM, licenses and log index and commit them.
  #   3. Dispatch packaging.yml, wait for it, then retrieve and commit SBOMs.
  #
  # Packaging is dispatched by package-and-commit-sbom.yml, after all the
  # generated-file commits, so the build includes them and runs only once.
  # ─────────────────────────────────────────────────────────────────────────
  update-nix-hashes:
    if: github.repository == 'Cosmian/kms' && !startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/nix-update-hashes.yml
    with:
      ref: ${{ github.ref_name }}
      trigger_packaging: false
    secrets: inherit

  update-generated-docs:
    if: github.repository == 'Cosmian/kms' && !startsWith(github.ref, 'refs/tags/')
    needs: update-nix-hashes
    uses: ./.github/workflows/update-generated-docs.yml
    with:
      ref: ${{ github.ref_name }}
    secrets: inherit

  package-and-commit-sbom:
    if: github.repository == 'Cosmian/kms' && !startsWith(github.ref, 'refs/tags/')
    needs: [update-nix-hashes, update-generated-docs]
    uses: ./.github/workflows/package-and-commit-sbom.yml
    with:
      ref: ${{ github.ref_name }}
    secrets: inherit

  # ─────────────────────────────────────────────────────────────────────────
  # Tag refs only:
  #   Nix hashes are already committed by release.yml — skip the hash update
  #   and go straight to packaging.
  # ─────────────────────────────────────────────────────────────────────────
  packaging:
    if: github.repository == 'Cosmian/kms' && startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/packaging.yml
    secrets: inherit
