---
version: 2

# One grouped PR per ecosystem for minor/patch version updates and one for all
# security updates; majors stay individual PRs since they usually need code changes.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /.mise/scripts/test
      - /.mise/scripts/docs
    schedule:
      interval: weekly
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /.mise/scripts/kmip-go
    schedule:
      interval: weekly
    groups:
      gomod-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      gomod-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /.mise/scripts/docker/ase
      - /.mise/scripts/edb_tde
    schedule:
      interval: weekly
    ignore:
      # SAP ASE needs libaio.so.1, renamed libaio.so.1t64 from Ubuntu 24.04 on.
      - dependency-name: ubuntu
        update-types: [version-update:semver-major]
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
