---
version: 2

# One grouped PR per ecosystem for minor/patch version updates and one for all
# security updates. Major version updates are ignored: they usually break the build
# and must be done by hand with the matching code changes.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      cargo-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: pip
    directories:
      - /.mise/scripts/test
      - /.mise/scripts/docs
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      pip-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /.mise/scripts/kmip-go
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      gomod-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      gomod-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    # Matches minimum-release-age in ui/.npmrc; security updates are not delayed.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /.mise/scripts/docker/ase
      - /.mise/scripts/edb_tde
    schedule:
      interval: weekly
    ignore:
      # Also keeps SAP ASE on Ubuntu 22.04: it needs libaio.so.1, renamed libaio.so.1t64 from 24.04 on.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      docker-security:
        applies-to: security-updates
        patterns: ['*']
