---
version: 2

# One grouped PR per ecosystem for minor/patch version updates and one for all
# security updates (cargo: security updates only, see below). Major version updates are
# ignored: they usually break the build and must be done by hand with the matching code changes.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      actions-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    # Security updates only: `cargo vet check --locked` (supply-chain.yml) is a human gate and
    # Dependabot cannot add the per-version exemptions in supply-chain/, so version-bump PRs
    # always fail it. 0 disables version updates; security updates are unaffected (issue #1265).
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: pip
    directories:
      - /.mise/scripts/test
      - /.mise/scripts/docs
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      pip-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /ui
    # Version updates also bump parents that pin a vulnerable transitive exactly, which
    # security updates cannot do (vitest 5.0.0 -> @vitest/mocker 5.0.0, alerts #119/#120).
    # cooldown: 7-day release age required for npm packages (dependencies.instructions.md §3).
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: gomod
    directory: /.mise/scripts/kmip-go
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      gomod-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      gomod-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /.mise/scripts/docker/ase
      # /.mise/scripts/edb_tde is excluded: its base image is on the private docker.enterprisedb.com
      # registry (no credentials for Dependabot -> private_source_authentication_failure).
    schedule:
      interval: weekly
    ignore:
      # Also keeps SAP ASE on Ubuntu 22.04: it needs libaio.so.1, renamed libaio.so.1t64 from 24.04 on.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # Ubuntu YY.MM tags: 22.04 -> 22.10 is a "minor" bump into an EOL non-LTS release (broke #1299).
      - dependency-name: ubuntu
        update-types: [version-update:semver-minor]
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      docker-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: docker-compose
    directory: /deploy/rbac_rego
    schedule:
      interval: weekly
    ignore:
      # Keycloak (realm import format) and OPA (CLI flags, Rego) majors need a manual check of the RBAC demo stack.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    groups:
      docker-compose-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      docker-compose-security:
        applies-to: security-updates
        patterns: ['*']
