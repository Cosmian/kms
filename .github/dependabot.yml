---
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-patch-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directories:
      - /.mise/scripts/test
      - /.mise/scripts/docs
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /.mise/scripts/kmip-go
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /.mise/scripts/docker/ase
      - /.mise/scripts/edb_tde
    schedule:
      interval: weekly
    ignore:
      # SAP ASE needs libaio.so.1, renamed libaio.so.1t64 from Ubuntu 24.04 on.
      - dependency-name: ubuntu
        update-types: [version-update:semver-major]
