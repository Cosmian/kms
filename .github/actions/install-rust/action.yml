---
name: Install Rust
description: Install the Rust toolchain with dtolnay/rust-toolchain. Must run after actions/checkout.

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable
        components: rustfmt, clippy
