---
name: Run mise test suites
description: >
  Run `mise run test:<suite> --variant <variant> [args]` for each space-separated suite.
  Report every failing suite, then fail. Requires mise (install-mise) and a prior checkout.

inputs:
  suites:
    description: Space-separated suite names (mise tasks test:<suite>)
    required: true
  variant:
    description: FIPS variant (fips or non-fips)
    required: true
  args:
    description: Extra arguments appended to every `mise run` call (word-split)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run suites
      shell: bash
      env:
        SUITES: ${{ inputs.suites }}
        VARIANT: ${{ inputs.variant }}
        ARGS: ${{ inputs.args }}
      run: |
        set -ex
        failed=""
        for suite in ${SUITES}; do
          echo "::group::mise run test:${suite}"
          # shellcheck disable=SC2086 # ARGS is intentionally word-split
          if ! mise run "test:${suite}" --variant "${VARIANT}" ${ARGS}; then failed="${failed} ${suite}"; fi
          echo "::endgroup::"
        done
        if [ -n "${failed}" ]; then echo "::error::Failed suites:${failed}"; exit 1; fi
