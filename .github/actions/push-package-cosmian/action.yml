---
name: Push to package.cosmian.com
description: >
  Upload files to package.cosmian.com under /mnt/package/kms/<version>/<subdir>
  (version = tag name on tags, else last_build/<branch>, unless version-dir is set).
  Uses a dedicated write-only rsync key that the server restricts to the upload root
  (rrsync forced command): no shell, no download, no delete. Requires a prior checkout
  of the repository (this action and its script are read from the workspace), and of
  nothing else the caller does not trust: never download artifacts over the checkout.

inputs:
  subdir:
    description: Sub-directory under the version directory on the server
    required: true
  files:
    description: >
      Newline-separated bash glob patterns, relative to the workspace. Exactly one of
      files or directory is required.
    required: false
    default: ''
  directory:
    description: Directory whose contents (nested files included) are uploaded
    required: false
    default: ''
  version-dir:
    description: Overrides the tag / last_build/<branch> version directory
    required: false
    default: ''
  known-hosts:
    description: Trusted package.cosmian.com host key from vars.PACKAGE_COSMIAN_SSH_KNOWN_HOSTS
    required: true
  ssh-private-key:
    description: Dedicated upload key from secrets.PACKAGE_COSMIAN_SSH_PRIVATE_KEY (package-publish environment)
    required: true

outputs:
  remote-dir:
    description: Remote directory the files were uploaded to
    value: ${{ steps.push.outputs.remote-dir }}

runs:
  using: composite
  steps:
    - name: Push files
      id: push
      shell: bash
      env:
        SUBDIR: ${{ inputs.subdir }}
        FILES: ${{ inputs.files }}
        DIRECTORY: ${{ inputs.directory }}
        VERSION_DIR: ${{ inputs.version-dir }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
        SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
      run: bash "${GITHUB_ACTION_PATH}/../../../.mise/scripts/release/push_package.sh"
