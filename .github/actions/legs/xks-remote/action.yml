---
name: Leg xks-remote
description: >
  Build the KMS binary, deploy it to the remote XKS test server and run the AWS XKS tests against it.

inputs:
  ssh-private-key:
    description: passed from the caller secret
    required: false
    default: ''
  ssh-known-hosts:
    description: passed from the caller secret
    required: false
    default: ''
  ssh-user:
    description: passed from the caller secret
    required: false
    default: ''
  sigv4-access-key-id:
    description: passed from the caller secret
    required: false
    default: ''
  sigv4-secret-access-key:
    description: passed from the caller secret
    required: false
    default: ''
  aws-access-key-id:
    description: passed from the caller secret
    required: false
    default: ''
  aws-secret-access-key:
    description: passed from the caller secret
    required: false
    default: ''
  aws-key-arn:
    description: passed from the caller secret
    required: false
    default: ''

runs:
  using: composite
  steps:
    # ── xks-remote: AWS XKS against the remote test server ──
    - name: Build KMS binary (non-fips, release)
      shell: bash
      run: cargo build --bin cosmian_kms --features non-fips --release

    - name: Deploy binary to XKS test server
      env:
        KMS_XKS_SSH_PRIVATE_KEY: ${{ inputs.ssh-private-key }}
        KMS_XKS_SSH_KNOWN_HOSTS: ${{ inputs.ssh-known-hosts }}
        KMS_XKS_SSH_USER: ${{ inputs.ssh-user }}
        KMS_BIN: target/release/cosmian_kms
      shell: bash
      run: bash .mise/scripts/test/cloud/deploy_xks_remote.sh

    - name: Run XKS tests against remote server
      env:
        KMS_XKS_HOST: aws-xks-kms.cosmian.dev
        KMS_XKS_URI_PREFIX: aws
        KMS_XKS_REGION: eu-west-1
        KMS_XKS_SIGV4_ACCESS_KEY_ID: ${{ inputs.sigv4-access-key-id }}
        KMS_XKS_SIGV4_SECRET_ACCESS_KEY: ${{ inputs.sigv4-secret-access-key }}
      shell: bash
      run: |
        bash .mise/scripts/test/cloud/test_xks_remote.sh

    - name: Run AWS KMS XKS end-to-end test
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        AWS_XKS_KEY_ARN: ${{ inputs.aws-key-arn }}
      shell: bash
      run: bash .mise/scripts/test/cloud/test_xks_aws_e2e.sh
