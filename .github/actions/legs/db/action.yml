---
name: Leg db
description: >
  Export the database service environment of a db:* CI leg (POSTGRES_*, MYSQL_*, PERCONA_*, MARIADB_*, REDIS_*, KMS_*_URL).

runs:
  using: composite
  steps:
    - name: Export database suite environment
      shell: bash
      run: |
        cat >> "$GITHUB_ENV" <<'EOF'
        POSTGRES_USER=kms
        PGUSER=kms
        POSTGRES_PASSWORD=kms
        POSTGRES_DB=kms
        POSTGRES_HOST=localhost
        POSTGRES_PORT=5432
        KMS_POSTGRES_URL=postgresql://kms:kms@127.0.0.1:5432/kms
        MYSQL_DATABASE=kms
        MYSQL_ROOT_PASSWORD=kms
        MYSQL_HOST=localhost
        MYSQL_PORT=3306
        KMS_MYSQL_URL=mysql://root:kms@localhost:3306/kms
        PERCONA_HOST=localhost
        PERCONA_PORT=3307
        KMS_PERCONA_URL=mysql://root:kms@localhost:3307/kms
        MARIADB_HOST=localhost
        MARIADB_PORT=3308
        KMS_MARIADB_URL=mysql://root:kms@localhost:3308/kms
        KMS_SQLITE_PATH=data/shared
        REDIS_HOST=localhost
        REDIS_PORT=6379
        KMS_REDIS_URL=redis://localhost:6379
        EOF
