---
name: Build static OpenSSL
description: >
  Install static OpenSSL on Windows via vcpkg (x64-windows-static) with retries,
  using the pre-installed Strawberry Perl so vcpkg does not download it from
  GitHub (which fails with 504 under rate-limiting).

runs:
  using: composite
  steps:
    - name: Runner image version
      id: img
      shell: pwsh
      run: '"version=$env:ImageVersion" >> $env:GITHUB_OUTPUT'

    - name: Restore vcpkg binaries
      id: vcpkg-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/vcpkg-binary-cache
        key: vcpkg-${{ runner.os }}-${{ steps.img.outputs.version }}-${{ hashFiles('vcpkg.json') }}

    - name: Build static OpenSSL
      shell: pwsh
      env:
        PERL: C:\Strawberry\perl\bin\perl.exe
        PERL_ROOT: C:\Strawberry\perl
        VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}\vcpkg-binary-cache,readwrite
      run: |
        $ErrorActionPreference = "Stop"
        New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\vcpkg-binary-cache" | Out-Null
        $vcpkgExitCode = 1
        for ($attempt = 1; $attempt -le 3; $attempt++) {
          vcpkg install --triplet x64-windows-static
          $vcpkgExitCode = $LASTEXITCODE
          if ($vcpkgExitCode -eq 0) { break }
          if ($attempt -lt 3) { Start-Sleep -Seconds (10 * $attempt) }
        }
        if ($vcpkgExitCode -ne 0) { exit $vcpkgExitCode }
        vcpkg integrate install

    # Save before callers run npm code; a job-end save would trust later changes to the cache.
    - name: Save vcpkg binaries
      if: steps.vcpkg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/vcpkg-binary-cache
        key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
