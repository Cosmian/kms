---
name: Install mise
description: >
  Install mise in a CI-resilient way.
  Uses Homebrew on macOS (never hits GitHub release race conditions)
  and the official install script on Linux (Linux builds are always present).
  Sets MISE_YES=1 so all subsequent mise commands run non-interactively.

runs:
  using: composite
  steps:
    - name: Install mise (macOS via Homebrew)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install mise

    - name: Install mise (Linux via install script)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        # Pinned to an immutable release asset (https://mise.run serves the latest
        # version and changes on every mise release, which would break this check).
        # To bump: set MISE_INSTALL_VERSION, then update the hash with
        #   curl -fsSL https://github.com/jdx/mise/releases/download/<version>/install.sh | sha256sum
        MISE_INSTALL_VERSION="v2026.10.8"
        curl --retry 5 --retry-delay 10 --retry-max-time 300 --retry-all-errors \
          -fsSL "https://github.com/jdx/mise/releases/download/${MISE_INSTALL_VERSION}/install.sh" \
          -o /tmp/mise-install.sh
        echo "0cf85ea287411c3de289ee28b20453e24d5b84172c3d276f3a12db704feb483d  /tmp/mise-install.sh" | sha256sum -c -
        sh /tmp/mise-install.sh
        rm -f /tmp/mise-install.sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        echo "$HOME/.local/share/mise/bin" >> "$GITHUB_PATH"

    - name: Configure mise for CI (non-interactive)
      shell: bash
      run: echo "MISE_YES=1" >> "$GITHUB_ENV"
