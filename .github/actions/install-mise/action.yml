---
name: Install mise
description: >
  Install mise using Homebrew on macOS and a pinned, SHA-256-verified
  release binary on Linux, without installer release-index discovery.
  Sets MISE_YES=1 so all subsequent mise commands run non-interactively.

runs:
  using: composite
  steps:
    - name: Install mise (macOS via Homebrew)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install mise

    - name: Install mise (Linux via pinned binary)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        MISE_VERSION="v2026.10.8"
        # Recompute pins: curl -fsSL https://github.com/jdx/mise/releases/download/<version>/mise-<version>-linux-<arch> | sha256sum
        case "$RUNNER_ARCH" in
          X64)
            arch="x64"
            checksum="c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428"
            ;;
          ARM64)
            arch="arm64"
            checksum="6ee0bd8173f1347514f4974d55fb1fae13aa7f6de0a55338adbefa0667cad7e5"
            ;;
          *)
            echo "::error::Unsupported Linux runner architecture: $RUNNER_ARCH"
            exit 1
            ;;
        esac
        work_dir="$(mktemp -d)"
        trap 'rm -rf -- "${work_dir:?}"' EXIT
        curl --retry 5 --retry-delay 10 --retry-max-time 300 --retry-all-errors \
          -fsSL "https://github.com/jdx/mise/releases/download/${MISE_VERSION}/mise-${MISE_VERSION}-linux-${arch}" \
          -o "${work_dir}/mise"
        echo "${checksum}  ${work_dir}/mise" | sha256sum -c -
        install -Dm755 "${work_dir}/mise" "$HOME/.local/bin/mise"
        "$HOME/.local/bin/mise" --version
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Configure mise for CI (non-interactive)
      shell: bash
      run: echo "MISE_YES=1" >> "$GITHUB_ENV"
